// ─── 구글 드라이브에서 직접 수집한 조문 데이터 ──────────────────────────────
// (Claude가 드라이브 검색으로 실제 내용을 확인한 조문들)
const ALL_ARTICLES = [
  // ── 특허법시행규칙 ──────────────────────────────────────────────────────
  {id:"r1", law:"특허법시행규칙", article:"제1조", title:"목적",
   content:"이 규칙은 「특허법」 및 동법시행령에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함을 목적으로 한다."},
  {id:"r2", law:"특허법시행규칙", article:"제2조", title:"서류의 제출",
   content:"법령에 따라 특허에 관한 절차를 밟기 위하여 제출하는 서류는 법령에 특별한 규정이 있는 경우를 제외하고는 1건마다 작성하여야 하며, 제출인의 성명 및 특허고객번호를 기재하고 서명 또는 날인해야 한다."},
  {id:"r3", law:"특허법시행규칙", article:"제3조", title:"수신인",
   content:"지식재산처 또는 특허심판원에 제출하는 모든 서류는 법령에 특별한 규정이 있는 경우를 제외하고는 지식재산처장 또는 특허심판원장을 수신인으로 하여야 한다."},
  {id:"r4", law:"특허법시행규칙", article:"제4조", title:"서류의 언어",
   content:"지식재산처장 또는 특허심판원장에게 제출하는 서류는 국어로 적어야 한다. 다만, 위임장·국적증명서·우선권증명서류 등 외국어로 적은 서류는 예외로 하며, 이 경우 국어번역문을 첨부하여야 한다."},
  {id:"r5", law:"특허법시행규칙", article:"제5조", title:"대리인의 선임 등",
   content:"특허에 관한 절차를 밟는 자가 대리인에 의하여 그 절차를 밟고자 하는 경우에는 위임장을 지식재산처장 또는 특허심판원장에게 제출하여야 한다. 대리인을 선임하여 절차를 밟으려는 경우에는 대리인의 선임신고를 하여야 한다."},
  {id:"r6", law:"특허법시행규칙", article:"제6조", title:"절차의 보정",
   content:"지식재산처장 또는 특허심판원장은 특허에 관한 절차가 방식에 위반된 경우에는 기간을 정하여 보정을 명하여야 한다. 보정명령을 받은 자는 지정된 기간 내에 보정을 하여야 한다."},
  {id:"r7", law:"특허법시행규칙", article:"제7조", title:"서류의 반출 금지",
   content:"지식재산처 또는 특허심판원에 제출된 서류는 반출하지 못한다. 다만, 지식재산처장 또는 특허심판원장의 허가를 받은 경우에는 그러하지 아니하다."},
  {id:"r8", law:"특허법시행규칙", article:"제8조", title:"절차의 무효",
   content:"특허에 관한 절차를 밟는 자가 보정명령을 받고 지정기간 내에 보정을 하지 아니하면 그 절차는 무효로 된다. 지식재산처장 또는 특허심판원장은 그 취지를 통지하여야 한다."},
  {id:"r9", law:"특허법시행규칙", article:"제9조", title:"증명서 등의 제출",
   content:"특허에 관한 절차를 밟는 자는 법령에 따라 증명서 또는 서약서를 제출하여야 하는 경우에는 이를 지식재산처장 또는 특허심판원장에게 제출하여야 한다."},
  {id:"r10", law:"특허법시행규칙", article:"제10조", title:"증명서의 원용",
   content:"특허에 관한 절차를 밟는 자가 2이상의 절차를 동시에 밟는 경우 제출하는 증명서의 내용이 동일한 경우에는 그 중 1건에 대하여서만 증명서원본을 제출하고 다른 청구 등의 절차에 있어서는 그 사본을 제출할 수 있다."},
  {id:"r11", law:"특허법시행규칙", article:"제11조", title:"명세서 등의 보정",
   content:"특허출원인은 명세서 또는 도면에 대하여 보정을 하려면 보정서를 지식재산처장에게 제출하여야 한다. 보정서에는 보정 전후의 내용을 대비하여 기재하여야 한다."},
  {id:"r12", law:"특허법시행규칙", article:"제12조", title:"출원의 분할",
   content:"특허출원인이 출원을 분할하려는 경우에는 분할출원서에 원출원번호, 분할하는 발명의 내용 등을 기재하여 지식재산처장에게 제출하여야 한다."},
  {id:"r13", law:"특허법시행규칙", article:"제13조", title:"출원의 변경",
   content:"특허출원인이 출원을 변경하려는 경우에는 변경출원서에 원출원번호, 변경 후 출원의 종류 등을 기재하여 지식재산처장에게 제출하여야 한다."},
  {id:"r14", law:"특허법시행규칙", article:"제14조", title:"우선권 주장",
   content:"조약에 의한 우선권을 주장하려는 자는 특허출원서에 최초 출원국, 출원연월일 및 출원번호를 기재하여야 하며, 우선일부터 1년 4개월 이내에 우선권증명서류를 제출하여야 한다."},
  {id:"r15", law:"특허법시행규칙", article:"제15조", title:"우선권 서류",
   content:"우선권을 주장하려는 자는 우선권증명서류를 최선일부터 1년 4개월 이내에 제출하여야 한다. 우선권증명서류는 최초 출원국 특허청이 인증한 것이어야 한다."},
  {id:"r16", law:"특허법시행규칙", article:"제16조", title:"기간의 지정 등",
   content:"보정기간은 1개월 이내, 의견서제출기간은 4개월 이내, 그 밖의 기간은 2개월 이내로 정해야 한다. 기간의 연장신청은 기간연장신청서에 의하며, 추가 연장은 1회에 한하고 30일 이내로 한다."},
  {id:"r17", law:"특허법시행규칙", article:"제17조", title:"기간의 계산",
   content:"이 규칙에서 정한 기간의 계산은 민법에 따른다. 다만, 기간의 초일이 공휴일인 경우에는 그 다음 날부터 기산한다. 기간의 말일이 공휴일이면 그 다음 날로 만료한다."},
  {id:"r18", law:"특허법시행규칙", article:"제18조", title:"절차의 효력",
   content:"특허에 관한 절차는 법령의 규정에 따라 소정의 서식과 방식으로 행하여야 그 효력이 있다. 서류가 지식재산처에 도달한 날을 기준으로 절차의 효력이 발생한다."},
  {id:"r19", law:"특허법시행규칙", article:"제19조", title:"서류의 수리",
   content:"지식재산처장 또는 특허심판원장은 법령에 정한 방식에 위반된 서류에 대하여는 보정을 명한 후 수리하여야 하며, 보정이 없는 경우에는 반려할 수 있다."},
  {id:"r20", law:"특허법시행규칙", article:"제20조", title:"특허고객번호의 부여",
   content:"지식재산처장은 특허에 관한 절차를 밟는 자에게 특허고객번호를 부여한다. 특허고객번호를 부여받으려는 자는 특허고객번호부여신청서를 지식재산처장에게 제출하여야 한다."},
  {id:"r21", law:"특허법시행규칙", article:"제21조", title:"특허출원",
   content:"특허출원을 하려는 자는 특허출원서에 명세서·요약서 및 도면 각 1통을 첨부하여 지식재산처장에게 제출하여야 한다. 명세서에는 발명의 명칭·기술분야·배경기술·해결과제·해결수단·효과·도면설명·실시예 등이 포함되어야 한다."},
  {id:"r22", law:"특허법시행규칙", article:"제22조", title:"명세서의 기재방법",
   content:"명세서에는 발명의 상세한 설명과 청구범위를 기재하여야 한다. 발명의 설명은 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 쉽게 실시할 수 있도록 명확하고 상세하게 기재하여야 한다."},
  {id:"r23", law:"특허법시행규칙", article:"제23조", title:"청구범위의 기재방법",
   content:"청구범위는 발명의 보호를 받으려는 사항을 명확하고 간결하게 기재하여야 한다. 청구항은 독립청구항과 종속청구항으로 구분할 수 있다. 종속청구항은 인용하는 청구항의 번호를 명시하여야 한다."},
  {id:"r24", law:"특허법시행규칙", article:"제24조", title:"요약서의 기재방법",
   content:"요약서에는 발명의 명칭, 기술분야, 해결과제, 해결수단 및 효과를 간단하게 기재하여야 한다. 요약서는 기술정보 제공 목적으로만 사용되며, 특허권의 범위 해석에 사용되지 아니한다."},
  {id:"r25", law:"특허법시행규칙", article:"제25조", title:"도면의 기재방법",
   content:"도면은 명확하고 이해하기 쉽게 작성하여야 한다. 도면에는 도면번호를 기재하여야 하며, 부호는 발명의 설명에서 사용한 부호와 일치하여야 한다."},
  {id:"r26", law:"특허법시행규칙", article:"제26조", title:"생물재료의 기탁",
   content:"특허출원의 발명이 생물재료를 이용하는 경우로서 그 발명을 쉽게 실시할 수 없는 경우에는 출원인은 기탁기관에 생물재료를 기탁하여야 한다."},
  {id:"r27", law:"특허법시행규칙", article:"제27조", title:"분리출원서 제출",
   content:"특허출원인은 2이상의 발명을 포함한 특허출원에 대하여 그 일부를 분리하여 출원하려는 경우에는 분리출원서를 지식재산처장에게 제출하여야 한다."},
  {id:"r28", law:"특허법시행규칙", article:"제28조", title:"출원의 보정기간",
   content:"특허출원인은 출원 후 최초 거절이유통지서를 받기 전까지는 명세서 또는 도면을 보정할 수 있다. 보정은 최초 출원서에 첨부된 명세서 또는 도면에 기재된 사항의 범위 내에서 하여야 한다."},
  {id:"r29", law:"특허법시행규칙", article:"제29조", title:"거절이유통지에 따른 보정",
   content:"특허출원인이 거절이유통지에 따른 보정을 하려는 경우에는 보정서를 지식재산처장에게 제출하여야 한다. 보정서에는 보정 전후의 내용을 대비하여 명확하게 기재하여야 한다."},
  {id:"r30", law:"특허법시행규칙", article:"제30조", title:"특허료의 납부",
   content:"특허료를 납부하려는 자는 특허료납부서를 지식재산처장에게 제출하여야 한다. 특허료는 특허결정 또는 심결 확정일부터 3개월 이내에 납부하여야 한다."},
  {id:"r31", law:"특허법시행규칙", article:"제31조", title:"특허료의 추가 납부",
   content:"특허권자가 특허료 납부기간이 지난 후에도 특허료를 납부하지 아니한 경우에는 그 기간이 지난 날부터 6개월 이내에 특허료의 2배를 납부하면 특허권을 유지할 수 있다."},
  {id:"r32", law:"특허법시행규칙", article:"제32조", title:"특허료 등의 반환",
   content:"잘못 납부된 특허료 또는 수수료는 청구에 의하여 반환된다. 반환은 반환 청구일부터 1년 이내에 청구하여야 하며, 그 기간이 지난 경우에는 반환하지 아니한다."},
  {id:"r33", law:"특허법시행규칙", article:"제33조", title:"특허권의 이전",
   content:"특허권을 이전하려는 경우에는 특허권이전등록신청서를 지식재산처장에게 제출하여야 한다. 이전등록신청서에는 등록원인, 특허번호 등을 기재하고 이전계약서 사본을 첨부하여야 한다."},
  {id:"r34", law:"특허법시행규칙", article:"제34조", title:"전용실시권의 설정 등",
   content:"전용실시권을 설정하거나 이전하려는 경우에는 전용실시권설정등록신청서 또는 전용실시권이전등록신청서를 지식재산처장에게 제출하여야 한다."},
  {id:"r35", law:"특허법시행규칙", article:"제35조", title:"통상실시권의 등록",
   content:"통상실시권을 등록하려는 경우에는 통상실시권등록신청서를 지식재산처장에게 제출하여야 한다. 통상실시권 등록신청서에는 실시 범위, 기간 등을 기재하여야 한다."},
  {id:"r36", law:"특허법시행규칙", article:"제36조", title:"특허권의 소멸",
   content:"특허권자가 특허료를 납부하지 아니하면 특허권은 특허료를 납부하여야 할 기간이 지난 날의 다음 날부터 소멸된 것으로 본다. 다만, 추가납부 기간 내에 납부한 경우에는 특허권은 소멸되지 아니한다."},
  {id:"r37", law:"특허법시행규칙", article:"제37조", title:"특허의 무효심판",
   content:"특허를 무효로 하려는 자는 무효심판청구서에 청구 이유 및 증거를 첨부하여 특허심판원장에게 제출하여야 한다. 무효심판은 누구든지 청구할 수 있다."},
  {id:"r38", law:"특허법시행규칙", article:"제38조", title:"권리범위확인심판",
   content:"권리범위확인심판을 청구하려는 자는 권리범위확인심판청구서를 특허심판원장에게 제출하여야 한다. 확인대상발명의 설명서 및 도면을 첨부하여야 한다."},
  {id:"r39", law:"특허법시행규칙", article:"제39조", title:"심판의 청구",
   content:"심판을 청구하려는 자는 심판청구서를 특허심판원장에게 제출하여야 한다. 심판청구서에는 당사자, 대리인, 심판의 종류 및 청구 이유 등을 기재하여야 한다."},
  {id:"r40", law:"특허법시행규칙", article:"제40조", title:"심판 청구서의 보정",
   content:"심판청구서에 흠결이 있는 경우에는 특허심판원장은 기간을 정하여 보정을 명하여야 한다. 보정명령을 받은 자가 기간 내에 보정하지 아니하면 심판청구는 결정으로 각하된다."},
  {id:"r41", law:"특허법시행규칙", article:"제41조", title:"심판 답변서",
   content:"심판 피청구인은 심판청구서 부본을 받은 날부터 30일 이내에 답변서를 특허심판원장에게 제출하여야 한다. 이 기간은 신청에 의하여 연장될 수 있다."},
  {id:"r42", law:"특허법시행규칙", article:"제42조", title:"출원심사의 청구",
   content:"출원심사의 청구를 하려는 자는 출원심사청구서를 지식재산처장에게 제출하여야 한다. 출원심사청구서에는 특허출원번호, 청구인의 성명 및 특허고객번호를 기재하여야 한다."},
  {id:"r43", law:"특허법시행규칙", article:"제43조", title:"심사 전 국제조사보고서 제출",
   content:"특허출원인은 다른 나라에서의 출원심사 결과를 활용하려면 해당 국가의 심사결과 통지서 또는 국제조사보고서를 지식재산처장에게 제출할 수 있다."},
  {id:"r44", law:"특허법시행규칙", article:"제44조", title:"우선심사 신청",
   content:"특허출원인은 공공의 이익을 위하여 긴급한 처리가 필요한 경우 또는 출원 공개 후 특허출원인이 아닌 자가 업으로서 그 발명을 실시하고 있는 경우 등에는 우선심사를 신청할 수 있다."},
  {id:"r45", law:"특허법시행규칙", article:"제45조", title:"의견서 제출",
   content:"거절이유통지를 받은 특허출원인은 지정기간 내에 의견서를 지식재산처장에게 제출할 수 있다. 의견서에는 거절이유에 대한 반박 내용을 구체적으로 기재하여야 한다."},
  {id:"r46", law:"특허법시행규칙", article:"제46조", title:"특허결정 통지",
   content:"지식재산처장은 특허결정이 있는 경우에는 특허결정서를 특허출원인에게 송달하여야 한다. 특허결정서에는 특허출원번호, 발명의 명칭, 특허결정일자 등을 기재하여야 한다."},
  {id:"r47", law:"특허법시행규칙", article:"제47조", title:"거절결정 불복심판",
   content:"거절결정을 받은 특허출원인은 거절결정일부터 30일 이내에 거절결정불복심판을 청구할 수 있다. 심판청구서에는 거절결정에 대한 불복 이유를 구체적으로 기재하여야 한다."},
  {id:"r48", law:"특허법시행규칙", article:"제48조", title:"특허등록 신청",
   content:"특허결정을 받은 자가 특허권의 설정등록을 받으려면 설정등록신청서에 특허료를 첨부하여 지식재산처장에게 제출하여야 한다. 설정등록신청은 특허결정일부터 3개월 이내에 하여야 한다."},
  {id:"r49", law:"특허법시행규칙", article:"제49조", title:"특허증의 발급",
   content:"지식재산처장은 특허권의 설정등록이 된 때에는 특허증을 특허권자에게 발급하여야 한다. 특허증의 분실, 훼손 또는 오기 등의 경우에는 재발급을 신청할 수 있다."},
  {id:"r50", law:"특허법시행규칙", article:"제50조", title:"특허원부의 등록",
   content:"지식재산처장은 특허권 설정등록, 이전, 소멸 등 특허에 관한 사항을 특허원부에 등록하여야 한다. 특허원부는 전산정보처리조직을 이용하여 관리한다."},
  {id:"r54", law:"특허법시행규칙", article:"제54조", title:"특허공보 게재",
   content:"지식재산처장은 특허결정된 특허출원에 대하여 특허공보에 특허번호, 발명의 명칭, 특허권자, 발명자, 청구범위 등을 게재하여야 한다."},
  {id:"r67", law:"특허법시행규칙", article:"제67조", title:"심판 심리",
   content:"특허심판원은 심판에서 구술심리 또는 서면심리로 심리할 수 있다. 다만, 당사자가 구술심리를 신청한 때에는 서면심리만으로 결정할 수 없다고 인정되는 경우를 제외하고는 구술심리를 하여야 한다."},
  {id:"r100", law:"특허법시행규칙", article:"제100조", title:"국제출원일 통지",
   content:"지식재산처장은 국제출원일을 인정한 때에는 당해 국제출원일을 출원인에게 통지하여야 한다."},
  {id:"r106_10", law:"특허법시행규칙", article:"제106조의10", title:"조사용사본 수령 통지",
   content:"지식재산처장은 조약규칙에 따라 송부된 조사용사본을 수령한 때에는 그 수령사실 및 수령일을 출원인에게 즉시 통지하여야 한다."},
  {id:"r106_11", law:"특허법시행규칙", article:"제106조의11", title:"국제조사보고서 작성",
   content:"지식재산처장은 국제출원일이 인정된 국제출원에 대하여 심사관으로 하여금 국제조사보고서 및 국제조사기관의 견해서를 작성하게 하여야 한다. 다만, 출원인이 지식재산처 외의 기관을 국제조사기관으로 지정한 경우에는 그러하지 아니하다."},
  {id:"r106_14", law:"특허법시행규칙", article:"제106조의14", title:"추가수수료 납부명령",
   content:"심사관은 국제출원이 발명의 단일성요건을 충족하지 아니하는 경우에는 기간을 정하여 추가수수료의 납부를 명하여야 한다. 추가수수료를 납부한 경우 해당 발명에 대하여 국제조사를 수행하여야 한다."},
  {id:"r106_15", law:"특허법시행규칙", article:"제106조의15", title:"추가수수료 이의신청",
   content:"추가수수료납부명령을 받은 자는 국제출원이 발명의 단일성요건을 충족하는 경우 또는 추가수수료 금액이 과다한 경우에는 이의신청료를 납부하고 추가수수료이의신청을 할 수 있다."},
  {id:"r106_16", law:"특허법시행규칙", article:"제106조의16", title:"이의신청 심사·결정",
   content:"추가수수료이의신청은 3인의 심사관합의체가 심사·결정한다. 지식재산처장은 각 이의신청에 대하여 심사관합의체를 구성할 심사관을 지정하고, 그 중 1인을 심사장으로 지정하여야 한다."},
  {id:"r106_16b", law:"특허법시행규칙", article:"제106조의17", title:"발명 명칭 결정",
   content:"국제출원에 발명의 명칭이 기재되어 있지 아니하거나 요건을 충족하지 못하는 경우에는 국제출원된 발명의 명칭은 심사관이 이를 결정한다. 심사관은 결정한 발명의 명칭을 국제조사보고서에 기재하여야 한다."},
  {id:"r106_18", law:"특허법시행규칙", article:"제106조의18", title:"요약서 작성",
   content:"심사관은 국제출원에 요약서가 없거나 요건을 충족하지 못하는 경우에는 요약서를 새로 작성하여야 한다. 출원인은 국제조사보고서 송부일부터 1월 이내에 요약서에 대하여 보정신청 또는 의견진술을 할 수 있다."},
  {id:"r106_19", law:"특허법시행규칙", article:"제106조의19", title:"국제조사보고서 기재사항",
   content:"심사관은 국제조사보고서에 국제출원번호, 국제출원일, 출원인 성명, 발명의 단일성, 발명 명칭 및 요약서, 국제특허분류기호, 관련기술 문헌, 국제조사완료일 등을 기재하여야 한다."},
  {id:"r106_20", law:"특허법시행규칙", article:"제106조의20", title:"국제조사보고서 송부",
   content:"지식재산처장은 심사관이 국제조사보고서 및 국제조사기관의 견해서를 작성한 경우에는 이를 출원인에게 송부하여야 한다. 국제조사보고서를 작성하지 아니한 경우에는 그 취지 및 이유를 통지하여야 한다."},
  {id:"r106_21", law:"특허법시행규칙", article:"제106조의21", title:"인용문헌 사본 신청",
   content:"국제출원에 관한 국제조사보고서에 인용된 문헌의 사본의 발급을 필요로 하는 출원인은 국제출원일부터 7년 이내에 지식재산처장에게 신청할 수 있다."},

  // ── 특허법시행령 ────────────────────────────────────────────────────────
  {id:"e1", law:"특허법시행령", article:"제1조", title:"목적",
   content:"이 영은 「특허법」에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함을 목적으로 한다."},
  {id:"e2", law:"특허법시행령", article:"제2조", title:"특허권의 존속기간 연장 신청",
   content:"특허권의 존속기간의 연장등록을 신청하려는 자는 연장등록신청서에 허가 등의 내용, 허가 등을 받은 날, 연장 기간 등을 기재하여 지식재산처장에게 제출하여야 한다."},
  {id:"e3", law:"특허법시행령", article:"제3조", title:"심사관의 자격",
   content:"심사관은 4급 이상의 일반직공무원 또는 이에 상당하는 공무원으로서 기술분야의 전문지식을 갖춘 자 중에서 지식재산처장이 임명한다."},
  {id:"e4", law:"특허법시행령", article:"제4조", title:"심판관의 자격",
   content:"심판관은 심판 업무를 담당하는 4급 이상의 공무원 또는 특허청의 심사관으로서 소정의 자격 요건을 갖춘 자 중에서 지식재산처장이 임명한다."},
  {id:"e5", law:"특허법시행령", article:"제5조", title:"특허심판원의 구성",
   content:"특허심판원에는 심판장 및 심판관을 두며, 심판부는 3인의 심판관으로 구성한다. 다만, 필요한 경우에는 5인의 심판관으로 구성하는 심판부를 둘 수 있다."},
  {id:"e6", law:"특허법시행령", article:"제6조", title:"수수료 감면",
   content:"특허에 관한 절차를 밟는 자가 국가 또는 지방자치단체, 학교 등의 비영리기관인 경우에는 수수료를 감면받을 수 있다. 감면 신청은 수수료 감면신청서를 지식재산처장에게 제출함으로써 한다."},
  {id:"e7", law:"특허법시행령", article:"제7조", title:"직권보정의 절차",
   content:"심사관은 특허결정을 할 때 명백한 오기 등 경미한 사항에 대하여 직권으로 보정할 수 있다. 직권보정을 한 경우에는 출원인에게 그 내용을 통지하고 의견을 제출할 기회를 주어야 한다."},
  {id:"e8", law:"특허법시행령", article:"제8조", title:"특허원부의 기재사항",
   content:"특허원부에는 특허번호, 출원번호, 발명의 명칭, 특허권자, 발명자, 존속기간, 등록일자, 특허료 납부 현황 등을 기재하여야 한다. 특허원부는 전산 시스템으로 관리한다."},
  {id:"e9", law:"특허법시행령", article:"제9조", title:"국제특허분류의 적용",
   content:"특허출원에 대한 심사에는 세계지식재산기구(WIPO)가 공표하는 국제특허분류(IPC)를 적용한다. 지식재산처장은 필요한 경우 국내 특허분류를 병용할 수 있다."},
  {id:"e10", law:"특허법시행령", article:"제10조", title:"전문기관의 지정",
   content:"지식재산처장은 특허에 관한 조사·분석 및 평가 업무를 위탁할 수 있는 전문기관을 지정할 수 있다. 전문기관 지정 요건, 절차 및 업무 범위는 지식재산처장이 정한다."},

  // ── 특허법 제1조~제43조 (드라이브 원문 2026-03-05 수집) ──────────────────
  {id:"p1", law:"특허법", article:"제1조", title:"목적",
   content:"이 법은 발명을 보호ㆍ장려하고 그 이용을 도모함으로써 기술의 발전을 촉진하여 산업발전에 이바지함을 목적으로 한다."},
  {id:"p2", law:"특허법", article:"제2조", title:"정의",
   content:"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"발명\"이란 자연법칙을 이용한 기술적 사상의 창작으로서 고도(高度)한 것을 말한다. 2. \"특허발명\"이란 특허를 받은 발명을 말한다. 3. \"실시\"란 다음 각 목의 구분에 따른 행위를 말한다. 가. 물건의 발명인 경우: 그 물건을 생산ㆍ사용ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 그 물건의 양도 또는 대여의 청약(양도 또는 대여를 위한 전시를 포함한다)을 하는 행위 나. 방법의 발명인 경우: 그 방법을 사용하는 행위 또는 그 방법의 사용을 청약하는 행위 다. 물건을 생산하는 방법의 발명인 경우: 나목의 행위 외에 그 방법에 의하여 생산한 물건을 사용ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 그 물건의 양도 또는 대여의 청약을 하는 행위"},
  {id:"p3", law:"특허법", article:"제3조", title:"미성년자 등의 행위능력",
   content:"① 미성년자ㆍ피한정후견인 또는 피성년후견인은 법정대리인에 의하지 아니하면 특허에 관한 출원ㆍ청구, 그 밖의 절차(이하 \"특허에 관한 절차\"라 한다)를 밟을 수 없다. 다만, 미성년자와 피한정후견인이 독립하여 법률행위를 할 수 있는 경우에는 그러하지 아니하다. ② 제1항의 법정대리인은 후견감독인의 동의 없이 특허취소신청이나 상대방이 청구한 심판 또는 재심에 대한 절차를 밟을 수 있다."},
  {id:"p4", law:"특허법", article:"제4조", title:"법인이 아닌 사단 등",
   content:"법인이 아닌 사단 또는 재단으로서 대표자나 관리인이 정하여져 있는 경우에는 그 사단 또는 재단의 이름으로 출원심사의 청구인, 특허취소신청인, 심판의 청구인ㆍ피청구인 또는 재심의 청구인ㆍ피청구인이 될 수 있다."},
  {id:"p5", law:"특허법", article:"제5조", title:"재외자의 특허관리인",
   content:"① 국내에 주소 또는 영업소가 없는 자(이하 \"재외자\"라 한다)는 재외자(법인의 경우에는 그 대표자)가 국내에 체류하는 경우를 제외하고는 그 재외자의 특허에 관한 대리인으로서 국내에 주소 또는 영업소가 있는 자(이하 \"특허관리인\"이라 한다)에 의해서만 특허에 관한 절차를 밟거나 이 법 또는 이 법에 따른 명령에 따라 행정청이 한 처분에 대하여 소를 제기할 수 있다. ② 특허관리인은 위임된 권한의 범위에서 특허에 관한 모든 절차 및 이 법 또는 이 법에 따른 명령에 따라 행정청이 한 처분에 관한 소송에서 본인을 대리한다."},
  {id:"p6", law:"특허법", article:"제6조", title:"대리인의 특별수권",
   content:"국내에 주소 또는 영업소가 있는 자로부터 특허에 관한 절차를 밟을 것을 위임받은 대리인은 특별히 권한을 위임받아야만 다음 각 호의 어느 하나에 해당하는 행위를 할 수 있다. 1. 특허출원의 변경ㆍ포기ㆍ취하 2. 특허권의 포기 3. 특허권 존속기간의 연장등록출원의 취하 4. 신청의 취하 5. 청구의 취하 6. 제55조제1항에 따른 우선권 주장 또는 그 취하 7. 제132조의17에 따른 심판청구 8. 복대리인의 선임"},
  {id:"p7", law:"특허법", article:"제7조", title:"대리권의 증명",
   content:"특허에 관한 절차를 밟는 자의 대리인(특허관리인을 포함한다)의 대리권은 서면으로써 증명하여야 한다."},
  {id:"p7_2", law:"특허법", article:"제7조의2", title:"절차의 추인",
   content:"행위능력 또는 법정대리권이 없거나 특허에 관한 절차를 밟는 데 필요한 권한의 위임에 흠이 있는 자가 밟은 절차는 보정된 당사자나 법정대리인이 추인하면 행위를 한 때로 소급하여 그 효력이 발생한다."},
  {id:"p8", law:"특허법", article:"제8조", title:"대리권의 불소멸",
   content:"특허에 관한 절차를 밟는 자의 위임을 받은 대리인의 대리권은 다음 각 호의 어느 하나에 해당하는 사유가 있어도 소멸하지 아니한다. 1. 본인의 사망이나 행위능력의 상실 2. 본인인 법인의 합병에 의한 소멸 3. 본인인 수탁자의 신탁임무 종료 4. 법정대리인의 사망이나 행위능력의 상실 5. 법정대리인의 대리권 소멸이나 변경"},
  {id:"p9", law:"특허법", article:"제9조", title:"복수 대리인",
   content:"특허에 관한 절차를 밟는 자의 대리인이 2인 이상이면 지식재산처장 또는 특허심판원장에 대하여 각각의 대리인이 본인을 대리한다."},
  {id:"p10", law:"특허법", article:"제10조", title:"대리인의 선임 또는 교체 명령",
   content:"① 지식재산처장 또는 심판장은 특허에 관한 절차를 밟는 자가 그 절차를 원활히 수행할 수 없거나 구술심리에서 진술할 능력이 없다고 인정되는 등 그 절차를 밟는 데 적당하지 아니하다고 인정되면 대리인을 선임하여 그 절차를 밟을 것을 명할 수 있다. ② 지식재산처장 또는 심판장은 대리인이 그 절차를 원활히 수행할 수 없다고 인정되면 그 대리인을 바꿀 것을 명할 수 있다. ③ 지식재산처장 또는 심판장은 제1항 및 제2항의 경우에 변리사로 하여금 대리하게 할 것을 명할 수 있다."},
  {id:"p11", law:"특허법", article:"제11조", title:"복수 당사자의 대표",
   content:"① 2인 이상이 특허에 관한 절차를 밟을 때에는 다음 각 호의 어느 하나에 해당하는 사항을 제외하고는 각자가 모두를 대표한다. 다만, 대표자를 선정하여 지식재산처장 또는 특허심판원장에게 신고하면 그 대표자만이 모두를 대표할 수 있다. 1. 특허출원의 변경ㆍ포기ㆍ취하 2. 특허권 존속기간의 연장등록출원의 취하 3. 신청의 취하 4. 청구의 취하 5. 우선권 주장 또는 그 취하 6. 제132조의17에 따른 심판청구"},
  {id:"p12", law:"특허법", article:"제12조", title:"대리인에 관한 준용규정",
   content:"대리인에 관하여는 이 법에 특별한 규정이 있는 경우를 제외하고는 「민사소송법」 제1편제2장제4절을 준용한다."},
  {id:"p13", law:"특허법", article:"제13조", title:"재외자의 재산소재지",
   content:"재외자의 특허권 또는 특허에 관한 권리에 관하여 특허관리인이 있으면 그 특허관리인의 주소 또는 영업소를, 특허관리인이 없으면 지식재산처 소재지를 「민사소송법」 제11조에 따른 재산이 있는 곳으로 본다."},
  {id:"p14", law:"특허법", article:"제14조", title:"기간의 계산",
   content:"이 법 또는 이 법에 따른 명령에서 정한 기간의 계산은 다음 각 호에 따른다. 1. 기간의 첫날은 계산에 넣지 아니한다. 다만, 그 기간이 오전 0시부터 시작하는 경우에는 계산에 넣는다. 2. 기간을 월 또는 연(年)으로 정한 경우에는 역(曆)에 따라 계산한다. 3. 월 또는 연의 처음부터 기간을 기산하지 아니하는 경우에는 마지막의 월 또는 연에서 그 기산일에 해당하는 날의 전날로 기간이 만료한다. 4. 특허에 관한 절차에서 기간의 마지막 날이 공휴일(노동절 및 토요일을 포함한다)에 해당하면 기간은 그 다음 날로 만료한다."},
  {id:"p15", law:"특허법", article:"제15조", title:"기간의 연장 등",
   content:"① 지식재산처장은 청구에 따라 또는 직권으로 제132조의17에 따른 심판의 청구기간을 30일 이내에서 한 차례만 연장할 수 있다. 다만, 도서ㆍ벽지 등 교통이 불편한 지역에 있는 자의 경우에는 총리령으로 정하는 바에 따라 그 횟수 및 기간을 추가로 연장할 수 있다. ② 지식재산처장ㆍ특허심판원장ㆍ심판장 또는 심사관은 이 법에 따라 특허에 관한 절차를 밟을 기간을 정한 경우에는 청구에 따라 그 기간을 단축 또는 연장하거나 직권으로 그 기간을 연장할 수 있다."},
  {id:"p16", law:"특허법", article:"제16조", title:"절차의 무효",
   content:"① 지식재산처장 또는 특허심판원장은 제46조에 따른 보정명령을 받은 자가 지정된 기간에 그 보정을 하지 아니하면 특허에 관한 절차를 무효로 할 수 있다. ② 지식재산처장 또는 특허심판원장은 제1항에 따라 특허에 관한 절차가 무효로 된 경우로서 지정된 기간을 지키지 못한 것이 정당한 사유에 의한 것으로 인정될 때에는 그 사유가 소멸한 날부터 2개월 이내에 그 무효처분을 취소할 수 있다. 다만, 지정된 기간의 만료일부터 1년이 지났을 때에는 그러하지 아니하다."},
  {id:"p17", law:"특허법", article:"제17조", title:"절차의 추후 보완",
   content:"특허에 관한 절차를 밟은 자가 책임질 수 없는 사유로 다음 각 호의 어느 하나에 해당하는 기간을 지키지 못한 경우에는 그 사유가 소멸한 날부터 2개월 이내에 지키지 못한 절차를 추후 보완할 수 있다. 다만, 그 기간의 만료일부터 1년이 지났을 때에는 그러하지 아니하다. 1. 제132조의17에 따른 심판의 청구기간 2. 제180조제1항에 따른 재심의 청구기간"},
  {id:"p18", law:"특허법", article:"제18조", title:"절차의 효력 승계",
   content:"특허권 또는 특허에 관한 권리에 관하여 밟은 절차의 효력은 그 특허권 또는 특허에 관한 권리의 승계인에게 미친다."},
  {id:"p19", law:"특허법", article:"제19조", title:"절차의 속행",
   content:"지식재산처장 또는 심판장은 특허에 관한 절차가 지식재산처 또는 특허심판원에 계속 중일 때 특허권 또는 특허에 관한 권리가 이전되면 그 특허권 또는 특허에 관한 권리의 승계인에 대하여 그 절차를 속행하게 할 수 있다."},
  {id:"p20", law:"특허법", article:"제20조", title:"절차의 중단",
   content:"특허에 관한 절차가 다음 각 호의 어느 하나에 해당하는 경우에는 지식재산처 또는 특허심판원에 계속 중인 절차는 중단된다. 다만, 절차를 밟을 것을 위임받은 대리인이 있는 경우에는 그러하지 아니하다. 1. 당사자가 사망한 경우 2. 당사자인 법인이 합병에 따라 소멸한 경우 3. 당사자가 절차를 밟을 능력을 상실한 경우 4. 당사자의 법정대리인이 사망하거나 그 대리권을 상실한 경우 5. 당사자의 신탁에 의한 수탁자의 임무가 끝난 경우 6. 대표자가 사망하거나 그 자격을 상실한 경우 7. 파산관재인 등이 그 자격을 잃거나 사망한 경우"},
  {id:"p21", law:"특허법", article:"제21조", title:"절차의 수계",
   content:"제20조에 따라 지식재산처 또는 특허심판원에 계속 중인 절차가 중단된 경우에는 다음 각 호의 구분에 따른 자가 그 절차를 수계(受繼)하여야 한다. 1. 제20조제1호의 경우: 사망한 당사자의 상속인ㆍ상속재산관리인 또는 법률에 따라 절차를 속행할 자. 다만, 상속인은 상속을 포기할 수 있을 때까지 그 절차를 수계하지 못한다. 2. 합병에 따라 소멸한 경우: 합병에 따라 설립되거나 합병 후 존속하는 법인 3. 능력 상실 또는 법정대리인 사망: 절차를 밟을 능력을 회복한 당사자 또는 법정대리인이 된 자 4. 수탁자 임무 종료: 새로운 수탁자 5. 대표자 사망 또는 자격 상실: 새로운 대표자 또는 각 당사자"},
  {id:"p22", law:"특허법", article:"제22조", title:"수계신청",
   content:"① 제20조에 따라 중단된 절차에 관한 수계신청은 제21조 각 호의 어느 하나에 해당하는 자가 할 수 있다. ⑤ 지식재산처장 또는 심판관은 제21조 각 호의 어느 하나에 해당하는 자가 중단된 절차를 수계하지 아니하면 직권으로 기간을 정하여 수계를 명하여야 한다. ⑥ 제5항에 따른 기간에 수계가 없는 경우에는 그 기간이 끝나는 날의 다음 날에 수계가 있는 것으로 본다."},
  {id:"p23", law:"특허법", article:"제23조", title:"절차의 중지",
   content:"① 지식재산처장 또는 심판관이 천재지변이나 그 밖의 불가피한 사유로 그 직무를 수행할 수 없을 때에는 지식재산처 또는 특허심판원에 계속 중인 절차는 그 사유가 없어질 때까지 중지된다. ② 당사자에게 일정하지 아니한 기간 동안 절차를 속행할 수 없는 장애사유가 생긴 경우에는 지식재산처장 또는 심판관은 결정으로 장애사유가 해소될 때까지 그 절차의 중지를 명할 수 있다."},
  {id:"p24", law:"특허법", article:"제24조", title:"중단ㆍ중지의 효과",
   content:"특허에 관한 절차가 중단되거나 중지된 경우에는 그 기간의 진행은 정지되고, 그 절차의 수계통지를 하거나 그 절차를 속행하였을 때부터 다시 모든 기간이 진행된다."},
  {id:"p25", law:"특허법", article:"제25조", title:"외국인의 권리능력",
   content:"재외자 중 외국인은 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 특허권 또는 특허에 관한 권리를 누릴 수 없다. 1. 그 외국인이 속하는 국가에서 대한민국 국민에 대하여 그 국가의 국민과 같은 조건으로 특허권 또는 특허에 관한 권리를 인정하는 경우 2. 대한민국이 그 외국인에 대하여 특허권을 인정하는 경우에 그 외국인이 속하는 국가에서 대한민국 국민에 대하여 그 국가의 국민과 같은 조건으로 특허권을 인정하는 경우 3. 조약에 따라 특허권 또는 특허에 관한 권리가 인정되는 경우"},
  {id:"p28", law:"특허법", article:"제28조", title:"서류제출의 효력발생 시기",
   content:"① 이 법 또는 이 법에 따른 명령에 따라 지식재산처장 또는 특허심판원장에게 제출하는 출원서, 청구서, 그 밖의 서류는 지식재산처장 또는 특허심판원장에게 도달한 날부터 제출의 효력이 발생한다. ② 서류를 우편으로 제출하는 경우에는 우편물의 통신일부인에 표시된 날이 분명한 경우 표시된 날에 도달한 것으로 본다. 다만, 특허권 및 특허에 관한 권리의 등록신청서류와 국제출원에 관한 서류를 우편으로 제출하는 경우에는 그 서류가 지식재산처장 또는 특허심판원장에게 도달한 날부터 효력이 발생한다."},
  {id:"p28_2", law:"특허법", article:"제28조의2", title:"고유번호의 부여",
   content:"① 특허에 관한 절차를 밟는 자 중 총리령으로 정하는 자는 지식재산처장 또는 특허심판원장에게 자신의 고유번호의 부여를 신청하여야 한다. ② 지식재산처장 또는 특허심판원장은 신청을 받으면 신청인에게 고유번호를 부여하고, 그 사실을 알려야 한다. ③ 고유번호를 신청하지 아니하면 지식재산처장 또는 특허심판원장은 직권으로 고유번호를 부여하고, 그 사실을 알려야 한다."},
  {id:"p28_3", law:"특허법", article:"제28조의3", title:"전자문서에 의한 절차 수행",
   content:"① 특허에 관한 절차를 밟는 자는 이 법에 따라 지식재산처장 또는 특허심판원장에게 제출하는 특허출원서, 그 밖의 서류를 총리령으로 정하는 방식에 따라 전자문서화하고, 이를 정보통신망을 이용하여 제출하거나 이동식 저장장치 등 전자적 기록매체에 수록하여 제출할 수 있다. ② 제1항에 따라 제출된 전자문서는 이 법에 따라 제출된 서류와 같은 효력을 가진다."},
  {id:"p28_4", law:"특허법", article:"제28조의4", title:"전자문서 이용신고 및 전자서명",
   content:"① 전자문서로 특허에 관한 절차를 밟으려는 자는 미리 지식재산처장 또는 특허심판원장에게 전자문서 이용신고를 하여야 하며, 지식재산처장 또는 특허심판원장에게 제출하는 전자문서에 제출인을 알아볼 수 있도록 전자서명을 하여야 한다. ② 제28조의3에 따라 제출된 전자문서는 제1항에 따른 전자서명을 한 자가 제출한 것으로 본다."},
  {id:"p28_5", law:"특허법", article:"제28조의5", title:"정보통신망을 이용한 통지 등",
   content:"① 지식재산처장ㆍ특허심판원장ㆍ심판장ㆍ심판관 또는 심사관은 전자문서 이용신고를 한 자에게 서류의 통지 및 송달을 하려는 경우에는 정보통신망을 이용하여 통지 등을 할 수 있다. ② 제1항에 따라 정보통신망을 이용하여 한 서류의 통지 등은 서면으로 한 것과 같은 효력을 가진다. ③ 통지 등은 통지를 받을 자가 자신이 사용하는 전산정보처리조직을 통하여 그 서류를 확인한 때에 도달한 것으로 본다."},
  {id:"p29", law:"특허법", article:"제29조", title:"특허요건",
   content:"① 산업상 이용할 수 있는 발명으로서 다음 각 호의 어느 하나에 해당하는 것을 제외하고는 그 발명에 대하여 특허를 받을 수 있다. 1. 특허출원 전에 국내 또는 국외에서 공지(公知)되었거나 공연(公然)히 실시된 발명 2. 특허출원 전에 국내 또는 국외에서 반포된 간행물에 게재되었거나 전기통신회선을 통하여 공중(公衆)이 이용할 수 있는 발명 ② 특허출원 전에 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 제1항 각 호의 어느 하나에 해당하는 발명에 의하여 쉽게 발명할 수 있으면 그 발명에 대해서는 제1항에도 불구하고 특허를 받을 수 없다. ③ 특허출원한 발명이 그 특허출원일 전에 출원된 다른 특허출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 발명과 동일한 경우에 그 발명은 제1항에도 불구하고 특허를 받을 수 없다. 다만, 그 특허출원의 발명자와 다른 특허출원의 발명자가 같거나 그 특허출원을 출원한 때의 출원인과 다른 특허출원의 출원인이 같은 경우에는 그러하지 아니하다."},
  {id:"p30", law:"특허법", article:"제30조", title:"공지 등이 되지 아니한 발명으로 보는 경우",
   content:"① 특허를 받을 수 있는 권리를 가진 자의 발명이 다음 각 호의 어느 하나에 해당하게 된 경우 그 날부터 12개월 이내에 특허출원을 하면 그 발명은 제29조제1항 각 호의 어느 하나에 해당하지 아니한 것으로 본다. 1. 특허를 받을 수 있는 권리를 가진 자에 의하여 그 발명이 제29조제1항 각 호의 어느 하나에 해당하게 된 경우. 다만, 조약 또는 법률에 따라 국내 또는 국외에서 출원공개되거나 등록공고된 경우는 제외한다. 2. 특허를 받을 수 있는 권리를 가진 자의 의사에 반하여 그 발명이 제29조제1항 각 호의 어느 하나에 해당하게 된 경우 ② 제1항제1호를 적용받으려는 자는 특허출원서에 그 취지를 적어 출원하여야 하고, 이를 증명할 수 있는 서류를 특허출원일부터 30일 이내에 지식재산처장에게 제출하여야 한다."},
  {id:"p32", law:"특허법", article:"제32조", title:"특허를 받을 수 없는 발명",
   content:"공공의 질서 또는 선량한 풍속에 어긋나거나 공중의 위생을 해칠 우려가 있는 발명에 대해서는 제29조제1항에도 불구하고 특허를 받을 수 없다."},
  {id:"p33", law:"특허법", article:"제33조", title:"특허를 받을 수 있는 자",
   content:"① 발명을 한 사람 또는 그 승계인은 이 법에서 정하는 바에 따라 특허를 받을 수 있는 권리를 가진다. 다만, 지식재산처 직원 및 특허심판원 직원은 상속이나 유증(遺贈)의 경우를 제외하고는 재직 중 특허를 받을 수 없다. ② 2명 이상이 공동으로 발명한 경우에는 특허를 받을 수 있는 권리를 공유한다."},
  {id:"p34", law:"특허법", article:"제34조", title:"무권리자의 특허출원과 정당한 권리자의 보호",
   content:"발명자가 아닌 자로서 특허를 받을 수 있는 권리의 승계인이 아닌 자(이하 \"무권리자\"라 한다)가 한 특허출원이 무권리자의 특허출원 후에 한 정당한 권리자의 특허출원은 무권리자가 특허출원한 때에 특허출원한 것으로 본다. 다만, 무권리자가 특허를 받지 못하게 된 날부터 30일이 지난 후에 정당한 권리자가 특허출원을 한 경우에는 그러하지 아니하다."},
  {id:"p35", law:"특허법", article:"제35조", title:"무효심결 후 정당한 권리자의 보호",
   content:"무권리자의 특허를 무효로 한다는 심결이 확정된 경우에는 그 무권리자의 특허출원 후에 한 정당한 권리자의 특허출원은 무효로 된 그 특허의 출원 시에 특허출원한 것으로 본다. 다만, 심결이 확정된 날부터 30일이 지난 후에 정당한 권리자가 특허출원을 한 경우에는 그러하지 아니하다."},
  {id:"p36", law:"특허법", article:"제36조", title:"선출원",
   content:"① 동일한 발명에 대하여 다른 날에 둘 이상의 특허출원이 있는 경우에는 먼저 특허출원한 자만이 그 발명에 대하여 특허를 받을 수 있다. ② 동일한 발명에 대하여 같은 날에 둘 이상의 특허출원이 있는 경우에는 특허출원인 간에 협의하여 정한 하나의 특허출원인만이 그 발명에 대하여 특허를 받을 수 있다. 다만, 협의가 성립하지 아니하거나 협의를 할 수 없는 경우에는 어느 특허출원인도 그 발명에 대하여 특허를 받을 수 없다. ④ 특허출원 또는 실용신안등록출원이 포기, 무효, 취하 또는 거절결정이나 거절한다는 취지의 심결이 확정된 경우 그 특허출원 또는 실용신안등록출원은 처음부터 없었던 것으로 본다."},
  {id:"p37", law:"특허법", article:"제37조", title:"특허를 받을 수 있는 권리의 이전 등",
   content:"① 특허를 받을 수 있는 권리는 이전할 수 있다. ② 특허를 받을 수 있는 권리는 질권의 목적으로 할 수 없다. ③ 특허를 받을 수 있는 권리가 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 그 지분을 양도할 수 있다."},
  {id:"p38", law:"특허법", article:"제38조", title:"특허를 받을 수 있는 권리의 승계",
   content:"① 특허출원 전에 이루어진 특허를 받을 수 있는 권리의 승계는 그 승계인이 특허출원을 하여야 제3자에게 대항할 수 있다. ④ 특허출원 후에는 특허를 받을 수 있는 권리의 승계는 상속, 그 밖의 일반승계의 경우를 제외하고는 특허출원인변경신고를 하여야만 그 효력이 발생한다. ⑤ 특허를 받을 수 있는 권리의 상속, 그 밖의 일반승계가 있는 경우에는 승계인은 지체 없이 그 취지를 지식재산처장에게 신고하여야 한다."},
  {id:"p41", law:"특허법", article:"제41조", title:"국방상 필요한 발명",
   content:"① 정부는 국방상 필요한 경우 외국에 특허출원하는 것을 금지하거나 발명자ㆍ출원인 및 대리인에게 그 특허출원의 발명을 비밀로 취급하도록 명할 수 있다. 다만, 정부의 허가를 받은 경우에는 외국에 특허출원을 할 수 있다. ② 정부는 특허출원된 발명이 국방상 필요한 경우에는 특허를 하지 아니할 수 있으며, 전시ㆍ사변 또는 이에 준하는 비상시에 국방상 필요한 경우에는 특허를 받을 수 있는 권리를 수용할 수 있다. ③ 손실에 대해서는 정부는 정당한 보상금을 지급하여야 한다."},
  {id:"p42", law:"특허법", article:"제42조", title:"특허출원",
   content:"① 특허를 받으려는 자는 다음 각 호의 사항을 적은 특허출원서를 지식재산처장에게 제출하여야 한다. 1. 특허출원인의 성명 및 주소 2. 대리인의 성명 및 주소나 영업소의 소재지 3. 발명의 명칭 4. 발명자의 성명 및 주소 ② 제1항에 따른 특허출원서에는 발명의 설명ㆍ청구범위를 적은 명세서와 필요한 도면 및 요약서를 첨부하여야 한다. ③ 발명의 설명은: 1. 통상의 지식을 가진 사람이 그 발명을 쉽게 실시할 수 있도록 명확하고 상세하게 적을 것 2. 그 발명의 배경이 되는 기술을 적을 것 ④ 청구범위에는 보호받으려는 사항을 적은 항(이하 \"청구항\"이라 한다)이 하나 이상 있어야 하며: 1. 발명의 설명에 의하여 뒷받침될 것 2. 발명이 명확하고 간결하게 적혀 있을 것"},
  {id:"p42_2", law:"특허법", article:"제42조의2", title:"특허출원일의 인정 등",
   content:"① 특허출원일은 명세서 및 필요한 도면을 첨부한 특허출원서가 지식재산처장에게 도달한 날로 한다. 이 경우 명세서에 청구범위는 적지 아니할 수 있으나, 발명의 설명은 적어야 한다. ② 특허출원인은 제1항 후단에 따라 청구범위를 적지 아니한 경우에는 제64조제1항 각 호의 구분에 따른 날부터 1년 2개월이 되는 날까지 명세서에 청구범위를 적는 보정을 하여야 한다. ③ 특허출원인이 제2항에 따른 보정을 하지 아니한 경우에는 제2항에 따른 기한이 되는 날의 다음 날에 해당 특허출원을 취하한 것으로 본다."},
  {id:"p42_3", law:"특허법", article:"제42조의3", title:"외국어특허출원",
   content:"① 특허출원인이 명세서 및 도면을 국어가 아닌 총리령으로 정하는 언어로 적겠다는 취지를 특허출원을 할 때 특허출원서에 적은 경우에는 그 언어로 적을 수 있다. ② 외국어특허출원을 한 경우에는 제64조제1항 각 호의 구분에 따른 날부터 1년 2개월이 되는 날까지 그 명세서 및 도면의 국어번역문을 제출하여야 한다. ④ 특허출원인이 제2항에 따른 명세서의 국어번역문을 제출하지 아니한 경우에는 제2항에 따른 기한이 되는 날의 다음 날에 해당 특허출원을 취하한 것으로 본다."},
  {id:"p43", law:"특허법", article:"제43조", title:"요약서",
   content:"제42조제2항에 따른 요약서는 기술정보로서의 용도로 사용하여야 하며, 특허발명의 보호범위를 정하는 데에는 사용할 수 없다."},
  // ===== 제44조~제119조 (드라이브 원문) =====
  {id:"p44",law:"특허법",article:"제44조",title:"공동출원",content:"특허를 받을 수 있는 권리가 공유인 경우에는 공유자 모두가 공동으로 특허출원을 하여야 한다."},
  {id:"p45",law:"특허법",article:"제45조",title:"1특허출원의 범위",content:"① 특허출원은 하나의 발명마다 하나의 특허출원으로 한다. 다만, 하나의 총괄적 발명의 개념을 형성하는 일 군(群)의 발명에 대하여 하나의 특허출원으로 할 수 있다.\n② 제1항 단서에 따라 일 군의 발명에 대하여 하나의 특허출원으로 할 수 있는 요건은 대통령령으로 정한다."},
  {id:"p46",law:"특허법",article:"제46조",title:"절차의 보정",content:"지식재산처장 또는 특허심판원장은 특허에 관한 절차가 다음 각 호의 어느 하나에 해당하는 경우에는 기간을 정하여 보정을 명하여야 한다.\n1. 제3조제1항 또는 제6조를 위반한 경우\n2. 이 법 또는 이 법에 따른 명령으로 정하는 방식을 위반한 경우\n3. 제82조에 따라 내야 할 수수료를 내지 아니한 경우"},
  {id:"p47",law:"특허법",article:"제47조",title:"특허출원의 보정",content:"① 특허출원인은 특허결정의 등본을 송달하기 전까지 명세서 또는 도면을 보정할 수 있다. 다만, 거절이유통지를 받은 후에는 다음 각 호의 기간에만 보정할 수 있다.\n1. 최초 거절이유통지를 받은 경우: 해당 거절이유통지에 따른 의견서 제출기간\n2. 보정에 따라 발생한 거절이유에 대하여 거절이유통지를 받은 경우: 해당 거절이유통지에 따른 의견서 제출기간\n3. 재심사를 청구하는 경우: 청구할 때\n② 명세서 또는 도면의 보정은 최초로 첨부한 명세서 또는 도면에 기재된 사항의 범위에서 하여야 한다.\n③ 제1항제2호 및 제3호에 따른 청구범위에 대한 보정은 청구범위를 감축하는 경우, 잘못 기재된 사항을 정정하는 경우, 분명하지 아니하게 기재된 사항을 명확하게 하는 경우에만 할 수 있다."},
  {id:"p51",law:"특허법",article:"제51조",title:"보정각하",content:"① 심사관은 제47조제1항제2호 및 제3호에 따른 보정이 같은 조 제2항 또는 제3항을 위반하거나 그 보정에 따라 새로운 거절이유가 발생한 것으로 인정하면 결정으로 그 보정을 각하하여야 한다.\n② 각하결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n③ 각하결정에 대해서는 불복할 수 없다."},
  {id:"p52",law:"특허법",article:"제52조",title:"분할출원",content:"① 특허출원인은 둘 이상의 발명을 하나의 특허출원으로 한 경우에는 명세서 또는 도면에 기재된 사항의 범위에서 다음 각 호의 기간에 그 일부를 하나 이상의 특허출원으로 분할할 수 있다.\n1. 제47조제1항에 따라 보정을 할 수 있는 기간\n2. 특허거절결정등본을 송달받은 날부터 3개월 이내의 기간\n3. 특허결정 또는 특허거절결정 취소심결의 등본을 송달받은 날부터 3개월 이내의 기간\n② 분할출원이 있는 경우 그 분할출원은 특허출원한 때에 출원한 것으로 본다."},
  {id:"p52_2",law:"특허법",article:"제52조의2",title:"분리출원",content:"특허거절결정을 받은 자는 심판청구가 기각된 경우 그 심결의 등본을 송달받은 날부터 30일 이내에 명세서 또는 도면에 기재된 사항의 범위에서 그 특허출원의 일부를 새로운 특허출원으로 분리할 수 있다."},
  {id:"p53",law:"특허법",article:"제53조",title:"변경출원",content:"① 실용신안등록출원인은 명세서 또는 도면에 기재된 사항의 범위에서 그 실용신안등록출원을 특허출원으로 변경할 수 있다.\n② 변경출원이 있는 경우에 그 변경출원은 실용신안등록출원을 한 때에 특허출원한 것으로 본다.\n④ 변경출원이 있는 경우에는 그 실용신안등록출원은 취하된 것으로 본다."},
  {id:"p54",law:"특허법",article:"제54조",title:"조약에 의한 우선권 주장",content:"① 조약에 따라 우선권을 주장하려는 자는 제29조 및 제36조를 적용할 때에 그 당사국에 출원한 날을 대한민국에 특허출원한 날로 본다.\n② 우선권을 주장하려는 자는 우선권 주장의 기초가 되는 최초의 출원일부터 1년 이내에 특허출원을 하지 아니하면 우선권을 주장할 수 없다."},
  {id:"p55",law:"특허법",article:"제55조",title:"특허출원 등을 기초로 한 우선권 주장",content:"① 특허를 받으려는 자는 선출원의 명세서 또는 도면에 기재된 발명을 기초로 우선권을 주장할 수 있다. 다만, 다음 각 호의 경우에는 그러하지 아니하다.\n1. 선출원의 출원일부터 1년이 지난 후에 출원된 경우\n2. 선출원이 분할출원·분리출원 또는 변경출원인 경우\n3. 선출원이 포기·무효 또는 취하된 경우\n4. 선출원이 설정등록되었거나 거절결정이 확정된 경우"},
  {id:"p56",law:"특허법",article:"제56조",title:"선출원의 취하 간주",content:"① 우선권 주장의 기초가 된 선출원은 그 출원일부터 1년 3개월이 지난 때에 취하된 것으로 본다."},
  {id:"p57",law:"특허법",article:"제57조",title:"심사관에 의한 심사",content:"① 지식재산처장은 심사관에게 특허출원을 심사하게 한다.\n② 심사관의 자격에 관하여 필요한 사항은 대통령령으로 정한다."},
    {id:"p58",law:"특허법",article:"제58조",title:"심사관에 의한 심사",content:"① 지식재산처장은 심사관에게 특허출원을 심사하게 한다.\n② 심사관의 자격에 관하여 필요한 사항은 대통령령으로 정한다.\n[앞의 제57조와 통합되는 경우가 있으나, 조문번호상 별도 규정]"},
{id:"p59",law:"특허법",article:"제59조",title:"출원심사의 청구",content:"① 특허출원에 대하여 심사청구가 있을 때에만 이를 심사한다.\n② 누구든지 특허출원에 대하여 특허출원일부터 3년 이내에 지식재산처장에게 출원심사의 청구를 할 수 있다.\n④ 출원심사의 청구는 취하할 수 없다.\n⑤ 출원심사의 청구를 할 수 있는 기간에 청구가 없으면 그 특허출원은 취하한 것으로 본다."},
    {id:"p60",law:"특허법",article:"제60조",title:"출원심사 청구서 제출",content:"① 출원심사의 청구를 하려는 자는 청구인의 성명·주소, 청구대상 특허출원의 표시 등을 적은 출원심사청구서를 지식재산처장에게 제출하여야 한다.\n② 지식재산처장은 출원공개 전 심사청구가 있으면 공개 시에, 공개 후 심사청구가 있으면 지체 없이 그 취지를 특허공보에 게재하여야 한다.\n③ 지식재산처장은 특허출원인이 아닌 자로부터 심사청구가 있으면 그 취지를 특허출원인에게 알려야 한다."},
{id:"p61",law:"특허법",article:"제61조",title:"우선심사",content:"지식재산처장은 다음 각 호의 어느 하나에 해당하는 특허출원에 대해서는 심사관에게 다른 특허출원에 우선하여 심사하게 할 수 있다.\n1. 출원공개 후 특허출원인이 아닌 자가 업으로서 특허출원된 발명을 실시하고 있다고 인정되는 경우\n2. 대통령령으로 정하는 특허출원으로서 긴급하게 처리할 필요가 있다고 인정되는 경우\n3. 재난의 예방·대응·복구 등에 필요하다고 인정되는 경우"},
  {id:"p62",law:"특허법",article:"제62조",title:"특허거절결정",content:"심사관은 특허출원이 다음 각 호의 어느 하나의 거절이유에 해당하는 경우에는 특허거절결정을 하여야 한다.\n1. 제25조·제29조·제32조·제36조 또는 제44조에 따라 특허를 받을 수 없는 경우\n2. 특허를 받을 수 있는 권리를 가지지 아니한 경우\n3. 조약을 위반한 경우\n4. 제42조 또는 제45조에 따른 요건을 갖추지 아니한 경우\n5. 제47조제2항에 따른 범위를 벗어난 보정인 경우"},
  {id:"p63",law:"특허법",article:"제63조",title:"거절이유통지",content:"① 심사관은 특허거절결정을 하려는 경우 특허출원인에게 거절이유를 통지하고, 기간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다.\n② 거절이유를 통지할 때에는 거절되는 청구항을 명확히 밝히고, 그 청구항에 관한 거절이유를 구체적으로 적어야 한다."},
  {id:"p64",law:"특허법",article:"제64조",title:"출원공개",content:"① 지식재산처장은 특허출원일부터 1년 6개월이 지난 후 또는 그 전이라도 특허출원인이 신청한 경우에는 특허공보에 게재하여 출원공개를 하여야 한다."},
  {id:"p65",law:"특허법",article:"제65조",title:"출원공개의 효과",content:"① 특허출원인은 출원공개 후 그 특허출원된 발명을 업으로서 실시한 자에게 서면으로 경고할 수 있다.\n② 특허출원인은 경고를 받거나 출원공개된 발명임을 알고 실시한 자에게 그 경고를 받거나 알았을 때부터 특허권 설정등록 시까지의 기간 동안 합리적으로 받을 수 있는 금액에 상당하는 보상금의 지급을 청구할 수 있다.\n③ 보상금청구권은 특허권이 설정등록된 후에만 행사할 수 있다."},
  {id:"p66",law:"특허법",article:"제66조",title:"특허결정",content:"심사관은 특허출원에 대하여 거절이유를 발견할 수 없으면 특허결정을 하여야 한다."},
  {id:"p67",law:"특허법",article:"제67조",title:"특허여부결정의 방식",content:"① 특허결정 및 특허거절결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n② 지식재산처장은 특허여부결정이 있는 경우에는 그 결정의 등본을 특허출원인에게 송달하여야 한다."},
  {id:"p67_2",law:"특허법",article:"제67조의2",title:"재심사의 청구",content:"① 특허출원인은 특허결정의 등본을 송달받은 날부터 설정등록 전까지 또는 특허거절결정등본을 송달받은 날부터 3개월 이내에 명세서 또는 도면을 보정하여 재심사를 청구할 수 있다.\n③ 재심사가 청구된 경우 종전에 이루어진 특허결정 또는 특허거절결정은 취소된 것으로 본다.\n④ 재심사의 청구는 취하할 수 없다."},
    {id:"p68",law:"특허법",article:"제68조",title:"심사관의 제척",content:"특허출원의 심사에 관하여는 제148조제1호부터 제5호까지 및 제7호를 준용한다."},
{id:"p79",law:"특허법",article:"제79조",title:"특허료",content:"① 특허권의 설정등록을 받으려는 자는 설정등록일부터 3년분의 특허료를 내야 하고, 특허권자는 그 다음 해부터의 특허료를 매년 1년분씩 내야 한다."},
    {id:"p80",law:"특허법",article:"제80조",title:"이해관계인의 특허료 납부",content:"① 이해관계인은 특허료를 내야 할 자의 의사와 관계없이 특허료를 낼 수 있다.\n② 이해관계인은 제1항에 따라 특허료를 낸 경우에는 내야 할 자가 현재 이익을 얻는 한도에서 그 비용의 상환을 청구할 수 있다."},
  {id:"p81",law:"특허법",article:"제81조",title:"특허료의 추가납부",content:"① 특허권의 설정등록을 받으려는 자 또는 특허권자는 납부기간이 지난 후에도 6개월 이내(추가납부기간)에 특허료를 추가로 낼 수 있다.\n② 추가납부 시에는 낼 특허료의 2배 범위 내에서 총리령으로 정하는 금액을 납부하여야 한다.\n③ 추가납부기간에도 내지 아니한 경우, 특허출원은 포기한 것으로 보며 특허권은 해당 기간 만료일 다음 날로 소급하여 소멸한다."},
  {id:"p82",law:"특허법",article:"제82조",title:"수수료",content:"① 특허에 관한 절차를 밟는 자는 수수료를 내야 한다.\n② 특허출원인이 아닌 자가 출원심사를 청구한 후, 명세서 보정으로 청구항 수가 증가하면 증가한 청구항의 심사청구료는 특허출원인이 내야 한다.\n③ 수수료, 납부방법 및 납부기간 등은 총리령으로 정한다."},
  {id:"p83",law:"특허법",article:"제83조",title:"특허료 및 수수료의 감면",content:"① 지식재산처장은 국가에 속하는 출원·특허권에 관한 수수료·특허료, 심사관의 무효심판청구 수수료는 면제한다.\n② 국민기초생활보장 수급자, 재난지역 거주자 등 총리령으로 정하는 자에 대해 특허료 및 수수료를 감면할 수 있다.\n④ 거짓·부정한 방법으로 감면받은 자에 대해 감면액의 2배를 징수할 수 있다."},
  {id:"p84",law:"특허법",article:"제84조",title:"특허료 및 수수료의 반환",content:"① 납부된 특허료 및 수수료는 ①잘못 납부된 경우, ②특허무효심결 확정 다음 해 이후 특허료, ③특허출원 후 1개월 내 취하 시 출원료, ④심사청구 후 거절이유통지 전 취하 시 심사청구료, ⑤특허권 포기 다음 해 이후 특허료 등에 해당하면 반환한다.\n③ 반환청구는 통지받은 날부터 5년이 지나면 할 수 없다."},
  {id:"p85",law:"특허법",article:"제85조",title:"특허원부",content:"① 지식재산처장은 특허원부를 갖추어 두고 다음 사항을 등록한다: 특허권의 설정·이전·소멸·회복·처분의 제한·존속기간 연장, 전용실시권·통상실시권의 설정·이전·변경·소멸, 질권의 설정·이전·변경·소멸.\n② 특허원부는 전부 또는 일부를 전자적 기록매체로 작성할 수 있다.\n④ 특허발명의 명세서·도면 등은 특허원부의 일부로 본다."},
  {id:"p86",law:"특허법",article:"제86조",title:"특허증",content:"① 지식재산처장은 특허권의 설정등록을 한 경우 특허권자에게 특허증을 발급하여야 한다.\n② 특허증이 특허원부나 그 밖의 서류와 맞지 아니하면 신청에 따라 또는 직권으로 특허증을 회수하여 정정발급하거나 새로운 특허증을 발급하여야 한다."},
  {id:"p81_2",law:"특허법",article:"제81조의2",title:"특허료 일부 미납 시 보전명령",content:"① 지식재산처장은 특허료의 일부를 내지 아니한 경우에는 특허료의 보전(補塡)을 명하여야 한다.\n② 보전명령을 받은 자는 그 명령을 받은 날부터 1개월 이내(보전기간)에 특허료를 보전할 수 있다.\n③ 보전 시에는 내지 아니한 금액의 2배의 범위에서 총리령으로 정한 금액을 내야 한다."},
  {id:"p81_3",law:"특허법",article:"제81조의3",title:"특허료 미납 시 권리회복",content:"① 정당한 사유로 추가납부기간에 특허료를 내지 아니하였거나 보전기간에 보전하지 아니한 경우에는 그 사유가 소멸한 날부터 2개월 이내에 납부·보전할 수 있다. 다만, 만료일 중 늦은 날부터 1년이 지난 때에는 그러하지 아니하다.\n③ 추가납부기간 만료일부터 3개월 이내에 특허료의 2배를 내고 소멸한 권리의 회복을 신청할 수 있다."},
  {id:"p88",law:"특허법",article:"제88조",title:"특허권의 존속기간",content:"① 특허권의 존속기간은 특허권을 설정등록한 날부터 특허출원일 후 20년이 되는 날까지로 한다.\n② 정당한 권리자의 특허출원이 제34조 또는 제35조에 따라 특허된 경우에는 특허권의 존속기간은 무권리자의 특허출원일의 다음 날부터 기산한다."},
  {id:"p89",law:"특허법",article:"제89조",title:"허가등에 따른 존속기간의 연장",content:"① 다른 법령에 따라 허가를 받거나 등록 등을 하여야 하고, 유효성·안전성 등의 시험으로 인하여 장기간이 소요되는 발명인 경우에는 그 실시할 수 없었던 기간에 대하여 5년의 기간까지 특허권의 존속기간을 한 차례만 연장할 수 있다. 다만, 허가등을 받은 날부터 14년을 초과하여 연장할 수 없다."},
  {id:"p90",law:"특허법",article:"제90조",title:"존속기간 연장등록출원",content:"① 허가등에 의한 존속기간 연장등록출원 시 출원인의 성명·주소, 연장대상특허권의 특허번호, 연장신청 기간, 허가등의 내용, 연장이유 등을 기재한 출원서를 지식재산처장에게 제출하여야 한다.\n② 허가등을 받은 날부터 3개월 이내에 출원하여야 하며, 존속기간 만료 전 6개월 이후에는 출원할 수 없다.\n④ 연장등록출원이 있으면 존속기간은 연장된 것으로 본다. 다만, 연장등록거절결정이 확정된 경우에는 그러하지 아니하다."},
  {id:"p91",law:"특허법",article:"제91조",title:"연장등록거절결정",content:"심사관은 존속기간 연장등록출원이 다음에 해당하면 연장등록거절결정을 하여야 한다: 허가등을 받을 필요가 없다고 인정되는 경우, 특허권자 등이 허가등을 받지 아니한 경우, 연장신청 기간이 인정되는 연장기간을 초과하는 경우, 연장등록출원인이 해당 특허권자가 아닌 경우, 공유자 전원이 공동으로 출원하지 아니한 경우 등."},
  {id:"p92",law:"특허법",article:"제92조",title:"연장등록결정",content:"① 심사관은 제91조 각 호의 사유를 발견할 수 없을 때에는 연장등록결정을 하여야 한다.\n② 지식재산처장은 연장등록결정이 있으면 특허원부에 등록하고, 특허권자의 성명·주소, 특허번호, 연장등록 연월일, 연장기간, 허가등의 내용을 특허공보에 게재하여야 한다."},
  {id:"p92_3",law:"특허법",article:"제92조의3",title:"심사지연에 의한 연장등록출원",content:"① 심사지연(출원일부터 4년과 심사청구일부터 3년 중 늦은 날보다 지연)으로 인한 연장등록출원 시 출원인의 성명·주소, 연장 대상 특허번호, 연장신청 기간, 연장이유를 기재한 출원서를 제출하여야 한다.\n② 출원은 특허권의 설정등록일부터 3개월 이내에 하여야 한다."},
  {id:"p92_4",law:"특허법",article:"제92조의4",title:"심사지연 연장등록거절결정",content:"심사관은 심사지연에 의한 연장등록출원이 연장신청 기간이 인정 기간을 초과한 경우, 연장등록출원인이 해당 특허권자가 아닌 경우, 공유자 전원이 공동으로 출원하지 아니한 경우에는 연장등록거절결정을 하여야 한다."},
  {id:"p92_5",law:"특허법",article:"제92조의5",title:"심사지연 연장등록결정",content:"① 심사관은 제92조의4 각 호의 사유를 발견할 수 없으면 연장등록결정을 하여야 한다.\n② 지식재산처장은 연장등록결정이 있으면 특허원부에 등록하고, 특허권자의 성명·주소, 특허번호, 연장등록 연월일, 연장기간을 특허공보에 게재하여야 한다."},
  {id:"p93",law:"특허법",article:"제93조",title:"존속기간 연장등록출원의 심사준용",content:"특허권의 존속기간의 연장등록출원의 심사에 관하여는 제57조제1항, 제63조, 제67조, 제78조제1항·제3항, 제148조제1호부터 제5호까지 및 같은 조 제7호를 준용한다."},
{id:"p94",law:"특허법",article:"제94조",title:"특허권의 효력",content:"① 특허권자는 업으로서 특허발명을 실시할 권리를 독점한다. 다만, 전용실시권을 설정하였을 때에는 전용실시권자가 실시할 권리를 독점하는 범위에서는 그러하지 아니하다."},
    {id:"p95",law:"특허법",article:"제95조",title:"연장된 특허권의 효력 범위",content:"제90조제4항에 따라 특허권의 존속기간이 연장된 특허권의 효력은 그 연장등록의 이유가 된 허가등의 대상물건(허가등에서 특정 용도가 정하여져 있는 경우에는 그 용도에 사용되는 물건)에 관한 그 특허발명의 실시 행위에만 미친다."},
{id:"p96",law:"특허법",article:"제96조",title:"특허권의 효력이 미치지 아니하는 범위",content:"① 특허권의 효력은 다음 각 호의 사항에는 미치지 아니한다.\n1. 연구 또는 시험을 하기 위한 특허발명의 실시\n2. 국내를 통과하는데 불과한 선박·항공기·차량 또는 이에 사용되는 기계·기구·장치, 그 밖의 물건\n3. 특허출원을 한 때부터 국내에 있는 물건"},
  {id:"p97",law:"특허법",article:"제97조",title:"특허발명의 보호범위",content:"특허발명의 보호범위는 청구범위에 적혀 있는 사항에 의하여 정하여진다."},
  {id:"p98",law:"특허법",article:"제98조",title:"타인의 특허발명 등과의 관계",content:"특허권자·전용실시권자 또는 통상실시권자는 특허발명이 타인의 특허발명·등록실용신안 또는 등록디자인이나 그 디자인과 유사한 디자인을 이용하거나 타인의 디자인권 또는 상표권과 저촉되는 경우에는 그 권리자의 허락을 받지 아니하고는 자기의 특허발명을 업으로서 실시할 수 없다."},
  {id:"p99",law:"특허법",article:"제99조",title:"특허권의 이전 및 공유",content:"① 특허권은 이전할 수 있다.\n② 특허권이 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 그 지분을 양도하거나 질권을 설정할 수 있다.\n③ 특허권이 공유인 경우에는 각 공유자는 계약으로 특별히 약정한 경우를 제외하고는 다른 공유자의 동의를 받지 아니하고 그 특허발명을 자신이 실시할 수 있다.\n④ 특허권이 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 전용실시권을 설정하거나 통상실시권을 허락할 수 있다."},
  {id:"p100",law:"특허법",article:"제100조",title:"전용실시권",content:"① 특허권자는 그 특허권에 대하여 타인에게 전용실시권을 설정할 수 있다.\n② 전용실시권자는 그 설정행위로 정한 범위에서 그 특허발명을 업으로서 실시할 권리를 독점한다.\n④ 전용실시권자는 특허권자의 동의를 받아야만 전용실시권을 목적으로 하는 질권을 설정하거나 통상실시권을 허락할 수 있다."},
  {id:"p101",law:"특허법",article:"제101조",title:"등록의 효력",content:"다음 각 호의 어느 하나에 해당하는 사항은 등록하여야만 효력이 발생한다.\n1. 특허권의 이전(상속이나 그 밖의 일반승계에 의한 경우는 제외한다), 포기에 의한 소멸 또는 처분의 제한\n2. 전용실시권의 설정·이전·변경·소멸 또는 처분의 제한\n3. 특허권 또는 전용실시권을 목적으로 하는 질권의 설정·이전·변경·소멸 또는 처분의 제한"},
  {id:"p102",law:"특허법",article:"제102조",title:"통상실시권",content:"① 특허권자는 그 특허권에 대하여 타인에게 통상실시권을 허락할 수 있다.\n② 통상실시권자는 이 법에 따라 또는 설정행위로 정한 범위에서 특허발명을 업으로서 실시할 수 있는 권리를 가진다."},
  {id:"p103_2",law:"특허법",article:"제103조의2",title:"이전등록 특허의 원권리자 통상실시권",content:"① 다음 각 호의 어느 하나에 해당하는 자가 제99조의2제2항에 따른 특허권의 이전등록이 있기 전에 해당 특허가 무효사유에 해당하는 것을 알지 못하고 국내에서 해당 발명의 실시사업을 하거나 이를 준비하고 있는 경우에는 그 실시하거나 준비를 하고 있는 발명 및 사업목적의 범위에서 그 특허권에 대하여 통상실시권을 가진다.\n1. 이전등록된 특허의 원특허권자\n2. 이전등록된 특허권에 대하여 이전등록 당시에 이미 전용실시권이나 통상실시권을 취득하고 등록을 받은 자\n② 제1항에 따라 통상실시권을 가진 자는 이전등록된 특허권자에게 상당한 대가를 지급하여야 한다."},
  {id:"p104",law:"특허법",article:"제104조",title:"무효심판 후의 통상실시권",content:"① 다음 각 호의 어느 하나에 해당하는 자가 특허 무효심판청구의 등록 전에 자기의 특허발명이 무효사유에 해당하는 것을 알지 못하고 국내에서 그 발명의 실시사업을 하거나 이를 준비하고 있는 경우에는 그 실시하거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허권에 대하여 통상실시권을 가진다.\n1. 동일한 발명에 대한 둘 이상의 특허 중 그 하나의 특허를 무효로 한 경우 그 무효로 된 특허의 원특허권자\n3. 특허를 무효로 하고 동일한 발명에 관하여 정당한 권리자에게 특허를 한 경우 그 무효로 된 특허의 원특허권자\n② 제1항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다."},
  {id:"p105",law:"특허법",article:"제105조",title:"디자인권 존속기간 만료 후의 통상실시권",content:"① 특허출원일 전 또는 같은 날에 출원되어 등록된 디자인권이 그 특허권과 저촉되는 경우 그 디자인권의 존속기간이 만료될 때에는 그 디자인권자는 그 디자인권의 범위에서 그 특허권에 대하여 통상실시권을 가진다.\n③ 제2항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다."},
  {id:"p106",law:"특허법",article:"제106조",title:"특허권의 수용",content:"① 정부는 특허발명이 전시, 사변 또는 이에 준하는 비상시에 국방상 필요한 경우에는 특허권을 수용할 수 있다.\n② 특허권이 수용되는 경우에는 그 특허발명에 관한 특허권 외의 권리는 소멸된다.\n③ 정부는 제1항에 따라 특허권을 수용하는 경우에는 특허권자, 전용실시권자 또는 통상실시권자에 대하여 정당한 보상금을 지급하여야 한다."},
  {id:"p106_2",law:"특허법",article:"제106조의2",title:"공공복리를 위한 특허발명의 실시",content:"① 정부는 특허발명이 국가 비상사태, 극도의 긴급상황 또는 공공의 이익을 위하여 비상업적으로 실시할 필요가 있다고 인정하는 경우에는 그 특허발명을 실시하거나 정부 외의 자에게 실시하게 할 수 있다.\n③ 정부 또는 제1항에 따른 정부 외의 자는 제1항에 따라 특허발명을 실시하는 경우에는 특허권자, 전용실시권자 또는 통상실시권자에게 정당한 보상금을 지급하여야 한다."},
  {id:"p108",law:"특허법",article:"제108조",title:"재정 청구서 송달",content:"지식재산처장은 재정의 청구가 있으면 그 청구서의 부본을 그 청구에 관련된 특허권자ㆍ전용실시권자, 그 밖에 그 특허에 관하여 등록을 한 권리를 가지는 자에게 송달하고, 기간을 정하여 답변서를 제출할 수 있는 기회를 주어야 한다."},
  {id:"p109",law:"특허법",article:"제109조",title:"재정 시 의견청취",content:"지식재산처장은 재정을 할 때 필요하다고 인정하는 경우에는 산업재산권분쟁조정위원회 및 관계 부처의 장의 의견을 들을 수 있고, 관계 행정기관이나 관계인에게 협조를 요청할 수 있다."},
  {id:"p110",law:"특허법",article:"제110조",title:"재정의 방식",content:"① 재정은 서면으로 하고, 그 이유를 구체적으로 적어야 한다.\n② 재정에는 다음 사항을 구체적으로 적어야 한다.\n1. 통상실시권의 범위 및 기간\n2. 대가와 그 지급방법 및 지급시기\n③ 지식재산처장은 정당한 사유가 있는 경우를 제외하고는 재정청구일부터 6개월 이내에 재정에 관한 결정을 하여야 한다."},
  {id:"p111",law:"특허법",article:"제111조",title:"재정서 송달",content:"① 지식재산처장은 재정을 한 경우에는 당사자 및 그 특허에 관하여 등록을 한 권리를 가지는 자에게 재정서등본을 송달하여야 한다.\n② 제1항에 따라 당사자에게 재정서등본이 송달되었을 때에는 재정서에 적혀 있는 바에 따라 당사자 사이에 협의가 이루어진 것으로 본다."},
  {id:"p111_2",law:"특허법",article:"제111조의2",title:"재정 사항 변경",content:"① 재정을 받은 자는 재정서에 적혀 있는 사항에 관하여 변경이 필요하면 그 원인을 증명하는 서류를 첨부하여 지식재산처장에게 변경청구를 할 수 있다.\n② 지식재산처장은 제1항에 따른 청구가 이유있다고 인정되면 재정서에 적혀 있는 사항을 변경할 수 있다."},
  {id:"p112",law:"특허법",article:"제112조",title:"대가의 공탁",content:"제110조제2항제2호에 따른 대가를 지급하여야 하는 자는 다음 각 호의 어느 하나에 해당하는 경우에는 그 대가를 공탁하여야 한다.\n1. 대가를 받을 자가 수령을 거부하거나 수령할 수 없는 경우\n2. 대가에 대하여 소송이 제기된 경우\n3. 해당 특허권 또는 전용실시권을 목적으로 하는 질권이 설정되어 있는 경우(질권자의 동의를 받은 경우 제외)"},
  {id:"p113",law:"특허법",article:"제113조",title:"대가 미지급 시 재정 실효",content:"재정을 받은 자가 지급시기까지 대가를 지급하지 아니하거나 공탁을 하지 아니한 경우에는 그 재정은 효력을 잃는다."},
  {id:"p114",law:"특허법",article:"제114조",title:"재정의 취소",content:"① 지식재산처장은 재정을 받은 자가 다음 각 호의 어느 하나에 해당하는 경우에는 이해관계인의 신청에 따라 또는 직권으로 그 재정을 취소할 수 있다.\n1. 재정을 받은 목적에 적합하도록 그 특허발명을 실시하지 아니한 경우\n2. 통상실시권을 재정한 사유가 없어지고 그 사유가 다시 발생하지 아니할 것이라고 인정되는 경우\n③ 제1항에 따라 재정이 취소되면 통상실시권은 그때부터 소멸된다."},
  {id:"p115",law:"특허법",article:"제115조",title:"재정의 불복",content:"재정에 대하여 행정심판법에 따라 행정심판을 제기하거나 행정소송법에 따라 취소소송을 제기하는 경우에는 그 재정으로 정한 대가는 불복이유로 할 수 없다."},
  {id:"p103",law:"특허법",article:"제103조",title:"선사용에 의한 통상실시권",content:"특허출원 시에 그 특허출원된 발명의 내용을 알지 못하고 그 발명을 하거나 그 발명을 한 사람으로부터 알게 되어 국내에서 그 발명의 실시사업을 하거나 이를 준비하고 있는 자는 그 실시하거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허발명에 대하여 통상실시권을 가진다."},
  {id:"p107",law:"특허법",article:"제107조",title:"통상실시권 설정의 재정",content:"① 특허발명을 실시하려는 자는 특허권자 또는 전용실시권자와 합리적인 조건으로 협의를 하였으나 합의가 이루어지지 아니하는 경우에는 지식재산처장에게 통상실시권 설정에 관한 재정을 청구할 수 있다.\n1. 정당한 이유 없이 계속하여 3년 이상 국내에서 실시되고 있지 아니한 경우\n2. 정당한 이유 없이 계속하여 3년 이상 국내에서 상당한 영업적 규모로 실시되고 있지 아니하거나 국내수요를 충족시키지 못한 경우\n3. 특허발명의 실시가 공공의 이익을 위하여 특히 필요한 경우"},
    {id:"p116",law:"특허법",article:"제116조",title:"특허취소신청의 합의",content:"제132조의3에 따른 특허취소신청에 관한 심의는 심사관 3명으로 구성된 심사관 합의체가 한다. 합의체의 구성과 심의에 관하여 필요한 사항은 대통령령으로 정한다."},
  {id:"p117",law:"특허법",article:"제117조",title:"특허취소신청과 심판 등의 관계",content:"① 특허취소신청이 특허심판원에 계속 중인 경우에는 그 신청에 관한 결정이 확정될 때까지 제133조 또는 제137조에 따른 심판을 청구할 수 없다.\n② 제133조 또는 제137조에 따른 심판이 특허심판원에 계속 중인 경우에는 그 심판에 관한 심결이 확정될 때까지 특허취소신청을 할 수 없다."},
{id:"p118",law:"특허법",article:"제118조",title:"통상실시권 등록의 효과",content:"① 통상실시권을 등록한 경우에는 그 등록 후에 특허권 또는 전용실시권을 취득한 자에 대해서도 그 효력이 발생한다.\n② 선사용에 의한 통상실시권 등은 등록이 없더라도 제1항에 따른 효력이 발생한다."},
  {id:"p119",law:"특허법",article:"제119조",title:"특허권의 포기",content:"① 특허권자는 다음 각 호의 모두의 동의를 받아야만 특허권을 포기할 수 있다.\n1. 전용실시권자\n2. 질권자\n3. 특허권에 대한 통상실시권자"},
  {id:"p120",law:"특허법",article:"제120조",title:"특허권 등의 포기 효과",content:"특허권ㆍ전용실시권 또는 통상실시권을 포기한 때에는 특허권ㆍ전용실시권 또는 통상실시권은 그때부터 소멸된다."},
  {id:"p121",law:"특허법",article:"제121조",title:"질권행사와 실시",content:"특허권ㆍ전용실시권 또는 통상실시권을 목적으로 하는 질권을 설정하였을 때에는 질권자는 계약으로 특별히 정한 경우를 제외하고는 해당 특허발명을 실시할 수 없다."},
  {id:"p122",law:"특허법",article:"제122조",title:"경매에 의한 이전과 통상실시권",content:"특허권자는 특허권을 목적으로 하는 질권설정 또는 공유인 특허권의 분할청구 이전에 그 특허발명을 실시하고 있는 경우에는 그 특허권이 경매 등에 의하여 이전되더라도 그 특허발명에 대하여 통상실시권을 가진다. 이 경우 특허권자는 경매 등에 의하여 특허권을 이전받은 자에게 상당한 대가를 지급하여야 한다."},
  {id:"p123",law:"특허법",article:"제123조",title:"질권의 물상대위",content:"질권은 이 법에 따른 보상금이나 특허발명의 실시에 대하여 받을 대가나 물건에 대해서도 행사할 수 있다. 다만, 그 보상금 등의 지급 또는 인도 전에 압류하여야 한다."},
  {id:"p124",law:"특허법",article:"제124조",title:"특허권의 소멸",content:"①특허권의 상속이 개시된 때 상속인이 없는 경우에는 그 특허권은 소멸된다.\n② 청산절차가 진행 중인 법인의 특허권은 법인의 청산종결등기일까지 그 특허권의 이전등록을 하지 아니한 경우에는 청산종결등기일의 다음 날에 소멸한다."},
  {id:"p125",law:"특허법",article:"제125조",title:"실시 여부 등의 보고",content:"지식재산처장은 특허권자ㆍ전용실시권자 또는 통상실시권자에게 특허발명의 실시 여부 및 그 규모 등에 관하여 보고하게 할 수 있다."},
  {id:"p125_2",law:"특허법",article:"제125조의2",title:"결정의 집행력",content:"이 법에 따라 지식재산처장이 정한 대가와 보상금액에 관하여 확정된 결정은 집행력 있는 집행권원과 같은 효력을 가진다. 이 경우 집행력 있는 정본은 지식재산처 소속 공무원이 부여한다."},
  {id:"p126",law:"특허법",article:"제126조",title:"침해금지 청구권",content:"① 특허권자 또는 전용실시권자는 자기의 권리를 침해한 자 또는 침해할 우려가 있는 자에 대하여 그 침해의 금지 또는 예방을 청구할 수 있다.\n② 침해행위를 조성한 물건의 폐기, 침해행위에 제공된 설비의 제거, 그 밖에 침해의 예방에 필요한 행위를 청구할 수 있다."},
  {id:"p126_2",law:"특허법",article:"제126조의2",title:"구체적 침해행위 제시의무",content:"① 특허권 침해소송에서 특허권자가 주장하는 침해행위의 구체적 내용을 부인하는 당사자는 자기의 구체적 행위 내용을 제시하여야 한다.\n④ 당사자가 정당한 이유 없이 제시하지 않는 경우 법원은 특허권자가 주장하는 침해행위를 진실한 것으로 인정할 수 있다."},
  {id:"p127",law:"특허법",article:"제127조",title:"침해로 보는 행위",content:"다음 각 호의 구분에 따른 행위를 업으로서 하는 경우에는 특허권 또는 전용실시권을 침해한 것으로 본다.\n1. 물건의 발명: 그 물건의 생산에만 사용하는 물건을 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 양도 또는 대여의 청약을 하는 행위\n2. 방법의 발명: 그 방법의 실시에만 사용하는 물건을 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 양도 또는 대여의 청약을 하는 행위"},
  {id:"p128",law:"특허법",article:"제128조",title:"손해배상 청구",content:"① 특허권자 또는 전용실시권자는 고의 또는 과실로 자기의 특허권 또는 전용실시권을 침해한 자에 대하여 침해로 인하여 입은 손해의 배상을 청구할 수 있다.\n④ 침해행위로 인하여 얻은 이익액을 특허권자 또는 전용실시권자가 입은 손해액으로 추정한다.\n⑧ 침해행위가 고의적인 경우 손해로 인정된 금액의 5배를 넘지 아니하는 범위에서 배상액을 정할 수 있다."},
  {id:"p128_2",law:"특허법",article:"제128조의2",title:"손해액 산정 감정",content:"특허권 또는 전용실시권 침해소송에서 법원이 침해로 인한 손해액의 산정을 위하여 감정을 명한 때에는 당사자는 감정인에게 감정에 필요한 사항을 설명하여야 한다."},
  {id:"p129",law:"특허법",article:"제129조",title:"생산방법의 추정",content:"물건을 생산하는 방법의 발명에 관하여 특허가 된 경우에 그 물건과 동일한 물건은 그 특허된 방법에 의하여 생산된 것으로 추정한다. 다만, 특허출원 전에 국내에서 공지되었거나 공연히 실시된 물건인 경우에는 그러하지 아니하다."},
  {id:"p130",law:"특허법",article:"제130조",title:"과실의 추정",content:"타인의 특허권 또는 전용실시권을 침해한 자는 그 침해행위에 대하여 과실이 있는 것으로 추정한다."},
  {id:"p131",law:"특허법",article:"제131조",title:"신용회복 조치",content:"법원은 고의나 과실로 특허권 또는 전용실시권을 침해함으로써 특허권자 또는 전용실시권자의 업무상 신용을 떨어뜨린 자에 대해서는 특허권자 또는 전용실시권자의 청구에 의하여 손해배상을 갈음하여 또는 손해배상과 함께 업무상 신용회복을 위하여 필요한 조치를 명할 수 있다."},
  {id:"p132",law:"특허법",article:"제132조",title:"자료제출 명령",content:"①법원은 특허권 또는 전용실시권 침해소송에서 당사자의 신청에 의하여 상대방 당사자에게 해당 침해의 증명 또는 침해로 인한 손해액의 산정에 필요한 자료의 제출을 명할 수 있다.\n④ 당사자가 정당한 이유 없이 자료제출명령에 따르지 아니한 때에는 법원은 자료의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다."},
  {id:"p132_5",law:"특허법",article:"제132조의5",title:"취소신청서 보정명령",content:"① 심판장은 특허취소신청서가 방식을 위반하거나 수수료를 납부하지 않은 경우에는 기간을 정하여 보정을 명하여야 한다.\n② 심판장은 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하거나 보정한 사항이 요지를 변경한 경우에는 특허취소신청서를 결정으로 각하하여야 한다."},
  {id:"p132_6",law:"특허법",article:"제132조의6",title:"부적법 취소신청 각하",content:"① 합의체는 부적법한 특허취소신청으로서 그 흠을 보정할 수 없을 때에는 특허권자에게 특허취소신청서의 부본을 송달하지 아니하고, 결정으로 그 특허취소신청을 각하할 수 있다.\n② 제1항에 따른 각하결정에 대해서는 불복할 수 없다."},
  {id:"p132_9",law:"특허법",article:"제132조의9",title:"취소신청 참가",content:"① 특허권에 관하여 권리를 가진 자 또는 이해관계를 가진 자는 특허취소신청에 대한 결정이 있을 때까지 특허권자를 보조하기 위하여 그 심리에 참가할 수 있다."},
  {id:"p132_10",law:"특허법",article:"제132조의10",title:"취소신청의 직권심리",content:"① 심판관은 특허취소신청에 관하여 신청인, 특허권자 또는 참가인이 제출하지 아니한 이유에 대해서도 심리할 수 있다.\n② 심판관은 특허취소신청인이 신청하지 아니한 청구항에 대해서는 심리할 수 없다."},
  {id:"p132_11",law:"특허법",article:"제132조의11",title:"취소신청 심리 병합",content:"① 심판관 합의체는 하나의 특허권에 관한 둘 이상의 특허취소신청에 대해서는 특별한 사정이 있는 경우를 제외하고는 그 심리를 병합하여 결정하여야 한다.\n② 심판관 합의체는 특허취소신청의 심리에 필요하다고 인정하는 경우에는 병합된 심리를 분리할 수 있다."},
  {id:"p132_12",law:"특허법",article:"제132조의12",title:"취소신청의 취하",content:"① 특허취소신청은 결정등본이 송달되기 전까지만 취하할 수 있다. 다만, 특허권자 및 참가인에게 특허의 취소이유가 통지된 후에는 취하할 수 없다.\n③ 취하가 있으면 그 특허취소신청은 처음부터 없었던 것으로 본다."},
  {id:"p132_14",law:"특허법",article:"제132조의14",title:"취소신청 결정서",content:"① 특허취소신청에 대한 결정은 다음 사항을 적은 서면으로 하여야 하며, 결정을 한 심판관은 그 서면에 기명날인하여야 한다.\n1. 특허취소신청사건의 번호\n4. 결정에 관련된 특허의 표시\n5. 결정의 결론 및 이유\n② 심판장은 특허취소신청에 대한 결정이 있는 때에는 그 결정의 등본을 신청인, 특허권자, 참가인에게 송달하여야 한다."},
  {id:"p132_15",law:"특허법",article:"제132조의15",title:"취소신청 심리에 준용되는 규정",content:"특허취소신청의 심리ㆍ결정에 관하여는 제147조제3항, 제157조, 제158조, 제164조, 제165조제3항부터 제6항까지 및 제166조를 준용한다."},
  {id:"p138",law:"특허법",article:"제138조",title:"통상실시권 허락의 심판",content:"① 특허권자, 전용실시권자 또는 통상실시권자는 해당 특허발명이 타인의 특허권 등과 저촉되어 실시 허락을 받으려는 경우 그 타인이 정당한 이유 없이 허락하지 아니하거나 허락을 받을 수 없을 때에는 자기의 특허발명의 실시에 필요한 범위에서 통상실시권 허락의 심판을 청구할 수 있다.\n② 제1항에 따른 청구가 있는 경우에 그 특허발명이 출원된 타인의 특허발명과 비교하여 상당한 경제적 가치가 있는 중요한 기술적 진보를 가져오는 것이 아니면 통상실시권을 허락하여서는 아니 된다.\n④ 통상실시권을 허락받은 자는 특허권자 등에게 대가를 지급하여야 한다."},
  {id:"p139",law:"특허법",article:"제139조",title:"공동심판의 청구 등",content:"① 동일한 특허권에 관하여 무효심판이나 권리범위 확인심판을 청구하는 자가 2인 이상이면 모두가 공동으로 심판을 청구할 수 있다.\n② 공유인 특허권의 특허권자에 대하여 심판을 청구할 때에는 공유자 모두를 피청구인으로 하여야 한다.\n③ 특허권의 공유자가 그 공유인 권리에 관하여 심판을 청구할 때에는 공유자 모두가 공동으로 청구하여야 한다.\n④ 청구인이나 피청구인 중 1인에게 심판절차의 중단 또는 중지의 원인이 있으면 모두에게 그 효력이 발생한다."},
  {id:"p139_2",law:"특허법",article:"제139조의2",title:"국선대리인",content:"① 특허심판원장은 요건을 갖춘 심판 당사자의 신청에 따라 국선대리인을 선임하여 줄 수 있다. 다만, 심판청구가 이유 없음이 명백하거나 권리의 남용이라고 인정되는 경우에는 그러하지 아니하다.\n② 국선대리인이 선임된 당사자에 대하여 심판절차와 관련된 수수료를 감면할 수 있다."},
  {id:"p140_2",law:"특허법",article:"제140조의2",title:"거절결정 심판청구서",content:"① 특허거절결정에 대한 심판을 청구하려는 자는 다음 사항을 적은 심판청구서를 특허심판원장에게 제출하여야 한다.\n1. 청구인의 성명 및 주소\n3. 출원일 및 출원번호\n4. 발명의 명칭\n5. 특허거절결정일\n7. 청구의 취지 및 그 이유\n② 심판청구서를 보정하는 경우에는 그 요지를 변경할 수 없다. 다만, 청구의 이유를 보정하는 경우에는 그러하지 아니하다."},
  {id:"p144",law:"특허법",article:"제144조",title:"심판관 지정",content:"① 특허심판원장은 각 심판사건에 대하여 합의체를 구성할 심판관을 지정하여야 한다.\n② 특허심판원장은 심판관 중 심판에 관여하는 데 지장이 있는 사람이 있으면 다른 심판관에게 심판하게 할 수 있다."},
  {id:"p145",law:"특허법",article:"제145조",title:"심판장 지정",content:"① 특허심판원장은 지정된 심판관 중에서 1명을 심판장으로 지정하여야 한다.\n② 심판장은 그 심판사건에 관한 사무를 총괄한다."},
  {id:"p149",law:"특허법",article:"제149조",title:"심판관 제척신청",content:"제148조에 따른 제척의 원인이 있으면 당사자 또는 참가인은 제척신청을 할 수 있다."},
  {id:"p132_2",law:"특허법",article:"제132조의2",title:"특허취소신청",content:"① 누구든지 특허권의 설정등록일부터 등록공고일 후 6개월이 되는 날까지 그 특허가 제29조 또는 제36조제1항부터 제3항까지에 위반된 경우에는 특허심판원장에게 특허취소신청을 할 수 있다. 청구범위의 청구항이 둘 이상인 경우에는 청구항마다 특허취소신청을 할 수 있다."},
  {id:"p132_3",law:"특허법",article:"제132조의3",title:"취소신청 중 정정청구",content:"① 특허취소신청절차가 진행 중인 특허에 대한 특허권자는 청구범위 감축, 잘못 기재된 사항 정정, 불명확한 기재를 명확하게 하는 경우에만 정정청구를 할 수 있다.\n③ 특허취소결정이 확정된 때에는 그 특허권은 처음부터 없었던 것으로 본다."},
  {id:"p132_4",law:"특허법",article:"제132조의4",title:"취소신청서 제출",content:"① 특허취소신청을 하려는 자는 신청인 성명·주소, 대리인 정보, 취소신청 대상 특허의 표시, 취소신청의 이유 및 증거의 표시를 적은 특허취소신청서를 특허심판원장에게 제출하여야 한다."},
  {id:"p132_7",law:"특허법",article:"제132조의7",title:"취소신청 합의체",content:"① 특허취소신청은 3명 또는 5명의 심판관으로 구성되는 합의체가 심리하여 결정한다."},
  {id:"p132_8",law:"특허법",article:"제132조의8",title:"취소신청의 서면심리",content:"① 특허취소신청에 관한 심리는 서면으로 한다.\n② 공유인 특허권의 특허권자 중 1인에게 특허취소신청절차의 중단 또는 중지의 원인이 있으면 모두에게 그 효력이 발생한다."},
  {id:"p132_13",law:"특허법",article:"제132조의13",title:"특허취소결정",content:"① 심판관 합의체는 특허취소신청이 이유 있다고 인정되는 때에는 특허를 취소한다는 취지의 결정(특허취소결정)을 하여야 한다.\n③ 특허취소결정이 확정된 때에는 그 특허권은 처음부터 없었던 것으로 본다.\n⑤ 기각결정에 대해서는 불복할 수 없다."},
  {id:"p132_16",law:"특허법",article:"제132조의16",title:"특허심판원",content:"① 특허ㆍ실용신안에 관한 취소신청, 특허ㆍ실용신안ㆍ디자인ㆍ상표에 관한 심판과 재심 및 이에 관한 조사ㆍ연구 사무를 관장하게 하기 위하여 지식재산처장 소속으로 특허심판원을 둔다.\n② 특허심판원에 원장과 심판관을 둔다."},
  {id:"p132_17",law:"특허법",article:"제132조의17",title:"거절결정에 대한 심판",content:"특허거절결정 또는 특허권의 존속기간의 연장등록거절결정을 받은 자가 결정에 불복할 때에는 그 결정등본을 송달받은 날부터 3개월 이내에 심판을 청구할 수 있다."},
  {id:"p133",law:"특허법",article:"제133조",title:"특허무효심판",content:"① 이해관계인 또는 심사관은 특허가 제25조, 제29조, 제32조, 제36조, 제42조 등을 위반한 경우 무효심판을 청구할 수 있다. 청구범위의 청구항이 둘 이상인 경우에는 청구항마다 청구할 수 있다.\n③ 특허를 무효로 한다는 심결이 확정된 경우에는 그 특허권은 처음부터 없었던 것으로 본다."},
  {id:"p133_2",law:"특허법",article:"제133조의2",title:"무효심판 중 정정청구",content:"① 무효심판의 피청구인은 청구범위 감축, 잘못 기재된 사항 정정, 불명확한 기재를 명확하게 하는 경우에만 지정된 기간에 특허발명의 명세서 또는 도면에 대하여 정정청구를 할 수 있다.\n② 정정청구를 하였을 때에는 해당 무효심판절차에서 그 정정청구 전에 한 정정청구는 취하된 것으로 본다.\n③ 심판장은 정정청구가 있을 때에는 그 청구서의 부본을 무효심판의 청구인에게 송달하여야 한다."},
  {id:"p134",law:"특허법",article:"제134조",title:"존속기간 연장등록 무효심판",content:"① 이해관계인 또는 심사관은 특허권의 존속기간의 연장등록이 허가등을 받을 필요가 없는 출원, 특허권자·실시권자가 허가등을 받지 아니한 출원, 연장된 기간이 인정 기간을 초과하는 경우 등에 해당하면 무효심판을 청구할 수 있다."},
  {id:"p135",law:"특허법",article:"제135조",title:"권리범위 확인심판",content:"① 특허권자 또는 전용실시권자는 자신의 특허발명의 보호범위를 확인하기 위하여 특허권의 권리범위 확인심판을 청구할 수 있다.\n② 이해관계인은 타인의 특허발명의 보호범위를 확인하기 위하여 특허권의 권리범위 확인심판을 청구할 수 있다."},
  {id:"p136",law:"특허법",article:"제136조",title:"정정심판",content:"① 특허권자는 다음 경우에 특허발명의 명세서 또는 도면에 대하여 정정심판을 청구할 수 있다.\n1. 청구범위를 감축하는 경우\n2. 잘못 기재된 사항을 정정하는 경우\n3. 분명하지 아니하게 기재된 사항을 명확하게 하는 경우\n⑩ 정정심결이 확정되면 정정 후의 명세서 또는 도면에 따라 특허출원, 출원공개, 특허결정 또는 심결 및 특허권의 설정등록이 된 것으로 본다."},
  {id:"p137",law:"특허법",article:"제137조",title:"정정무효심판",content:"① 이해관계인 또는 심사관은 명세서 또는 도면에 대한 정정이 제136조제1항 각 호 또는 제136조제3항부터 제5항까지를 위반한 경우에는 정정의 무효심판을 청구할 수 있다.\n⑤ 정정을 무효로 한다는 심결이 확정되었을 때에는 그 정정은 처음부터 없었던 것으로 본다."},
  {id:"p140",law:"특허법",article:"제140조",title:"심판청구서 제출",content:"① 심판을 청구하려는 자는 당사자의 성명·주소, 대리인 정보, 심판사건의 표시, 청구의 취지 및 이유를 적은 심판청구서를 특허심판원장에게 제출하여야 한다.\n② 심판청구서의 보정은 그 요지를 변경할 수 없다."},
  {id:"p141",law:"특허법",article:"제141조",title:"심판청구서 보정명령",content:"① 심판장은 심판청구서가 방식을 위반하거나 수수료를 납부하지 않은 경우에는 기간을 정하여 보정을 명하여야 한다.\n② 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하면 심판청구서를 결정으로 각하하여야 한다."},
  {id:"p142",law:"특허법",article:"제142조",title:"부적법 심판청구 각하",content:"부적법한 심판청구로서 그 흠을 보정할 수 없을 때에는 피청구인에게 답변서 제출의 기회를 주지 아니하고, 심결로써 그 청구를 각하할 수 있다."},
  {id:"p143",law:"특허법",article:"제143조",title:"심판관",content:"① 특허심판원장은 심판이 청구되면 심판관에게 심판하게 한다.\n② 심판관의 자격은 대통령령으로 정한다.\n③ 심판관은 직무상 독립하여 심판한다."},
  {id:"p146",law:"특허법",article:"제146조",title:"심판관 합의체",content:"① 심판은 3명 또는 5명의 심판관으로 구성되는 합의체가 한다.\n② 합의체의 합의는 과반수로 결정한다.\n③ 심판의 합의는 공개하지 아니한다."},
  {id:"p147",law:"특허법",article:"제147조",title:"답변서 제출 기회",content:"① 심판장은 심판이 청구되면 심판청구서 부본을 피청구인에게 송달하고, 기간을 정하여 답변서를 제출할 수 있는 기회를 주어야 한다.\n③ 심판장은 심판에 관하여 당사자를 심문할 수 있다."},
  {id:"p148",law:"특허법",article:"제148조",title:"심판관 제척",content:"심판관은 다음에 해당하는 경우에는 그 심판에서 제척된다.\n1. 심판관 또는 그 배우자이거나 배우자이었던 사람이 사건의 당사자인 경우\n6. 심판관이 사건에 대하여 심사관 또는 심판관으로서 심결에 관여한 경우\n7. 심판관이 사건에 관하여 직접 이해관계를 가진 경우"},
  {id:"p150",law:"특허법",article:"제150조",title:"심판관 기피",content:"① 심판관에게 공정한 심판을 기대하기 어려운 사정이 있으면 당사자 또는 참가인은 기피신청을 할 수 있다.\n② 당사자는 심판관에게 진술을 한 후에는 기피신청을 할 수 없다. 단, 기피의 원인이 그 후에 발생한 경우에는 그러하지 아니하다."},
  {id:"p153_2",law:"특허법",article:"제153조의2",title:"심판관 회피",content:"심판관이 제148조 또는 제150조에 해당하는 경우에는 특허심판원장의 허가를 받아 그 사건에 대한 심판을 회피할 수 있다."},
    {id:"p151",law:"특허법",article:"제151조",title:"심판관의 지정",content:"① 특허심판원장은 각 심판사건에 대하여 심판관 합의체를 구성할 심판관을 지정하여야 한다.\n② 특허심판원장은 필요하다고 인정하면 지정된 심판관 중 심판장 외의 심판관을 다른 심판관으로 교체할 수 있다."},
  {id:"p152",law:"특허법",article:"제152조",title:"심판관의 기피",content:"① 당사자는 심판관에게 공정한 심판을 기대하기 어려운 사정이 있으면 기피신청을 할 수 있다.\n② 기피신청이 있으면 그 심판관은 기피 여부에 관한 결정이 있을 때까지 심판절차를 중지하여야 한다.\n③ 기피신청은 특허심판원장이 결정한다."},
  {id:"p153",law:"특허법",article:"제153조",title:"심판의 합의",content:"심판관 합의체의 합의는 과반수에 의하여 결정하며, 그 합의는 공개하지 아니한다."},
{id:"p154",law:"특허법",article:"제154조",title:"구술심리와 서면심리",content:"① 심판은 구술심리 또는 서면심리로 한다. 당사자가 구술심리를 신청하였을 때에는 서면심리만으로 결정할 수 있다고 인정되는 경우 외에는 구술심리를 하여야 한다.\n③ 구술심리는 공개하여야 한다. 다만, 공공의 질서 또는 선량한 풍속에 어긋날 우려가 있으면 그러하지 아니하다."},
  {id:"p154_2",law:"특허법",article:"제154조의2",title:"전문심리위원",content:"① 심판장은 직권에 따른 결정으로 전문심리위원을 지정하여 심판절차에 참여하게 할 수 있다. ② 심판장은 전문심리위원을 심판절차에 참여시키는 경우 당사자의 의견을 들어 각 사건마다 1명 이상의 전문심리위원을 지정하여야 한다. ③ 전문심리위원에게는 총리령으로 정하는 바에 따라 수당을 지급하고, 필요한 경우에는 그 밖의 여비, 일당 및 숙박료를 지급할 수 있다. ⑤ 전문심리위원에 관하여는 민사소송법 제164조의2제2항부터 제4항까지 및 제164조의3을 준용한다. ⑥ 전문심리위원의 제척 및 기피에 관하여는 제148조부터 제152조까지의 규정을 준용한다."},
  {id:"p155",law:"특허법",article:"제155조",title:"심판 참가",content:"① 제139조제1항에 따라 심판을 청구할 수 있는 자는 심리가 종결될 때까지 그 심판에 참가할 수 있다.\n③ 심판의 결과에 대하여 이해관계를 가진 자는 심리가 종결될 때까지 당사자의 어느 한쪽을 보조하기 위하여 그 심판에 참가할 수 있다."},
  {id:"p158_2",law:"특허법",article:"제158조의2",title:"심판 주장·증거 제출",content:"심판절차에서의 주장이나 증거의 제출에 관하여는 민사소송법 제146조, 제147조 및 제149조를 준용한다."},
    {id:"p156",law:"특허법",article:"제156조",title:"심판의 참가",content:"① 특허권자를 위한 심판이면 이해관계인은 청구인 측에, 특허무효심판이면 이해관계인은 피청구인 측에 참가할 수 있다.\n② 참가신청은 심결이 확정될 때까지 할 수 있다.\n③ 참가인에게는 피참가인이 한 심판절차의 행위와 저촉되지 아니하는 한 심판절차의 행위를 할 수 있다."},
  {id:"p157",law:"특허법",article:"제157조",title:"증거보전",content:"심판장은 필요하다고 인정하면 신청에 의하거나 직권으로 심결이 확정되기 전에 증거를 보전할 수 있다."},
  {id:"p158",law:"특허법",article:"제158조",title:"직권심리",content:"① 심판에서는 당사자 또는 참가인이 신청하지 아니한 이유에 대하여도 심리할 수 있다. 이 경우 당사자 및 참가인에게 그 이유에 대하여 의견을 진술할 기회를 주어야 한다."},
{id:"p159",law:"특허법",article:"제159조",title:"직권심리",content:"① 심판에서는 당사자 또는 참가인이 신청하지 아니한 이유에 대해서도 심리할 수 있다. 이 경우 당사자 및 참가인에게 기간을 정하여 그 이유에 대하여 의견을 진술할 수 있는 기회를 주어야 한다.\n② 심판에서는 청구인이 신청하지 아니한 청구의 취지에 대해서는 심리할 수 없다."},
    {id:"p160",law:"특허법",article:"제160조",title:"심리·심결의 병합 또는 분리",content:"심판장은 여러 건의 심판에 관하여 심리 또는 심결을 병합하거나 분리할 수 있다."},
{id:"p161",law:"특허법",article:"제161조",title:"심판청구의 취하",content:"① 심판청구는 심결이 확정될 때까지 취하할 수 있다. 다만, 답변서가 제출된 후에는 상대방의 동의를 받아야 한다.\n③ 취하가 있으면 그 심판청구는 처음부터 없었던 것으로 본다."},
  {id:"p162",law:"특허법",article:"제162조",title:"심결",content:"① 심판은 특별한 규정이 있는 경우를 제외하고는 심결로써 종결한다.\n③ 심판장은 사건이 심결을 할 정도로 성숙하였을 때에는 심리의 종결을 당사자 및 참가인에게 통지하여야 한다.\n⑤ 심결은 심리종결통지를 한 날부터 20일 이내에 한다."},
  {id:"p163",law:"특허법",article:"제163조",title:"일사부재리",content:"이 법에 따른 심판의 심결이 확정되었을 때에는 그 사건에 대해서는 누구든지 동일 사실 및 동일 증거에 의하여 다시 심판을 청구할 수 없다. 다만, 확정된 심결이 각하심결인 경우에는 그러하지 아니하다."},
  {id:"p164_2",law:"특허법",article:"제164조의2",title:"심판 조정회부",content:"① 심판장은 심판사건을 합리적으로 해결하기 위하여 필요하다고 인정되면 당사자의 동의를 받아 해당 심판사건의 절차를 중지하고 결정으로 해당 사건을 조정위원회에 회부할 수 있다. ③ 심판장은 조정위원회의 조정절차가 조정 불성립으로 종료되면 제1항에 따른 중지 결정을 취소하고 심판을 재개하며, 조정이 성립된 경우에는 해당 심판청구는 취하된 것으로 본다."},
    {id:"p164",law:"특허법",article:"제164조",title:"심판비용",content:"① 심판비용의 부담에 관하여 심결이 확정되거나 심판청구가 취하되었을 때에는 특허심판원장은 청구에 의하여 결정으로써 그 금액을 정한다.\n② 심판비용 부담의 결정에 대해서는 불복할 수 없다.\n③ 심판비용의 범위·부담비율·납부방법 등은 대통령령으로 정한다."},
  {id:"p165",law:"특허법",article:"제165조",title:"심결 등의 효력",content:"① 심결은 확정 후에 효력이 발생한다.\n② 특허취소결정·심결 또는 심판청구서나 재심청구서의 각하결정이 확정되면 누구든지 동일 사실 및 동일 증거에 의하여 다시 심판을 청구할 수 없다."},
  {id:"p166",law:"특허법",article:"제166조",title:"소송과의 관계",content:"특허취소결정이나 심결에 대한 소 또는 각하결정에 대한 소가 특허법원에 계속 중인 경우에는 동일 특허권에 관한 심판청구가 제한될 수 있다."},
  {id:"p167",law:"특허법",article:"제167조",title:"재심의 청구",content:"당사자는 확정된 심결에 대하여 재심을 청구할 수 있다."},
  {id:"p168",law:"특허법",article:"제168조",title:"사해심결에 대한 재심청구",content:"심결이 당사자의 사해에 의하여 된 것임을 제3자가 주장하는 경우에는 그 제3자는 확정된 심결에 대하여 재심을 청구할 수 있다."},
  {id:"p169",law:"특허법",article:"제169조",title:"재심이유",content:"확정된 심결에 대한 재심은 「민사소송법」 제451조 및 제453조에 규정된 사유가 있는 경우에만 청구할 수 있다."},
  {id:"p170",law:"특허법",article:"제170조",title:"재심절차",content:"재심에 관하여는 그 성질에 반하지 아니하는 한 심판에 관한 규정을 준용한다."},
  {id:"p171",law:"특허법",article:"제171조",title:"재심으로 회복한 특허권의 효력제한",content:"무효로 된 특허가 재심에 의하여 회복된 경우, 특허취소결정 또는 특허무효심결의 확정 후 재심청구 등록 전에 선의로 수입하거나 국내에서 생산·취득한 물건에는 그 효력이 미치지 아니한다."},
  {id:"p172",law:"특허법",article:"제172조",title:"재심으로 회복한 특허권과 선의 실시자의 통상실시권",content:"무효로 된 특허가 재심에 의하여 회복된 경우, 심결 확정 후 재심청구 등록 전에 선의로 해당 발명을 실시한 자는 그 발명에 대하여 통상실시권을 가진다."},
  {id:"p173",law:"특허법",article:"제173조",title:"재심으로 회복한 특허권 - 통상실시권의 범위",content:"제172조에 따른 통상실시권의 범위는 심결의 확정 당시에 국내에 있었던 물건에 한정된다."},
  {id:"p174",law:"특허법",article:"제174조",title:"재심비용",content:"재심의 심판비용에 관하여는 제164조를 준용한다."},
  {id:"p175",law:"특허법",article:"제175조",title:"특허법원의 관할",content:"특허취소결정이나 심결에 대한 소 및 심판청구서나 재심청구서의 각하결정에 대한 소는 특허법원의 전속관할로 한다."},
{id:"p176",law:"특허법",article:"제176조",title:"거절결정 취소심결",content:"① 심판관은 제132조의17에 따른 심판이 청구된 경우에 그 청구가 이유 있다고 인정할 때에는 심결로써 특허거절결정 또는 특허권의 존속기간의 연장등록거절결정을 취소하여야 한다.\n③ 취소의 기본이 된 이유는 그 사건에 대하여 심사관을 기속한다."},
    {id:"p177",law:"특허법",article:"제177조",title:"피고적격",content:"특허취소결정이나 심결에 대한 소 또는 각하결정에 대한 소에서 피고는 특허심판원장으로 한다."},
{id:"p178",law:"특허법",article:"제178조",title:"재심청구",content:"① 당사자는 확정된 특허취소결정 또는 확정된 심결에 대하여 재심을 청구할 수 있다.\n② 재심청구에 관하여는 민사소송법 제451조 및 제453조를 준용한다."},
  {id:"p179",law:"특허법",article:"제179조",title:"사해심결에 대한 재심",content:"① 심판의 당사자가 공모하여 제3자의 권리나 이익을 사해할 목적으로 심결을 하게 하였을 때에는 제3자는 그 확정된 심결에 대하여 재심을 청구할 수 있다.\n② 심판의 당사자를 공동피청구인으로 한다."},
  {id:"p180",law:"특허법",article:"제180조",title:"재심청구 기간",content:"① 당사자는 특허취소결정 또는 심결 확정 후 재심사유를 안 날부터 30일 이내에 재심을 청구하여야 한다.\n③ 특허취소결정 또는 심결 확정 후 3년이 지나면 재심을 청구할 수 없다."},
  {id:"p181",law:"특허법",article:"제181조",title:"재심으로 회복된 특허권의 효력 제한",content:"① 무효가 된 특허권이 재심에 의하여 회복된 경우 등에 특허권의 효력은 해당 특허취소결정 또는 심결이 확정된 후 재심청구 등록 전에 선의로 수출 또는 수입하거나 국내에서 생산 또는 취득한 물건에는 미치지 아니한다."},
  {id:"p182",law:"특허법",article:"제182조",title:"재심과 선사용자의 통상실시권",content:"재심에서 특허권이 회복된 경우에 심결이 확정된 후 재심청구 등록 전에 국내에서 선의로 그 발명의 실시사업을 하고 있는 자 또는 그 사업을 준비하고 있는 자는 실시하고 있거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허권에 관하여 통상실시권을 가진다."},
    {id:"p183",law:"특허법",article:"제183조",title:"재심의 소",content:"확정된 판결에 대하여는 「민사소송법」의 재심에 관한 규정을 준용한다."},
  {id:"p184",law:"특허법",article:"제184조",title:"소송절차의 중지",content:"법원은 소송절차가 특허취소신청 또는 특허에 관한 심판의 결과에 따라 좌우될 경우에는 그 심결이 확정될 때까지 소송절차를 중지할 수 있다."},
  {id:"p185",law:"특허법",article:"제185조",title:"특허소송과 다른 소송의 중지",content:"특허취소결정이나 심결에 대한 소가 법원에 계속 중인 경우에 그 특허권에 관하여 다른 소송이 계속 중일 때에는 법원은 그 소송절차를 중지할 수 있다."},
{id:"p186",law:"특허법",article:"제186조",title:"특허법원 전속관할",content:"① 특허취소결정 또는 심결에 대한 소 및 각하결정에 대한 소는 특허법원의 전속관할로 한다.\n③ 소는 심결 또는 결정의 등본을 송달받은 날부터 30일 이내에 제기하여야 한다.\n⑧ 특허법원의 판결에 대해서는 대법원에 상고할 수 있다."},
  {id:"p187",law:"특허법",article:"제187조",title:"피고적격",content:"제186조제1항에 따라 소를 제기하는 경우에는 지식재산처장을 피고로 하여야 한다. 다만, 무효심판ㆍ권리범위확인심판ㆍ정정무효심판ㆍ통상실시권 허락심판 또는 그 재심의 심결에 대한 소를 제기하는 경우에는 그 청구인 또는 피청구인을 피고로 하여야 한다."},
  {id:"p189",law:"특허법",article:"제189조",title:"취소판결의 효력",content:"① 법원은 소가 제기된 경우에 그 청구가 이유 있다고 인정할 때에는 판결로써 해당 심결 또는 결정을 취소하여야 한다.\n② 심판관은 심결의 취소판결이 확정되었을 때에는 다시 심리를 하여 심결 또는 결정을 하여야 한다.\n③ 판결에서 취소의 기본이 된 이유는 그 사건에 대하여 특허심판원을 기속한다."},
    {id:"p188",law:"특허법",article:"제188조",title:"기술심리관",content:"특허법원에 기술심리관을 둔다. 기술심리관은 재판장의 명을 받아 소송관계를 분명하게 하기 위하여 기술적인 사항에 관하여 당사자에게 질문하거나 의견을 진술할 수 있으며, 합의에는 참여하지 못한다."},
{id:"p188_2",law:"특허법",article:"제188조의2",title:"기술심리관 제척·기피 준용",content:"기술심리관에 대하여는 「민사소송법」 중 법관의 제척 또는 기피에 관한 규정을 준용한다."},
  {id:"p190",law:"특허법",article:"제190조",title:"보상금 등에 대한 소송",content:"① 제41조제3항ㆍ제4항, 제106조제3항, 제106조의2제3항, 제110조제2항제2호 및 제138조제4항에 따른 보상금 및 대가에 대하여 심결ㆍ결정 또는 재정을 받은 자가 그 보상금 또는 대가에 불복할 때에는 법원에 소송을 제기할 수 있다.\n② 제1항에 따른 소송은 심결ㆍ결정 또는 재정의 등본을 송달받은 날부터 30일 이내에 제기하여야 한다.\n③ 제2항에 따른 기간은 불변기간으로 한다."},
  {id:"p191",law:"특허법",article:"제191조",title:"보상금 소송의 피고적격",content:"제190조에 따른 소송에서는 다음 각 호의 어느 하나에 해당하는 자를 피고로 하여야 한다.\n1. 제41조제3항 및 제4항에 따른 보상금: 보상금을 지급하여야 하는 중앙행정기관의 장 또는 출원인\n2. 제106조제3항 및 제106조의2제3항에 따른 보상금: 보상금을 지급하여야 하는 중앙행정기관의 장, 특허권자, 전용실시권자 또는 통상실시권자\n3. 제110조제2항제2호 및 제138조제4항에 따른 대가: 통상실시권자ㆍ전용실시권자ㆍ특허권자ㆍ실용신안권자 또는 디자인권자"},
  {id:"p191_2",law:"특허법",article:"제191조의2",title:"변리사 보수 준용",content:"소송을 대리한 변리사의 보수에 관하여는 「민사소송법」 제109조를 준용한다. 이 경우 \"변호사\"는 \"변리사\"로 본다."},
  {id:"p192",law:"특허법",article:"제192조",title:"국제출원 자격",content:"지식재산처장에게 국제출원을 할 수 있는 자는 다음 각 호의 어느 하나에 해당하는 자로 한다.\n1. 대한민국 국민\n2. 국내에 주소 또는 영업소를 가진 외국인\n3. 제1호 또는 제2호에 해당하는 자를 대표자로 하여 국제출원을 하는 자\n4. 총리령으로 정하는 요건에 해당하는 자"},
  {id:"p193",law:"특허법",article:"제193조",title:"국제출원서 제출",content:"① 국제출원을 하려는 자는 총리령으로 정하는 언어로 작성한 출원서와 발명의 설명ㆍ청구범위ㆍ필요한 도면 및 요약서를 지식재산처장에게 제출하여야 한다.\n③ 발명의 설명은 통상의 기술자가 쉽게 실시할 수 있도록 명확하고 상세하게 적어야 한다.\n④ 청구범위는 보호를 받으려는 사항을 명확하고 간결하게 적어야 하며, 발명의 설명에 의하여 충분히 뒷받침되어야 한다."},
  {id:"p194",law:"특허법",article:"제194조",title:"국제출원일 인정",content:"① 지식재산처장은 국제출원이 지식재산처에 도달한 날을 국제출원일로 인정하여야 한다. 다만, 다음에 해당하는 경우에는 그러하지 아니하다.\n1. 출원인이 제192조 각 호에 해당하지 아니하는 경우\n2. 정해진 언어로 작성되지 아니한 경우\n3. 발명의 설명 또는 청구범위가 제출되지 아니한 경우\n4. 출원 표시ㆍ지정국ㆍ출원인 성명을 적지 아니한 경우\n② 지식재산처장은 해당 경우 기간을 정하여 보완을 명하여야 한다."},
  {id:"p195",law:"특허법",article:"제195조",title:"국제출원 방식심사",content:"지식재산처장은 국제출원이 다음 각 호의 어느 하나에 해당하는 경우에는 기간을 정하여 보정을 명하여야 한다.\n1. 발명의 명칭이 적혀 있지 아니한 경우\n2. 요약서가 제출되지 아니한 경우\n3. 제3조 또는 제197조제3항을 위반한 경우\n4. 총리령으로 정하는 방식을 위반한 경우"},
  {id:"p196",law:"특허법",article:"제196조",title:"국제출원 취하 간주",content:"① 다음 각 호의 어느 하나에 해당하는 국제출원은 취하된 것으로 본다.\n1. 제195조에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니한 경우\n2. 수수료를 정해진 기간에 내지 아니하여 PCT 제14조(3)(a)에 해당하게 된 경우\n3. 국제출원일 인정 후 총리령으로 정하는 기간에 제194조제1항 각 호에 해당하는 것이 발견된 경우"},
  {id:"p197",law:"특허법",article:"제197조",title:"공동 국제출원",content:"① 2인 이상이 공동으로 국제출원을 하는 경우에 제192조부터 제198조까지의 절차는 출원인의 대표자가 밟을 수 있다.\n③ 대리인에 의하여 절차를 밟으려는 자는 법정대리인을 제외하고는 변리사를 대리인으로 하여야 한다."},
  {id:"p198",law:"특허법",article:"제198조",title:"국제출원 수수료",content:"① 국제출원을 하려는 자는 수수료를 내야 한다.\n② 수수료, 그 납부방법 및 납부기간 등에 관하여 필요한 사항은 총리령으로 정한다."},
  {id:"p198_2",law:"특허법",article:"제198조의2",title:"국제조사기관 업무",content:"① 지식재산처는 국제사무국과 체결하는 협정에 따라 국제출원에 대한 국제조사기관 및 국제예비심사기관으로서의 업무를 수행한다.\n② 제1항에 따른 업무수행에 필요한 사항은 총리령으로 정한다."},
  {id:"p199",law:"특허법",article:"제199조",title:"국제특허출원의 효과",content:"① PCT에 따라 국제출원일이 인정된 국제출원으로서 대한민국을 지정국으로 지정한 국제출원은 그 국제출원일에 출원된 특허출원으로 본다.\n② 국제특허출원에 관하여는 제42조의2, 제42조의3 및 제54조를 적용하지 아니한다."},
  {id:"p200",law:"특허법",article:"제200조",title:"국제특허출원의 공지예외 적용",content:"국제특허출원된 발명에 관하여 제30조제1항제1호를 적용받으려는 자는 그 취지를 적은 서면 및 이를 증명할 수 있는 서류를 제30조제2항에도 불구하고 총리령으로 정하는 기간에 지식재산처장에게 제출할 수 있다."},
  {id:"p200_2",law:"특허법",article:"제200조의2",title:"국제특허출원의 출원서·명세서 간주",content:"① 국제특허출원의 국제출원일까지 제출된 출원서는 제42조제1항에 따라 제출된 특허출원서로 본다.\n② 국제출원일까지 제출된 발명의 설명, 청구범위 및 도면은 특허출원서에 최초로 첨부된 명세서 및 도면으로 본다.\n③ 국제특허출원의 요약서(외국어 출원의 경우 국어번역문)를 제42조제2항의 요약서로 본다."},
  {id:"p201",law:"특허법",article:"제201조",title:"국어번역문 제출",content:"① 국제특허출원을 외국어로 출원한 출원인은 우선일부터 2년 7개월(국내서면제출기간) 이내에 발명의 설명·청구범위·도면의 국어번역문 및 요약서의 국어번역문을 지식재산처장에게 제출하여야 한다.\n④ 국내서면제출기간에 발명의 설명 및 청구범위의 국어번역문을 제출하지 아니하면 그 국제특허출원을 취하한 것으로 본다."},
  {id:"p202",law:"특허법",article:"제202조",title:"국제특허출원의 우선권 특례",content:"① 국제특허출원에 관하여는 제55조제2항 및 제56조제2항을 적용하지 아니한다.\n② 우선권 주장을 수반하는 특허출원이 국제특허출원인 경우 일부 규정의 적용에 특례가 있다."},
  {id:"p203",law:"특허법",article:"제203조",title:"국내서면 제출",content:"① 국제특허출원의 출원인은 국내서면제출기간에 출원인 성명·주소, 대리인, 발명의 명칭, 발명자, 국제출원일 및 국제출원번호를 적은 서면을 지식재산처장에게 제출하여야 한다.\n④ 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하면 지식재산처장은 해당 국제특허출원을 무효로 할 수 있다."},
  {id:"p204",law:"특허법",article:"제204조",title:"PCT 제19조 보정서 제출",content:"① 국제특허출원의 출원인은 PCT 제19조(1)에 따라 국제조사보고서를 받은 후 청구범위에 보정을 한 경우 기준일까지 보정서의 국어번역문(외국어 출원) 또는 사본(국어 출원)을 지식재산처장에게 제출하여야 한다.\n④ 기준일까지 절차를 밟지 아니하면 PCT 제19조(1)에 따른 보정서는 제출되지 아니한 것으로 본다."},
  {id:"p205",law:"특허법",article:"제205조",title:"PCT 제34조 보정서 제출",content:"① 국제특허출원의 출원인은 PCT 제34조(2)(b)에 따라 보정을 한 경우 기준일까지 보정서의 국어번역문 또는 사본을 지식재산처장에게 제출하여야 한다.\n③ 기준일까지 절차를 밟지 아니하면 PCT 제34조(2)(b)에 따른 보정서는 제출되지 아니한 것으로 본다."},
  {id:"p206",law:"특허법",article:"제206조",title:"재외자 국제특허출원의 특례",content:"① 재외자인 국제특허출원의 출원인은 기준일까지는 제5조제1항에도 불구하고 특허관리인에 의하지 아니하고 특허에 관한 절차를 밟을 수 있다.\n② 국어번역문을 제출한 재외자는 총리령으로 정하는 기간에 특허관리인을 선임하여 신고하여야 한다.\n③ 선임신고가 없으면 그 국제특허출원은 취하된 것으로 본다."},
  {id:"p207",law:"특허법",article:"제207조",title:"국제특허출원의 출원공개",content:"① 국제특허출원에 관하여 출원공개 시 국내서면제출기간이 지난 후 공개하는 것을 원칙으로 한다.\n③ 출원공개 후 그 발명을 업으로 실시한 자에게 서면으로 경고할 수 있다.\n④ 경고를 받거나 출원공개된 발명임을 알고도 실시한 자에게 설정등록 전 기간의 보상금 지급을 청구할 수 있다."},
  {id:"p208",law:"특허법",article:"제208조",title:"국제특허출원의 보정 요건",content:"① 국제특허출원에 관하여는 다음 요건을 모두 갖추지 아니하면 보정을 할 수 없다.\n1. 수수료를 낼 것\n2. 국어번역문을 제출할 것(국어로 출원된 경우 제외)\n3. 기준일이 지날 것\n③ 외국어로 출원된 국제특허출원의 보정할 수 있는 범위에서 \"특허출원서에 최초로 첨부한 명세서 또는 도면\"은 \"국제출원일까지 제출한 발명의 설명, 청구범위 또는 도면\"으로 본다."},
    {id:"p209",law:"특허법",article:"제209조",title:"변경출원의 특례 (PCT 실용신안→특허)",content:"「실용신안법」 제34조제1항에 따라 국제출원일에 출원된 실용신안등록출원으로 보는 국제출원을 기초로 특허출원으로 변경출원을 하는 경우, 실용신안법에 따른 수수료를 내고 국어번역문을 제출한 후에만 변경출원을 할 수 있다."},
  {id:"p210",law:"특허법",article:"제210조",title:"PCT 실용신안등록출원에 대한 특례",content:"「실용신안법」 제34조제1항에 따라 국제출원일에 출원된 실용신안등록출원으로 보는 국제출원을 기초로 한 특허출원에 관하여는 제55조제1항을 준용한다."},
  {id:"p211",law:"특허법",article:"제211조",title:"수수료의 감면",content:"지식재산처장은 대통령령으로 정하는 자에 대하여 제82조제1항에 따른 수수료를 감면할 수 있다."},
  {id:"p212",law:"특허법",article:"제212조",title:"특허료의 감면",content:"지식재산처장은 대통령령으로 정하는 자에 대하여 특허료를 감면할 수 있다."},
  {id:"p213",law:"특허법",article:"제213조",title:"일반승계의 신고",content:"상속이나 그 밖의 일반승계의 경우에는 지체 없이 그 취지를 지식재산처장에게 신고하여야 한다."},
  {id:"p214",law:"특허법",article:"제214조",title:"특허권 등록의 효력",content:"특허권의 이전·포기·소멸·회복, 전용실시권의 설정·이전·변경·소멸, 통상실시권의 설정·이전·변경·소멸 등은 등록하지 아니하면 효력이 발생하지 아니한다."},
  {id:"p215",law:"특허법",article:"제215조",title:"특허원부",content:"① 지식재산처는 특허원부를 갖추어 두고 특허권의 설정등록, 이전, 소멸, 회복, 처분의 제한 또는 전용실시권 및 통상실시권에 관한 사항을 등록한다.\n② 특허원부는 전자적 방식으로 관리할 수 있다."},
  {id:"p216",law:"특허법",article:"제216조",title:"서류의 열람",content:"누구든지 특허에 관한 서류를 열람하거나 그 복사물의 교부를 청구할 수 있다. 다만, 대통령령으로 정하는 서류에 대해서는 그러하지 아니하다."},
  {id:"p217",law:"특허법",article:"제217조",title:"수수료의 반환",content:"지식재산처장은 특허에 관한 절차가 무효로 된 경우 등 대통령령으로 정하는 경우에는 납부된 수수료를 반환하여야 한다."},
  {id:"p218",law:"특허법",article:"제218조",title:"재외자의 특허관리인",content:"재외자(국내에 주소 또는 영업소가 없는 자)는 국내에 체류하는 경우를 제외하고는 특허관리인에 의하지 아니하면 특허에 관한 절차를 밟거나 행정청이 한 처분에 대하여 소를 제기할 수 없다."},
  {id:"p219",law:"특허법",article:"제219조",title:"특허관리인의 권한",content:"특허관리인은 위임된 권한의 범위에서 특허에 관한 모든 절차 및 행정청이 한 처분에 관한 소송을 대리할 수 있다. 권한은 서면으로 증명하여야 한다."},
  {id:"p220",law:"특허법",article:"제220조",title:"재외자에 대한 송달",content:"① 재외자로서 특허관리인이 있으면 송달할 서류는 특허관리인에게 송달하여야 한다.\n② 특허관리인이 없으면 항공등기우편으로 발송할 수 있으며, 발송일에 송달된 것으로 본다."},
  {id:"p221",law:"특허법",article:"제221조",title:"특허공보",content:"① 지식재산처장은 대통령령으로 정하는 바에 따라 특허공보를 발행하여야 한다.\n② 특허공보는 총리령으로 정하는 바에 따라 전자적 매체로 발행할 수 있다."},
  {id:"p222",law:"특허법",article:"제222조",title:"서류 등의 제출명령",content:"지식재산처장 또는 심사관은 당사자에게 특허취소신청·심판 또는 재심 외의 절차를 처리하기 위하여 필요한 서류나 그 밖의 물건의 제출을 명할 수 있다."},
  {id:"p223",law:"특허법",article:"제223조",title:"특허표시",content:"① 특허권자·전용실시권자·통상실시권자는 물건의 특허발명의 경우 그 물건에 '특허'라는 문자와 특허번호를 표시할 수 있다.\n② 특허출원인은 출원 중인 물건에 '특허출원(심사중)'이라는 문자와 출원번호를 표시할 수 있다."},
  {id:"p225",law:"특허법(벌칙)",article:"제225조",title:"침해죄",content:"① 특허권 또는 전용실시권을 침해한 자는 7년 이하의 징역 또는 1억원 이하의 벌금에 처한다.\n② 제1항의 죄는 피해자의 명시적인 의사에 반하여 공소를 제기할 수 없다. (반의사불벌죄)"},
  {id:"p226",law:"특허법(벌칙)",article:"제226조",title:"허위표시의 죄",content:"제224조를 위반한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."},
  {id:"p227",law:"특허법(벌칙)",article:"제227조",title:"사위행위의 죄",content:"사위 또는 그 밖의 부정한 행위로 특허·특허권 존속기간 연장등록·심결 또는 보정각하결정의 취소결정을 받은 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."},
  {id:"p228",law:"특허법(벌칙)",article:"제228조",title:"양벌규정",content:"법인의 대표자나 법인·개인의 대리인·사용인·종업원이 그 법인·개인의 업무에 관하여 제225조제1항 또는 제226조의 위반행위를 하면 그 행위자를 벌하는 외에 그 법인·개인에게도 해당 벌금형을 과한다. 다만, 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다."},
{id:"p224",law:"특허법(벌칙)",article:"제224조",title:"허위표시의 금지",content:"누구든지 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다.\n1. 특허된 것이 아닌 물건 또는 방법에 특허표시 또는 특허출원표시를 하거나 이와 혼동하기 쉬운 표시를 하는 행위\n2. 제1호의 표시를 한 것을 양도ㆍ대여 또는 전시하는 행위\n3. 광고ㆍ간판 또는 표찰에 특허 또는 특허출원된 것으로 표시하거나 혼동하기 쉬운 표시를 하는 행위"},
  {id:"p224_2",law:"특허법(벌칙)",article:"제224조의2",title:"다른 법률에 따른 불복 제한",content:"① 보정각하결정, 특허여부결정, 특허취소결정, 심결이나 각하결정에 대해서는 다른 법률에 따른 불복을 할 수 없으며, 이 법에 따라 불복할 수 없도록 규정되어 있는 처분에 대해서는 다른 법률에 따라 불복을 할 수 없다. ② 제1항에 따른 처분 외의 처분의 불복에 대해서는 「행정심판법」 또는 「행정소송법」에 따른다."},
  {id:"p224_3",law:"특허법(벌칙)",article:"제224조의3",title:"비밀유지명령",content:"① 법원은 특허권 또는 전용실시권의 침해에 관한 소송에서 당사자가 보유한 영업비밀에 대하여 소정의 사유를 소명한 경우 신청에 따라 결정으로 다른 당사자 등에게 그 영업비밀을 소송 수행 외의 목적으로 사용하거나 명령을 받은 자 외의 자에게 공개하지 아니할 것을 명할 수 있다. ④ 비밀유지명령은 결정서가 비밀유지명령을 받은 자에게 송달된 때부터 효력이 발생한다."},
  {id:"p224_4",law:"특허법(벌칙)",article:"제224조의4",title:"비밀유지명령의 취소",content:"① 비밀유지명령을 신청한 자 또는 받은 자는 요건을 갖추지 못하였거나 못하게 된 경우 법원에 비밀유지명령의 취소를 신청할 수 있다. ④ 비밀유지명령을 취소하는 재판은 확정되어야 효력이 발생한다."},
  {id:"p224_5",law:"특허법(벌칙)",article:"제224조의5",title:"소송기록 열람의 제한",content:"비밀유지명령이 내려진 소송에 관한 소송기록에 대하여 비밀 기재부분의 열람 청구가 있는 경우, 법원사무관등은 당사자에게 그 청구 사실을 알리고 2주일간 그 열람을 허가하여서는 아니 된다."},
  // === 벌칙 ===
  {id:"p226_2",law:"특허법(벌칙)",article:"제226조의2",title:"비밀누설죄 준용",content:"① 전문기관 또는 전담기관의 임직원이거나 임직원이었던 사람은 제226조제1항을 적용하는 경우에는 지식재산처 소속 직원 또는 직원이었던 사람으로 본다. ② 전문심리위원은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다."},
  {id:"p229",law:"특허법(벌칙)",article:"제229조",title:"사위행위죄",content:"거짓이나 그 밖의 부정한 행위로 특허, 특허권의 존속기간의 연장등록, 특허취소신청에 대한 결정 또는 심결을 받은 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."},
  {id:"p229_2",law:"특허법(벌칙)",article:"제229조의2",title:"비밀유지명령 위반죄",content:"① 국내외에서 정당한 사유 없이 제224조의3제1항에 따른 비밀유지명령을 위반한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. ② 제1항의 죄는 비밀유지명령을 신청한 자의 고소가 없으면 공소를 제기할 수 없다."},
  {id:"p229_3",law:"특허법(벌칙)",article:"제229조의3",title:"외국출원 금지 위반죄",content:"제41조제1항에 따른 외국에의 특허출원 금지 또는 비밀취급명령을 위반한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다."},
  {id:"p230",law:"특허법(벌칙)",article:"제230조",title:"양벌규정",content:"법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제225조제1항, 제228조, 제229조 또는 제229조의3의 위반행위를 하면 그 행위자를 벌하는 외에 법인에는 다음 각 호의 벌금형을 과한다. 다만, 상당한 주의와 감독을 게을리하지 아니한 경우에는 예외. 1. 제225조제1항의 경우: 3억원 이하의 벌금 2. 제228조·제229조의 경우: 6천만원 이하의 벌금 3. 제229조의3의 경우: 1억원 이하의 벌금"},
  {id:"p231",law:"특허법(벌칙)",article:"제231조",title:"몰수 등",content:"① 제225조제1항에 해당하는 침해행위를 조성한 물건 또는 그 침해행위로부터 생긴 물건은 몰수하거나 피해자의 청구에 따라 그 물건을 피해자에게 교부할 것을 선고하여야 한다. ② 피해자는 제1항에 따른 물건을 받은 경우에는 그 물건의 가액을 초과하는 손해액에 대해서만 배상을 청구할 수 있다."},
  {id:"p232",law:"특허법(벌칙)",article:"제232조",title:"과태료",content:"① 다음 각 호의 어느 하나에 해당하는 자에게는 50만원 이하의 과태료를 부과한다.\n1. 특허심판원에 대하여 거짓 진술을 한 자\n2. 증거조사 또는 증거보전에 관하여 서류 등 제출 명령을 정당한 이유 없이 따르지 아니한 자\n3. 증인ㆍ감정인 또는 통역인으로 소환되어 정당한 이유 없이 소환에 따르지 아니하거나 선서ㆍ진술 등을 거부한 자\n② 제1항에 따른 과태료는 대통령령으로 정하는 바에 따라 지식재산처장이 부과ㆍ징수한다."},
];

const LAW_COLORS = {
  "특허법": "#4A90D9",
  "특허법시행령": "#27AE60",
  "특허법시행규칙": "#E67E22",
};

// ─── FLASHCARD ────────────────────────────────────────────────────────────────
function FlashCard({ article, onNext, onPrev, current, total, onKnown }) {
  const [flipped, setFlipped] = useState(false);
  useEffect(() => setFlipped(false), [article?.id]);
  const color = LAW_COLORS[article?.law] || "#E67E22";

  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:24, width:"100%" }}>
      <div style={{ fontSize:12, color:"#555", letterSpacing:3 }}>{current+1} / {total}</div>

      <div onClick={() => setFlipped(f=>!f)}
        style={{ width:"100%", maxWidth:620, minHeight:300, cursor:"pointer", perspective:1200 }}>
        <div style={{
          position:"relative", width:"100%", minHeight:300,
          transformStyle:"preserve-3d",
          transition:"transform 0.55s cubic-bezier(.4,2,.55,1)",
          transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
        }}>
          <div style={{ position:"absolute", inset:0, backfaceVisibility:"hidden",
            background:`linear-gradient(145deg,#0c0c20,#171730)`,
            borderRadius:22, border:`1px solid ${color}33`,
            display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
            gap:14, padding:40, boxShadow:`0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 ${color}22` }}>
            <div style={{ fontSize:10, letterSpacing:4, color, textTransform:"uppercase", fontWeight:700, opacity:.9 }}>
              {article?.law}
            </div>
            <div style={{ fontSize:56, fontWeight:800, color:"#fff", fontFamily:"'Noto Serif KR',serif", lineHeight:1 }}>
              {article?.article}
            </div>
            <div style={{ fontSize:19, color:"#aaa", fontWeight:300 }}>{article?.title}</div>
            <div style={{ marginTop:20, fontSize:11, color:"#333", letterSpacing:2 }}>탭하여 내용 확인 ↗</div>
          </div>

          <div style={{ position:"absolute", inset:0, backfaceVisibility:"hidden",
            transform:"rotateY(180deg)",
            background:`linear-gradient(145deg,#090920,#111128)`,
            borderRadius:22, border:`1px solid ${color}55`,
            display:"flex", flexDirection:"column", justifyContent:"center",
            padding:36, boxShadow:`0 20px 60px rgba(0,0,0,.7)` }}>
            <div style={{ fontSize:10, letterSpacing:4, color, textTransform:"uppercase", fontWeight:700, marginBottom:18, opacity:.9 }}>
              {article?.law} {article?.article}
            </div>
            <div style={{ fontSize:15, color:"#ddd", lineHeight:2, fontFamily:"'Noto Sans KR',sans-serif" }}>
              {article?.content}
            </div>
          </div>
        </div>
      </div>

      {flipped && (
        <div style={{ display:"flex", gap:12 }}>
          {[{label:"✓ 외웠어요", color:"#27AE60"},{label:"✗ 다시 볼게요", color:"#E74C3C"}].map((b,i) => (
            <button key={b.label} onClick={() => { onKnown(i===0); onNext(); }}
              style={{ padding:"12px 26px", borderRadius:12,
                background:b.color+"18", color:b.color,
                border:`1px solid ${b.color}44`, fontWeight:700, fontSize:14,
                cursor:"pointer", fontFamily:"inherit", transition:"all .2s" }}>
              {b.label}
            </button>
          ))}
        </div>
      )}

      <div style={{ display:"flex", gap:10 }}>
        {[{l:"← 이전",f:onPrev},{l:"다음 →",f:onNext}].map(b => (
          <button key={b.l} onClick={b.f}
            style={{ padding:"10px 22px", borderRadius:10, border:"1px solid #222",
              background:"transparent", color:"#777", cursor:"pointer", fontSize:13, fontFamily:"inherit" }}>
            {b.l}
          </button>
        ))}
      </div>
    </div>
  );
}
