// 빈칸이 하나도 없을 때 쓸 fallback: 명사구 추출
function extractFallbackBlanks(content) {
  // 괄호 안 한자어, 따옴표 단어, 또는 2글자 이상 명사구
  const patterns = [
    /「[^」]+」/g,
    /"[^"]+"/g,
    /[가-힣]{3,8}(?:이란|이라|으로|에서|이|을|를|의|은|는|가)/g,
  ];
  const found = [];
  for (const p of patterns) {
    let m;
    const re = new RegExp(p.source, 'g');
    while ((m = re.exec(content)) !== null) {
      const word = m[0].replace(/[이란이라으로에서이을를의은는가]$/, '').replace(/[「」""]/g, '').trim();
      if (word.length >= 2) {
        const start = m.index;
        const end = m.index + m[0].length;
        const overlap = found.some(f => start < f.end && end > f.start);
        if (!overlap) found.push({ answer: word, start, end: start + word.length });
      }
      if (found.length >= 3) break;
    }
    if (found.length >= 1) break;
  }
  return found;
}

function extractBlanks(content) {
  if (!content) return { segments: [{ text: "", blankIdx: null }], blanks: [] };

  const found = [];

  for (const pattern of BLANK_PATTERNS) {
    const re = new RegExp(pattern.source, "g");
    let m;
    while ((m = re.exec(content)) !== null) {
      const start = m.index;
      const end = m.index + m[0].length;
      const overlap = found.some(f => start < f.end && end > f.start);
      if (!overlap) found.push({ answer: m[0], start, end });
      if (found.length >= 4) break;
    }
    if (found.length >= 4) break;
  }

  // 빈칸이 하나도 없으면 fallback
  if (found.length === 0) {
    const fallback = extractFallbackBlanks(content);
    found.push(...fallback);
  }

  // 그래도 없으면 첫 번째 명사구를 강제 추출
  if (found.length === 0) {
    const m = content.match(/[가-힣]{2,6}/g);
    if (m && m.length > 2) {
      const word = m[2];
      const idx = content.indexOf(word);
      if (idx >= 0) found.push({ answer: word, start: idx, end: idx + word.length });
    }
  }

  found.sort((a, b) => a.start - b.start);

  const segments = [];
  let cursor = 0;
  found.forEach((b, idx) => {
    if (cursor < b.start) segments.push({ text: content.slice(cursor, b.start), blankIdx: null });
    segments.push({ text: b.answer, blankIdx: idx });
    cursor = b.end;
  });
  if (cursor < content.length) segments.push({ text: content.slice(cursor), blankIdx: null });

  return { segments, blanks: found };
}

function normalizeAnswer(str) {
  return (str || "").trim().replace(/\s+/g, "");
}

function FillInBlank({ article, onNext }) {
  const content = article?.content || "";
  const articleId = article?.id;

  // article이 바뀔 때마다 새로 계산
  const [parsed, setParsed] = useState(() => extractBlanks(content));
  const [inputs, setInputs] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [aiComment, setAiComment] = useState("");

  const inputRefs = useRef({});

  useEffect(() => {
    const result = extractBlanks(article?.content || "");
    setParsed(result);
    setInputs({});
    setSubmitted(false);
    setAiComment("");
    inputRefs.current = {};
  }, [articleId]);

  const { segments, blanks } = parsed;
  const color = LAW_COLORS[article?.law] || "#E67E22";
  const filledCount = blanks.filter((_, i) => inputs[i]?.trim()).length;
  const allFilled = filledCount === blanks.length && blanks.length > 0;

  const handleSubmit = async () => {
    setSubmitted(true);
    const wrong = blanks.filter((b, i) => normalizeAnswer(inputs[i]) !== normalizeAnswer(b.answer));
    if (wrong.length === 0) {
      setAiComment("🎉 모두 정확합니다! 완벽해요.");
      return;
    }
    const wrongList = wrong.map(b => `✗ "${b.answer}"`).join("  ");
    setAiComment(`💡 틀린 답: ${wrongList}\n→ ${article.article}(${article.title}) 원문을 다시 읽어보세요.`);
  };

  const correctCount = submitted
    ? blanks.filter((b, i) => normalizeAnswer(inputs[i]) === normalizeAnswer(b.answer)).length
    : 0;

  // 빈칸이 없는 조문 처리
  if (blanks.length === 0) {
    return (
      <div style={{ width: "100%", maxWidth: 660, display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ background: "#0c0c1e", borderRadius: 18, padding: 28, border: `1px solid ${color}33` }}>
          <div style={{ fontSize: 10, letterSpacing: 4, color, textTransform: "uppercase", fontWeight: 700, marginBottom: 18 }}>
            {article?.law} {article?.article} · {article?.title}
          </div>
          <div style={{ fontSize: 15, color: "#ccc", lineHeight: 2 }}>{content}</div>
        </div>
        <div style={{ fontSize: 13, color: "#555", textAlign: "center", padding: "8px 0" }}>
          이 조문은 숫자/핵심용어 빈칸 대상이 없어요
        </div>
        <button onClick={onNext}
          style={{ padding: "13px 0", borderRadius: 12, border: "none",
            background: "#1a1a2e", color: "#aaa", fontWeight: 700,
            fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>
          다음 조문 →
        </button>
      </div>
    );
  }

  return (
    <div style={{ width: "100%", maxWidth: 660, display: "flex", flexDirection: "column", gap: 16 }}>
      {/* 조문 + 인라인 빈칸 */}
      <div style={{ background: "#0c0c1e", borderRadius: 18, padding: 28, border: `1px solid ${color}33` }}>
        <div style={{ fontSize: 10, letterSpacing: 4, color, textTransform: "uppercase", fontWeight: 700, marginBottom: 18 }}>
          {article?.law} {article?.article} · {article?.title}
        </div>
        <div style={{ fontSize: 15, color: "#ccc", lineHeight: 2.4, wordBreak: "keep-all" }}>
          {segments.map((seg, si) => {
            if (seg.blankIdx === null) {
              return <span key={si}>{seg.text}</span>;
            }
            const idx = seg.blankIdx;
            const ans = blanks[idx].answer;
            const userVal = inputs[idx] || "";
            const isCorrect = submitted
              ? normalizeAnswer(userVal) === normalizeAnswer(ans)
              : null;
            const inputWidth = Math.max(ans.length * 17 + 20, 55);

            return (
              <span key={si} style={{ display: "inline-flex", alignItems: "center", verticalAlign: "middle", margin: "0 2px" }}>
                {/* 번호 뱃지 */}
                <span style={{
                  fontSize: 9, fontWeight: 800, color: "#fff", background: color,
                  borderRadius: "50%", width: 15, height: 15,
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  marginRight: 2, flexShrink: 0, lineHeight: 1,
                }}>
                  {idx + 1}
                </span>

                {submitted ? (
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 3 }}>
                    <span style={{
                      padding: "1px 7px", borderRadius: 6, fontSize: 14, fontWeight: 700,
                      background: isCorrect ? "#27AE6025" : "#E74C3C25",
                      color: isCorrect ? "#2ecc71" : "#e74c3c",
                      border: `1px solid ${isCorrect ? "#27AE6050" : "#E74C3C50"}`,
                      textDecoration: isCorrect ? "none" : "line-through",
                    }}>
                      {userVal || "미입력"}
                    </span>
                    {!isCorrect && (
                      <span style={{
                        padding: "1px 7px", borderRadius: 6, fontSize: 14, fontWeight: 700,
                        background: "#27AE6025", color: "#2ecc71", border: "1px solid #27AE6050",

                  </span>
                ) : (
                  <input
                    ref={el => { inputRefs.current[idx] = el; }}
                    value={userVal}
                    onChange={e => setInputs(prev => ({ ...prev, [idx]: e.target.value }))}
                    onKeyDown={e => {
                      if (e.key === "Tab") {
                        e.preventDefault();

                        if (next) next.focus();

                      if (e.key === "Enter" && allFilled) handleSubmit();
                    }}
                    placeholder={"_".repeat(ans.length)}
                    style={{
                      width: inputWidth, fontSize: 14, fontWeight: 700,
                      padding: "2px 6px", borderRadius: 7,

        </div>
      </div>

      {/* 힌트바 */}
      {!submitted && (
        <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          {blanks.map((b, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "#555" }}>
              <span style={{ width: 15, height: 15, borderRadius: "50%", background: color,
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                fontSize: 9, fontWeight: 800, color: "#fff" }}>{i + 1}</span>
              {b.answer.length}글자
            </div>
          ))}
          <div style={{ marginLeft: "auto", fontSize: 11, color: "#333" }}>
            {filledCount}/{blanks.length} 입력 · Tab으로 이동
          </div>
        </div>
      )}

      {/* 제출/결과 */}
      {!submitted ? (
        <button onClick={handleSubmit} disabled={!allFilled}
          style={{
            padding: "14px 0", borderRadius: 12, border: "none",
            background: allFilled ? `linear-gradient(135deg,${color},#C0392B)` : "#0e0e1a",
            color: allFilled ? "#fff" : "#333",
            fontWeight: 700, fontSize: 15,
            cursor: allFilled ? "pointer" : "default", fontFamily: "inherit",
          }}>
          {allFilled ? "정답 확인 →" : `빈칸 ${blanks.length - filledCount}개 남음`}
        </button>
      ) : (
        <div style={{ background: "#070710", borderRadius: 14, padding: 20, border: "1px solid #1a1a2e" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
            <span style={{ fontSize: 32, fontWeight: 800,
              color: correctCount === blanks.length ? "#2ecc71" : correctCount > 0 ? "#F39C12" : "#e74c3c" }}>
              {correctCount}/{blanks.length}
            </span>
            <span style={{ fontSize: 22 }}>
              {correctCount === blanks.length ? "🎉" : correctCount > 0 ? "💪" : "📚"}
            </span>
          </div>
          
          {aiComment && <div style={{ fontSize: 13, color: "#ccc", lineHeight: 1.8, marginBottom: 10 }}>{aiComment}</div>}
          <button onClick={onNext}
            style={{ padding: "11px 28px", borderRadius: 10, background: "#27AE60",
              border: "none", color: "#fff", fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
            다음 조문 →
          </button>
        </div>
      )}
    </div>
  );
}


// ─── 내장 퀴즈 엔진 ────────────────────────────────────────────────────────────
function shuffleArr(arr) { return [...arr].sort(()=>Math.random()-0.5); }

function generateQuestions(articles) {
  const qs = [];

  // 오답 풀 — 모든 조문의 제목 / 번호 / 핵심어
  const allTitles = articles.map(x=>x.title);
  const allArts   = articles.map(x=>x.article);

  articles.forEach(a => {
    const { law, article:art, title, content } = a;
    const otherTitles = shuffleArr(allTitles.filter(t=>t!==title));
    const otherArts   = shuffleArr(allArts.filter(x=>x!==art));

    // ── 유형1: 조문 내용 핵심 빈칸 (숫자/용어) 사지선다 ──────────────────
    // 숫자+단위 패턴 전부 수집
    const numMatches = [...content.matchAll(/(\d+개월|\d+일|\d+년|\d+인|\d+회|\d+배)/g)];
    numMatches.forEach((m, mi) => {
      const correct = m[0];
      // 빈칸이 포함된 문장 추출
      const sentStart = content.lastIndexOf('。', m.index) + 1 || 0;
      const sentEnd   = content.indexOf('。', m.index + 1) || content.length;
      let sentence = content.slice(Math.max(0, sentStart), Math.min(content.length, m.index + 60));
      if (sentence.length > 80) sentence = sentence.slice(0, 80);
      const masked = sentence.replace(correct, '【___】');
      const pool = ['1개월','2개월','3개월','6개월','12개월','30일','14일','60일','2개월','1년','2년','3년','20년','2인','3인','1회','2회'];
      const fakes = shuffleArr(pool.filter(n=>n!==correct)).slice(0,3);
      const opts = shuffleArr([correct, ...fakes]);
      qs.push({
        id:`${a.id}_n${mi}`, law, art,
        q:`[${art} ${title}] 빈칸에 알맞은 것은?\n\n"${masked}..."`,
        opts, answer:correct,
        explain:`정답: ${correct}\n원문: ${content.slice(0, 120)}...`
      });
    });

    // ── 유형2: 핵심 법률용어 빈칸 사지선다 ───────────────────────────────
    const termPool = [
      '법정대리인','특허관리인','전용실시권','통상실시권','청구범위','발명의 설명',
      '무권리자','정당한 권리자','재외자','분할출원','설정등록','국어번역문',
      '자연법칙','기술적 사상','통상의 지식','선량한 풍속','공공의 질서',
      '전자문서','정보통신망','전자서명','우선권','보정명령','특허심판원',
    ];
    const termMatches = termPool.filter(t => content.includes(t));
    if (termMatches.length > 0) {
      const correct = termMatches[0];
      const idx = content.indexOf(correct);
      const snippet = content.slice(Math.max(0, idx-20), idx+correct.length+30).replace(correct, '【___】');
      const fakes = shuffleArr(termPool.filter(t=>t!==correct)).slice(0,3);
      const opts = shuffleArr([correct, ...fakes]);
      qs.push({
        id:`${a.id}_k`, law, art,
        q:`[${art} ${title}] 빈칸에 들어갈 법률 용어는?\n\n"...${snippet}..."`,
        opts, answer:correct,
        explain:`정답: ${correct}\n${art}(${title}) 원문: ${content.slice(0,120)}...`
      });
    }

    // ── 유형3: 제목 맞추기 (내용 힌트 포함) ─────────────────────────────
    if (otherTitles.length >= 3) {
      const hint = content.slice(0, 45) + '...';
      const opts = shuffleArr([title, ...otherTitles.slice(0,3)]);
      qs.push({
        id:`${a.id}_t`, law, art,
        q:`${law} ${art}, 다음 내용의 조문 제목은?\n\n"${hint}"`,
        opts, answer:title,
        explain:`${art}(${title})\n${content.slice(0,120)}...`
      });
    }

    // ── 유형4: 어느 조문 번호? (내용 → 번호) ────────────────────────────
    if (otherArts.length >= 3) {
      // 제목 없이 내용 일부만 보여줌
      const snippet = content.slice(10, 70) + '...';
      const opts = shuffleArr([art, ...otherArts.slice(0,3)]);
      qs.push({
        id:`${a.id}_w`, law, art,
        q:`다음은 ${law} 어느 조의 내용인가요?\n\n"${snippet}"`,
        opts, answer:art,
        explain:`${art}(${title})\n${content.slice(0,120)}...`
      });
    }
  });

  return shuffleArr(qs);
}

function AIQuiz({ articles }) {
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [confirmed, setConfirmed] = useState(false);
  const [score, setScore] = useState({correct:0, wrong:0});
  const [finished, setFinished] = useState(false);
  const [started, setStarted] = useState(false);

  const start = () => {
    const qs = generateQuestions(articles).slice(0, 15);
    setQuestions(qs); setIdx(0); setSelected(null);
    setConfirmed(false); setScore({correct:0,wrong:0});
    setFinished(false); setStarted(true);
  };

  const confirm = () => {
    if (!selected) return;
    setConfirmed(true);
    setScore(s => selected===questions[idx].answer ? {...s,correct:s.correct+1} : {...s,wrong:s.wrong+1});
  };

  const next = () => {
    if (idx+1 >= questions.length) { setFinished(true); return; }
    setIdx(i=>i+1); setSelected(null); setConfirmed(false);
  };

  if (!started) return (
    <div style={{textAlign:"center",padding:"50px 20px"}}>
      <div style={{fontSize:52,marginBottom:18}}>🎯</div>

  if (finished) {

    return (
      <div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:52,marginBottom:12}}>{pct>=80?"🏆":pct>=60?"👍":"💪"}</div>
        <div style={{fontSize:24,color:"#ddd",fontWeight:700,marginBottom:8}}>퀴즈 완료!</div>
        <div style={{fontSize:48,fontWeight:900,marginBottom:4,
          color:pct>=80?"#27AE60":pct>=60?"#F39C12":"#E74C3C"}}>{pct}점</div>

          다시 풀기
        </button>
      </div>
    );
  }

  const q = questions[idx];
  const isCorrect = selected === q.answer;
  const NUMS = ["①","②","③","④"];

  return (
    <div style={{width:"100%",maxWidth:620}}>

          <div style={{width:`${(idx/questions.length)*100}%`,height:"100%",
            background:"#4A90D9",borderRadius:4,transition:"width .3s"}}/>
        </div>
        <span style={{fontSize:12,color:"#555"}}>{idx+1}/{questions.length}</span>
        <span style={{fontSize:12,color:"#27AE60"}}>✓{score.correct}</span>

      </div>

      {/* 법률 배지 */}
      <div style={{fontSize:11,color:LAW_COLORS[q.law]||"#4A90D9",fontWeight:700,letterSpacing:2,marginBottom:10}}>

          let bg="#0a0a18", border="#1e1e3a", color="#bbb";
          if (confirmed) {
            if (opt===q.answer) { bg="#0a2a1a"; border="#27AE60"; color="#2ecc71"; }
            else if (opt===selected && !isCorrect) { bg="#2a0a0a"; border="#E74C3C"; color="#e74c3c"; }
          } else if (opt===selected) { bg="#101028"; border="#4A90D9"; color="#fff"; }
          return (
            <button key={i} onClick={()=>!confirmed&&setSelected(opt)}
              style={{padding:"12px 18px",borderRadius:10,border:`1.5px solid ${border}`,
                background:bg,color,fontSize:14,cursor:confirmed?"default":"pointer",
                textAlign:"left",fontFamily:"inherit",transition:"all .15s",lineHeight:1.6}}>
              <span style={{color:"#444",marginRight:10}}>{NUMS[i]}</span>{opt}
            </button>
          );
        })}
      </div>

      {/* 해설 */}
      {confirmed && (
        <div style={{padding:"14px 18px",borderRadius:10,marginBottom:20,
          background:isCorrect?"#071a10":"#1a0707",
          border:`1px solid ${isCorrect?"#27AE60":"#E74C3C"}`}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:6,
            color:isCorrect?"#2ecc71":"#e74c3c"}}>
            {isCorrect ? "✅ 정답!" : `❌ 오답 — 정답: ${q.answer}`}
          </div>
          <div style={{fontSize:12,color:"#888",lineHeight:1.8,whiteSpace:"pre-line"}}>{q.explain}</div>
        </div>
      )}

      {/* 버튼 */}
      {!confirmed
        ? <button onClick={confirm} disabled={!selected}
            style={{width:"100%",padding:"14px",borderRadius:12,border:"none",
              background:selected?"#4A90D9":"#111",color:"#fff",
              fontSize:15,fontWeight:700,cursor:selected?"pointer":"default",fontFamily:"inherit"}}>
            확인
          </button>
        : <button onClick={next}
            style={{width:"100%",padding:"14px",borderRadius:12,border:"none",
              background:"#27AE60",color:"#fff",
              fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {idx+1>=questions.length ? "결과 보기 →" : "다음 문제 →"}
          </button>
      }
    </div>
  );
}

// ─── DRIVE 설정 ───────────────────────────────────────────────────────────────
const DRIVE_API_KEY    = "AIzaSyDPx-aY-ZAauJZ677V7wwIz3YgLs00YwJY";
const DRIVE_ROOT_ID    = "1Sqeyw1k04x0C8X2Wnmphhf2xsepj2E-B";

async function driveList(folderId) {
  const q   = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&key=${DRIVE_API_KEY}&fields=files(id,name,mimeType)&orderBy=name&pageSize=200`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Drive API 오류 ${res.status}`);
  const data = await res.json();
  return data.files || [];
}

async function driveReadText(fileId, mimeType) {
  let url;
  if (mimeType === "application/vnd.google-apps.document") {
    url = `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=text/plain&key=${DRIVE_API_KEY}`;
  } else {
    url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${DRIVE_API_KEY}`;
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`파일 읽기 오류 ${res.status}`);
  return res.text();
}

// ─── DRIVE MODE ───────────────────────────────────────────────────────────────
function DriveMode() {
  const [path, setPath]       = useState([{ id: DRIVE_ROOT_ID, name: "법률 자료" }]);
  const [files, setFiles]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);
  const [viewing, setViewing] = useState(null);   // { name, content }
  const [viewLoading, setViewLoading] = useState(false);

  const currentFolder = path[path.length - 1];

  useEffect(() => {
    setLoading(true); setError(null); setFiles([]);
    driveList(currentFolder.id)
      .then(setFiles)
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [currentFolder.id]);

  const openFolder = f => {
    setPath(prev => [...prev, { id: f.id, name: f.name }]);
    setViewing(null);
  };

  const openFile = async f => {
    setViewLoading(true);
    setViewing({ name: f.name, content: null });
    try {
      const text = await driveReadText(f.id, f.mimeType);
      setViewing({ name: f.name, content: text });
    } catch (e) {
      setViewing({ name: f.name, content: `오류: ${e.message}` });
    } finally {
      setViewLoading(false);
    }
  };

  const goToPath = idx => {
    setPath(prev => prev.slice(0, idx + 1));
    setViewing(null);
  };

  const isFolder   = m => m === "application/vnd.google-apps.folder";
  const isReadable = m => ["application/vnd.google-apps.document","text/plain","application/octet-stream"].includes(m)
                       || m.startsWith("text/");

  const fileIcon = m => isFolder(m) ? "📁"
    : m.includes("document") ? "📄"
    : m.includes("spreadsheet") ? "📊"
    : m.includes("pdf") ? "📕"
    : "📝";

  // ── 파일 내용 뷰어 ──
  if (viewing) {
    return (
      <div style={{ width:"100%", maxWidth:720 }}>
        <button onClick={() => setViewing(null)}
          style={{ marginBottom:18, padding:"8px 18px", borderRadius:10, border:"1px solid #222",
            background:"transparent", color:"#aaa", cursor:"pointer", fontSize:13, fontFamily:"inherit" }}>
          ← 목록으로
        </button>
        <div style={{ fontSize:15, fontWeight:700, color:"#fff", marginBottom:16 }}>{viewing.name}</div>
        {viewLoading
          ? <div style={{ textAlign:"center", color:"#444", padding:60, fontSize:14 }}>불러오는 중...</div>
          : <div style={{ background:"#0b0b1d", borderRadius:14, padding:"24px 26px", border:"1px solid #1a1a2e",
              fontSize:14, color:"#ccc", lineHeight:2, whiteSpace:"pre-wrap",
              maxHeight:"65vh", overflowY:"auto" }}>
              {viewing.content || "(내용 없음)"}
            </div>
        }
      </div>
    );
  }

  // ── 폴더 목록 ──
  return (
    <div style={{ width:"100%", maxWidth:720 }}>
      {/* 경로 탐색 */}
      <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:22, flexWrap:"wrap" }}>
        {path.map((p, i) => (
          <React.Fragment key={p.id}>
            {i > 0 && <span style={{ color:"#333", fontSize:13 }}>/</span>}
            <button onClick={() => goToPath(i)}
              style={{ padding:"4px 13px", borderRadius:20, border:"1px solid #222",
                background: i===path.length-1 ? "#1a1a2e" : "transparent",
                color: i===path.length-1 ? "#fff" : "#555",
                cursor:"pointer", fontSize:12, fontFamily:"inherit" }}>
              {p.name}
            </button>
          </React.Fragment>
        ))}
      </div>

      {loading && <div style={{ textAlign:"center", color:"#444", padding:50, fontSize:14 }}>폴더 불러오는 중...</div>}
      {error   && <div style={{ color:"#e74c3c", textAlign:"center", padding:20, fontSize:13 }}>오류: {error}</div>}
      {!loading && !error && files.length===0 && (
        <div style={{ color:"#444", textAlign:"center", padding:50, fontSize:13 }}>파일이 없습니다</div>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {files.map(f => {
          const folder  = isFolder(f.mimeType);
          const readable = isReadable(f.mimeType);
          const clickable = folder || readable;
          return (
            <div key={f.id} onClick={() => folder ? openFolder(f) : (readable ? openFile(f) : null)}
              style={{ display:"flex", alignItems:"center", gap:14, padding:"15px 20px",
                background:"#0a0a18", borderRadius:12, border:"1px solid #111",
                cursor: clickable ? "pointer" : "default",
                opacity: clickable ? 1 : 0.4, transition:"border-color .15s" }}
              onMouseEnter={e => { if(clickable) e.currentTarget.style.borderColor="#2a2a3e"; }}
              onMouseLeave={e => { if(clickable) e.currentTarget.style.borderColor="#111"; }}>
              <span style={{ fontSize:22 }}>{fileIcon(f.mimeType)}</span>
              <span style={{ fontSize:14, color:"#ddd", flex:1 }}>{f.name}</span>
              {folder   && <span style={{ fontSize:11, color:"#333" }}>→</span>}
              {readable && !folder && <span style={{ fontSize:11, color:"#444" }}>열기</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── STATS RING ───────────────────────────────────────────────────────────────
function StatsRing({ known, total }) {
  const pct = total ? known/total : 0;
  const r = 24, circ = 2*Math.PI*r;
  return (
    <svg width={64} height={64} viewBox="0 0 64 64">
      <circle cx={32} cy={32} r={r} fill="none" stroke="#111" strokeWidth={5}/>
      <circle cx={32} cy={32} r={r} fill="none" stroke="#27AE60" strokeWidth={5}
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
        strokeLinecap="round" transform="rotate(-90 32 32)"
        style={{transition:"stroke-dashoffset .6s ease"}}/>
      <text x={32} y={37} textAnchor="middle" fontSize={13} fontWeight={700} fill="#fff">
        {known}/{total}
      </text>
    </svg>
  );
}
