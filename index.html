<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감정 기록 앱</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        #root {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .app-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .app-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .tab-navigation {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #e9ecef;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-content {
            padding: 30px;
            min-height: 500px;
        }

        /* 감정 기록 폼 */
        .emotion-form {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3rem;
        }

        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .emotion-chip {
            padding: 12px 20px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .emotion-chip:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .emotion-chip.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .add-custom-button {
            padding: 12px 20px;
            border: 2px dashed #667eea;
            border-radius: 25px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .add-custom-button:hover {
            background: #f8f9fa;
        }

        .intensity-slider {
            margin-top: 10px;
        }

        .intensity-slider label {
            display: block;
            margin-bottom: 5px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .intensity-slider input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e9ecef;
            outline: none;
        }

        .intensity-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .intensity-value {
            text-align: center;
            margin-top: 5px;
            font-weight: 600;
            color: #667eea;
        }

        .body-map-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .body-diagram {
            position: relative;
            width: 200px;
            height: 400px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            cursor: crosshair;
        }

        .body-3d-viewer {
            width: 500px;
            height: 600px;
            background: #1a1a2e;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .body-3d-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
        }

        .body-3d-controls label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #495057;
        }

        .body-3d-controls select {
            width: 100%;
            padding: 5px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .body-3d-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #495057;
        }

        .body-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s;
        }

        .body-point:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }

        .sensation-list {
            flex: 1;
        }

        .sensation-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #6c757d;
            font-weight: 500;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .save-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .save-button:hover {
            transform: translateY(-2px);
        }

        .save-button:active {
            transform: translateY(0);
        }

        /* 기록 목록 */
        .records-list {
            display: grid;
            gap: 20px;
        }

        .record-card {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .record-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .record-time {
            font-weight: 600;
            color: #667eea;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            padding: 5px 10px;
            border: none;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .action-button:hover {
            background: #dee2e6;
        }

        .record-emotions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .emotion-tag {
            padding: 5px 12px;
            background: white;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        /* 시각화 */
        .visualization-container {
            width: 100%;
            height: 600px;
        }

        .scale-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .scale-button {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scale-button:hover {
            border-color: #667eea;
        }

        .scale-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        #sine-wave-chart {
            width: 100%;
            height: 500px;
        }

        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 5px;
            pointer-events: none;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 데이터 스토리지
        const Storage = {
            save(records) {
                localStorage.setItem('emotionRecords', JSON.stringify(records));
            },
            load() {
                const data = localStorage.getItem('emotionRecords');
                return data ? JSON.parse(data) : [];
            }
        };

        // 미리 정의된 감정
        const predefinedEmotions = [
            '기쁨', '슬픔', '분노', '불안', '평온', '혼란', '외로움', '설렘',
            '짜증', '만족', '두려움', '희망'
        ];

        // 감정 색상 매핑
        const emotionColors = {
            '기쁨': '#FFD700',
            '슬픔': '#4169E1',
            '분노': '#DC143C',
            '불안': '#FFA500',
            '평온': '#87CEEB',
            '혼란': '#9370DB',
            '외로움': '#696969',
            '설렘': '#FF69B4',
            '짜증': '#FF6347',
            '만족': '#90EE90',
            '두려움': '#8B008B',
            '희망': '#FFB6C1'
        };

        // 신체 부위
        const bodyAreas = [
            '머리', '이마', '눈', '코', '입', '턱', '목', '어깨', '가슴', '배', '등', '팔', '손', '다리', '발'
        ];

        // 감각 타입
        const sensationTypes = [
            '압박', '열감', '통증', '떨림', '무거움', '텅빔', '뻐근함', '시원함', '저림', '가려움'
        ];

        // 장소 카테고리
        const locationCategories = [
            '집', '직장', '카페', '식당', '야외', '교통', '학교', '병원', '기타'
        ];

        // 감정 기록 폼 컴포넌트
        function EmotionRecordForm({ onSave }) {
            const [selectedEmotions, setSelectedEmotions] = useState([]);
            const [customEmotions, setCustomEmotions] = useState([]);
            const [emotionIntensities, setEmotionIntensities] = useState({});
            const [bodySensations, setBodySensations] = useState([]);
            const [timestamp, setTimestamp] = useState(new Date().toISOString().slice(0, 16));
            const [locationType, setLocationType] = useState('category');
            const [locationValue, setLocationValue] = useState('집');
            const [customCategories, setCustomCategories] = useState({});
            const [use3D, setUse3D] = useState(false);
            const [viewMode, setViewMode] = useState('surface');
            const [hoveredPart, setHoveredPart] = useState(null);

            const containerRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const controlsRef = useRef(null);
            const bodyPartsRef = useRef({});

            const allEmotions = [...predefinedEmotions, ...customEmotions];

            const toggleEmotion = (emotion) => {
                if (selectedEmotions.includes(emotion)) {
                    setSelectedEmotions(selectedEmotions.filter(e => e !== emotion));
                    const newIntensities = { ...emotionIntensities };
                    delete newIntensities[emotion];
                    setEmotionIntensities(newIntensities);
                } else {
                    setSelectedEmotions([...selectedEmotions, emotion]);
                    setEmotionIntensities({ ...emotionIntensities, [emotion]: 5 });
                }
            };

            const addCustomEmotion = () => {
                const emotion = prompt('새로운 감정을 입력하세요:');
                if (emotion && !allEmotions.includes(emotion)) {
                    setCustomEmotions([...customEmotions, emotion]);
                }
            };

            // 2D 클릭 처리
            const handleBodyClick = (e) => {
                const rect = e.target.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
                const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);

                const area = prompt(`신체 부위를 선택하세요:\n` + bodyAreas.join(', '));
                if (!area) return;

                const type = prompt('감각 타입을 선택하세요:\n' + sensationTypes.join(', '));
                if (!type) return;

                const description = prompt('구체적인 설명을 입력하세요:');

                setBodySensations([...bodySensations, {
                    x,
                    y,
                    area,
                    specificLocation: area,
                    sensationType: type,
                    description: description || ''
                }]);
            };

            const removeSensation = (index) => {
                setBodySensations(bodySensations.filter((_, i) => i !== index));
            };

            // 3D 씬 초기화
            useEffect(() => {
                if (!use3D || !containerRef.current) return;

                // 씬, 카메라, 렌더러 설정
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a2e);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(
                    50,
                    500 / 600,
                    0.1,
                    1000
                );
                camera.position.set(0, 1.5, 5);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(500, 600);
                renderer.shadowMap.enabled = true;
                containerRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // OrbitControls 설정
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 1.5, 0);
                controlsRef.current = controls;

                // 조명 추가
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);

                const frontLight = new THREE.DirectionalLight(0xffffff, 0.5);
                frontLight.position.set(0, 5, 10);
                scene.add(frontLight);

                // 3D 인체 모델 생성
                const bodyParts = {};

                // 머리
                const headGeometry = new THREE.SphereGeometry(0.25, 32, 32);
                const surfaceMaterial = new THREE.MeshPhongMaterial({
                    color: 0xf0d0b0,
                    transparent: true,
                    opacity: 0.95
                });
                const head = new THREE.Mesh(headGeometry, surfaceMaterial.clone());
                head.position.set(0, 2.5, 0);
                head.userData = { part: '머리', layer: 'surface' };
                scene.add(head);
                bodyParts.head = head;

                // 목
                const neckGeometry = new THREE.CylinderGeometry(0.12, 0.15, 0.3, 16);
                const neck = new THREE.Mesh(neckGeometry, surfaceMaterial.clone());
                neck.position.set(0, 2.15, 0);
                neck.userData = { part: '목', layer: 'surface' };
                scene.add(neck);
                bodyParts.neck = neck;

                // 몸통 (상체)
                const torsoGeometry = new THREE.CylinderGeometry(0.3, 0.35, 0.8, 16);
                const torso = new THREE.Mesh(torsoGeometry, surfaceMaterial.clone());
                torso.position.set(0, 1.6, 0);
                torso.userData = { part: '가슴', layer: 'surface' };
                scene.add(torso);
                bodyParts.torso = torso;

                // 배
                const bellyGeometry = new THREE.CylinderGeometry(0.35, 0.3, 0.5, 16);
                const belly = new THREE.Mesh(bellyGeometry, surfaceMaterial.clone());
                belly.position.set(0, 0.95, 0);
                belly.userData = { part: '배', layer: 'surface' };
                scene.add(belly);
                bodyParts.belly = belly;

                // 왼팔 (상완)
                const leftUpperArmGeometry = new THREE.CylinderGeometry(0.08, 0.09, 0.6, 12);
                const leftUpperArm = new THREE.Mesh(leftUpperArmGeometry, surfaceMaterial.clone());
                leftUpperArm.position.set(-0.45, 1.7, 0);
                leftUpperArm.rotation.z = Math.PI * 0.1;
                leftUpperArm.userData = { part: '팔', layer: 'surface' };
                scene.add(leftUpperArm);
                bodyParts.leftUpperArm = leftUpperArm;

                // 왼팔 (하완)
                const leftForearmGeometry = new THREE.CylinderGeometry(0.07, 0.08, 0.5, 12);
                const leftForearm = new THREE.Mesh(leftForearmGeometry, surfaceMaterial.clone());
                leftForearm.position.set(-0.6, 1.15, 0);
                leftForearm.userData = { part: '팔', layer: 'surface' };
                scene.add(leftForearm);
                bodyParts.leftForearm = leftForearm;

                // 왼손
                const leftHandGeometry = new THREE.SphereGeometry(0.09, 16, 16);
                const leftHand = new THREE.Mesh(leftHandGeometry, surfaceMaterial.clone());
                leftHand.position.set(-0.6, 0.85, 0);
                leftHand.userData = { part: '손', layer: 'surface' };
                scene.add(leftHand);
                bodyParts.leftHand = leftHand;

                // 오른팔 (상완)
                const rightUpperArm = leftUpperArm.clone();
                rightUpperArm.position.set(0.45, 1.7, 0);
                rightUpperArm.rotation.z = -Math.PI * 0.1;
                rightUpperArm.userData = { part: '팔', layer: 'surface' };
                scene.add(rightUpperArm);
                bodyParts.rightUpperArm = rightUpperArm;

                // 오른팔 (하완)
                const rightForearm = leftForearm.clone();
                rightForearm.position.set(0.6, 1.15, 0);
                rightForearm.userData = { part: '팔', layer: 'surface' };
                scene.add(rightForearm);
                bodyParts.rightForearm = rightForearm;

                // 오른손
                const rightHand = leftHand.clone();
                rightHand.position.set(0.6, 0.85, 0);
                rightHand.userData = { part: '손', layer: 'surface' };
                scene.add(rightHand);
                bodyParts.rightHand = rightHand;

                // 왼 허벅지
                const leftThighGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.8, 12);
                const leftThigh = new THREE.Mesh(leftThighGeometry, surfaceMaterial.clone());
                leftThigh.position.set(-0.15, 0.25, 0);
                leftThigh.userData = { part: '다리', layer: 'surface' };
                scene.add(leftThigh);
                bodyParts.leftThigh = leftThigh;

                // 왼 종아리
                const leftCalfGeometry = new THREE.CylinderGeometry(0.1, 0.09, 0.8, 12);
                const leftCalf = new THREE.Mesh(leftCalfGeometry, surfaceMaterial.clone());
                leftCalf.position.set(-0.15, -0.55, 0);
                leftCalf.userData = { part: '다리', layer: 'surface' };
                scene.add(leftCalf);
                bodyParts.leftCalf = leftCalf;

                // 왼발
                const leftFootGeometry = new THREE.BoxGeometry(0.12, 0.08, 0.25);
                const leftFoot = new THREE.Mesh(leftFootGeometry, surfaceMaterial.clone());
                leftFoot.position.set(-0.15, -0.98, 0.08);
                leftFoot.userData = { part: '발', layer: 'surface' };
                scene.add(leftFoot);
                bodyParts.leftFoot = leftFoot;

                // 오른 허벅지
                const rightThigh = leftThigh.clone();
                rightThigh.position.set(0.15, 0.25, 0);
                rightThigh.userData = { part: '다리', layer: 'surface' };
                scene.add(rightThigh);
                bodyParts.rightThigh = rightThigh;

                // 오른 종아리
                const rightCalf = leftCalf.clone();
                rightCalf.position.set(0.15, -0.55, 0);
                rightCalf.userData = { part: '다리', layer: 'surface' };
                scene.add(rightCalf);
                bodyParts.rightCalf = rightCalf;

                // 오른발
                const rightFoot = leftFoot.clone();
                rightFoot.position.set(0.15, -0.98, 0.08);
                rightFoot.userData = { part: '발', layer: 'surface' };
                scene.add(rightFoot);
                bodyParts.rightFoot = rightFoot;

                // 내부 장기들 (투명하게 시작)
                const internalMaterial = new THREE.MeshPhongMaterial({
                    color: 0xff6b6b,
                    transparent: true,
                    opacity: 0
                });

                // 심장
                const heartGeometry = new THREE.SphereGeometry(0.12, 16, 16);
                const heart = new THREE.Mesh(heartGeometry, internalMaterial.clone());
                heart.position.set(-0.05, 1.7, -0.1);
                heart.userData = { part: '심장', layer: 'internal' };
                scene.add(heart);
                bodyParts.heart = heart;

                // 위
                const stomachGeometry = new THREE.SphereGeometry(0.15, 16, 16);
                const stomach = new THREE.Mesh(stomachGeometry, internalMaterial.clone());
                stomach.position.set(0, 1.1, -0.05);
                stomach.userData = { part: '위', layer: 'internal' };
                scene.add(stomach);
                bodyParts.stomach = stomach;

                // 간
                const liverGeometry = new THREE.BoxGeometry(0.25, 0.15, 0.2);
                const liver = new THREE.Mesh(liverGeometry, internalMaterial.clone());
                liver.position.set(0.1, 1.3, -0.05);
                liver.userData = { part: '간', layer: 'internal' };
                scene.add(liver);
                bodyParts.liver = liver;

                bodyPartsRef.current = bodyParts;

                // Raycaster 설정 (클릭 감지)
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();

                const onMouseClick = (event) => {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(scene.children);

                    if (intersects.length > 0) {
                        const clickedObject = intersects[0].object;
                        if (clickedObject.userData.part) {
                            const area = clickedObject.userData.part;
                            const layer = clickedObject.userData.layer;

                            const type = prompt(`${area} (${layer === 'surface' ? '표면' : '내부'})\n감각 타입을 선택하세요:\n` + sensationTypes.join(', '));
                            if (!type) return;

                            const description = prompt('구체적인 설명을 입력하세요:');

                            setBodySensations(prev => [...prev, {
                                area,
                                specificLocation: area,
                                sensationType: type,
                                description: description || '',
                                layer: layer,
                                position: clickedObject.position.toArray()
                            }]);
                        }
                    }
                };

                renderer.domElement.addEventListener('click', onMouseClick);

                // 애니메이션 루프
                const animate = () => {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                // 클린업
                return () => {
                    renderer.domElement.removeEventListener('click', onMouseClick);
                    if (containerRef.current && renderer.domElement.parentNode === containerRef.current) {
                        containerRef.current.removeChild(renderer.domElement);
                    }
                    renderer.dispose();
                };

            const [dateTo, setDateTo] = useState('');

            const allBodyAreas = [...new Set(records.flatMap(r => r.bodySensations.map(s => s.area)))];

            // 필터링 로직
            const filteredRecords = records.filter(record => {
                // 감정 필터
                if (filterEmotion !== 'all' && !record.emotions.some(e => e.name === filterEmotion)) {
                    return false;
                }

                // 장소 필터
                if (filterLocation !== 'all' && record.location.value !== filterLocation) {
                    return false;
                }

                // 신체 부위 필터
                if (filterBody !== 'all' && !record.bodySensations.some(s => s.area === filterBody)) {
                    return false;
                }

                // 날짜 범위 필터
                const recordDate = new Date(record.timestamp);
                if (dateFrom && new Date(dateFrom) > recordDate) {
                    return false;
                }
                if (dateTo && new Date(dateTo) < recordDate) {
                    return false;
                }

                // 텍스트 검색
                if (searchText) {
                    const searchLower = searchText.toLowerCase();
                    const matchesEmotion = record.emotions.some(e => e.name.toLowerCase().includes(searchLower));
                    const matchesLocation = record.location.value.toLowerCase().includes(searchLower);
                    const matchesBody = record.bodySensations.some(s =>
                        s.area.toLowerCase().includes(searchLower) ||
                        s.sensationType.toLowerCase().includes(searchLower) ||
                        (s.description && s.description.toLowerCase().includes(searchLower))
                    );
                    const matchesCustom = record.customCategories &&
                        Object.entries(record.customCategories).some(([key, value]) =>
                            key.toLowerCase().includes(searchLower) ||
                            (value && value.toString().toLowerCase().includes(searchLower))
                        );

                    if (!matchesEmotion && !matchesLocation && !matchesBody && !matchesCustom) {
                        return false;
                    }
                }

                return true;
            });

                                <label>종료 날짜</label>

                                    type="date"
                                    value={dateTo}
                                    onChange={(e) => setDateTo(e.target.value)}

                        {/* 필터 초기화 버튼 */}
                        <button

                                        <div style={{ marginTop: '10px', color: '#6c757d', fontSize: '0.9rem' }}>
                                            {Object.entries(record.customCategories).map(([key, value]) => (

                                                    <strong>{key}</strong>: {value}

                            ))}

                    )}
                </div>
            );
        }

        // 숨은 키워드 시스템
        const hiddenKeywords = {
            manas: ['말나', '말나식', 'manas', 'ego', '자아'],
            alaya: ['아뢰야', 'alaya', '저장'],
            awareness: ['알아차림', 'awareness', 'mindfulness', '깨어있음', '관찰'],
            presence: ['현존', 'presence', 'being', '있음'],
            sacred: ['성', 'sacred', 'divine', '성스러움', '개입'],
            emptiness: ['공', '空', 'sunyata', 'emptiness', '비움']
        };

        // 키워드 감지 함수
        function detectHiddenCategories(records) {
            const detected = new Set();
            records.forEach(record => {
                if (record.customCategories) {
                    Object.keys(record.customCategories).forEach(key => {
                        const lowerKey = key.toLowerCase();
                        Object.keys(hiddenKeywords).forEach(category => {
                            if (hiddenKeywords[category].some(keyword =>
                                lowerKey.includes(keyword.toLowerCase())
                            )) {
                                detected.add(category);
                            }
                        });
                    });
                }
            });
            return detected;
        }

        // 장소 시각화 컴포넌트
        function LocationVisualization({ records }) {
            const svgRef = useRef();

            useEffect(() => {
                if (!records.length || !svgRef.current) return;

                const svg = d3.select(svgRef.current);
                svg.selectAll('*').remove();

                const width = svgRef.current.clientWidth;
                const height = svgRef.current.clientHeight;
                const margin = { top: 40, right: 40, bottom: 60, left: 60 };

                // 장소별 감정 집계
                const locationData = {};
                records.forEach(record => {
                    const loc = record.location.value;
                    if (!locationData[loc]) {
                        locationData[loc] = { total: 0, emotions: {} };
                    }
                    locationData[loc].total += record.emotions.length;
                    record.emotions.forEach(emotion => {
                        locationData[loc].emotions[emotion.name] =
                            (locationData[loc].emotions[emotion.name] || 0) + 1;
                    });
                });

                const data = Object.entries(locationData).map(([location, info]) => ({
                    location,
                    count: info.total
                })).sort((a, b) => b.count - a.count);

                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const g = svg.append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);

                // X축: 장소
                const xScale = d3.scaleBand()
                    .domain(data.map(d => d.location))
                    .range([0, innerWidth])
                    .padding(0.2);

                // Y축: 개수
                const yScale = d3.scaleLinear()
                    .domain([0, d3.max(data, d => d.count)])
                    .range([innerHeight, 0]);

                // 막대 그래프
                g.selectAll('rect')
                    .data(data)
                    .enter()
                    .append('rect')
                    .attr('x', d => xScale(d.location))
                    .attr('y', d => yScale(d.count))
                    .attr('width', xScale.bandwidth())
                    .attr('height', d => innerHeight - yScale(d.count))
                    .attr('fill', '#667eea')
                    .attr('rx', 5)
                    .style('cursor', 'pointer')
                    .on('mouseover', function(event, d) {
                        d3.select(this).attr('fill', '#764ba2');
                    })
                    .on('mouseout', function(event, d) {
                        d3.select(this).attr('fill', '#667eea');
                    });

                // 값 표시
                g.selectAll('text.value')
                    .data(data)
                    .enter()
                    .append('text')
                    .attr('class', 'value')
                    .attr('x', d => xScale(d.location) + xScale.bandwidth() / 2)
                    .attr('y', d => yScale(d.count) - 5)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '14px')
                    .attr('font-weight', 'bold')
                    .attr('fill', '#333')
                    .text(d => d.count);

                // X축
                g.append('g')
                    .attr('transform', `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(xScale))
                    .selectAll('text')
                    .attr('font-size', '12px');

                // Y축
                g.append('g')
                    .call(d3.axisLeft(yScale));

                // 제목
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', 20)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '16px')
                    .attr('font-weight', 'bold')
                    .text('장소별 감정 기록 빈도');

            }, [records]);

            return (
                <div>
                    <svg ref={svgRef} className="visualization-container"></svg>
                </div>
            );
        }

        // 신체 히트맵 컴포넌트
        function BodyHeatmap({ records }) {
            const svgRef = useRef();

            useEffect(() => {
                if (!records.length || !svgRef.current) return;

                const svg = d3.select(svgRef.current);
                svg.selectAll('*').remove();

                const width = svgRef.current.clientWidth;
                const height = svgRef.current.clientHeight;

                // 신체 부위별 감각 집계
                const bodyData = {};
                records.forEach(record => {
                    record.bodySensations.forEach(sensation => {
                        const area = sensation.area;
                        if (!bodyData[area]) {
                            bodyData[area] = { count: 0, emotions: new Set() };
                        }
                        bodyData[area].count += 1;
                        record.emotions.forEach(e => bodyData[area].emotions.add(e.name));
                    });
                });

                const data = Object.entries(bodyData).map(([area, info]) => ({
                    area,
                    count: info.count,
                    emotions: Array.from(info.emotions)
                })).sort((a, b) => b.count - a.count);

                // 최대 값 계산
                const maxCount = d3.max(data, d => d.count) || 1;

                // 색상 스케일
                const colorScale = d3.scaleLinear()
                    .domain([0, maxCount])
                    .range(['#e9ecef', '#667eea']);

                // 신체 다이어그램 영역
                const bodyWidth = 300;
                const bodyHeight = 500;
                const bodyX = (width - bodyWidth) / 2;
                const bodyY = 50;

                // 신체 윤곽
                const bodyG = svg.append('g')
                    .attr('transform', `translate(${bodyX},${bodyY})`);

                bodyG.append('rect')
                    .attr('width', bodyWidth)
                    .attr('height', bodyHeight)
                    .attr('fill', '#f8f9fa')
                    .attr('stroke', '#dee2e6')
                    .attr('stroke-width', 2)
                    .attr('rx', 10);

                // 신체 부위 매핑 (간단한 레이아웃)
                const bodyPositions = {
                    '머리': { x: 150, y: 50 },
                    '이마': { x: 150, y: 40 },
                    '눈': { x: 150, y: 60 },
                    '코': { x: 150, y: 70 },
                    '입': { x: 150, y: 80 },
                    '턱': { x: 150, y: 95 },
                    '목': { x: 150, y: 120 },
                    '어깨': { x: 150, y: 150 },
                    '가슴': { x: 150, y: 200 },
                    '배': { x: 150, y: 270 },
                    '등': { x: 150, y: 240 },
                    '팔': { x: 80, y: 200 },
                    '손': { x: 50, y: 280 },
                    '다리': { x: 150, y: 380 },
                    '발': { x: 150, y: 460 }
                };

                // 히트맵 원 그리기
                data.forEach(d => {
                    const pos = bodyPositions[d.area];
                    if (!pos) return;

                    const radius = 20 + (d.count / maxCount) * 30;

                    bodyG.append('circle')
                        .attr('cx', pos.x)
                        .attr('cy', pos.y)
                        .attr('r', radius)
                        .attr('fill', colorScale(d.count))
                        .attr('opacity', 0.7)
                        .attr('stroke', 'white')
                        .attr('stroke-width', 2)
                        .style('cursor', 'pointer')
                        .on('mouseover', function(event) {
                            d3.select(this).attr('opacity', 1);
                            // 툴팁 표시
                            const tooltip = d3.select('body').append('div')
                                .attr('class', 'tooltip')
                                .style('position', 'absolute')
                                .style('opacity', 1)
                                .html(`
                                    <strong>${d.area}</strong><br/>
                                    기록 수: ${d.count}<br/>
                                    감정: ${d.emotions.join(', ')}
                                `)
                                .style('left', (event.pageX + 10) + 'px')
                                .style('top', (event.pageY - 28) + 'px');
                        })
                        .on('mouseout', function() {
                            d3.select(this).attr('opacity', 0.7);
                            d3.selectAll('.tooltip').remove();
                        });

                    bodyG.append('text')
                        .attr('x', pos.x)
                        .attr('y', pos.y + 5)
                        .attr('text-anchor', 'middle')
                        .attr('font-size', '12px')
                        .attr('font-weight', 'bold')
                        .attr('fill', 'white')
                        .text(d.area);
                });

                // 범례
                const legendY = bodyY + bodyHeight + 30;
                const legendG = svg.append('g')
                    .attr('transform', `translate(${bodyX},${legendY})`);

                legendG.append('text')
                    .attr('x', 0)
                    .attr('y', 0)
                    .attr('font-size', '14px')
                    .text('기록 빈도:');

                const legendScale = d3.scaleLinear()
                    .domain([0, maxCount])
                    .range([0, 200]);

                const legendAxis = d3.axisBottom(legendScale)
                    .ticks(5);

                // 그라디언트
                const gradient = svg.append('defs')
                    .append('linearGradient')
                    .attr('id', 'heatmap-gradient')
                    .attr('x1', '0%')
                    .attr('x2', '100%');

                gradient.append('stop')
                    .attr('offset', '0%')
                    .attr('stop-color', '#e9ecef');

                gradient.append('stop')
                    .attr('offset', '100%')
                    .attr('stop-color', '#667eea');

                legendG.append('rect')
                    .attr('x', 0)
                    .attr('y', 10)
                    .attr('width', 200)
                    .attr('height', 20)
                    .style('fill', 'url(#heatmap-gradient)');

                legendG.append('g')
                    .attr('transform', 'translate(0,30)')
                    .call(legendAxis);

                // 제목
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', 20)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '16px')
                    .attr('font-weight', 'bold')
                    .text('신체 부위별 감각 히트맵');

            }, [records]);

            return (
                <div>
                    <svg ref={svgRef} className="visualization-container" style={{ height: '700px' }}></svg>
                </div>
            );
        }

        // 사인파 시각화 컴포넌트
        function SineWaveVisualization({ records }) {
            const svgRef = useRef();
            const [timeScale, setTimeScale] = useState('day'); // day, week, month, year

            useEffect(() => {
                if (!records.length || !svgRef.current) return;

                const svg = d3.select(svgRef.current);
                svg.selectAll('*').remove();

                const width = svgRef.current.clientWidth;
                const height = svgRef.current.clientHeight;
                const margin = { top: 40, right: 40, bottom: 60, left: 60 };
                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const g = svg.append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);

                // 시간 범위 계산
                const now = new Date();
                let startTime, endTime, cycleMs;

                switch(timeScale) {
                    case 'day':
                        startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        endTime = new Date(startTime.getTime() + 24 * 60 * 60 * 1000);
                        cycleMs = 24 * 60 * 60 * 1000;
                        break;
                    case 'week':
                        const dayOfWeek = now.getDay();
                        startTime = new Date(now.getTime() - dayOfWeek * 24 * 60 * 60 * 1000);
                        startTime.setHours(0, 0, 0, 0);
                        endTime = new Date(startTime.getTime() + 7 * 24 * 60 * 60 * 1000);
                        cycleMs = 7 * 24 * 60 * 60 * 1000;
                        break;
                    case 'month':
                        startTime = new Date(now.getFullYear(), now.getMonth(), 1);
                        endTime = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                        cycleMs = endTime.getTime() - startTime.getTime();
                        break;
                    case 'year':
                        startTime = new Date(now.getFullYear(), 0, 1);
                        endTime = new Date(now.getFullYear(), 11, 31);
                        cycleMs = endTime.getTime() - startTime.getTime();
                        break;
                }

                // X축: 시간 (0 to 2π)
                const xScale = d3.scaleLinear()
                    .domain([0, cycleMs])
                    .range([0, innerWidth]);

                // Y축: 사인파 값
                const yScale = d3.scaleLinear()
                    .domain([-1.5, 1.5])
                    .range([innerHeight, 0]);

                // 사인파 경로 생성
                const sineData = d3.range(0, cycleMs, cycleMs / 200).map(t => ({
                    time: t,
                    value: Math.sin((t / cycleMs) * 2 * Math.PI)
                }));

                const line = d3.line()
                    .x(d => xScale(d.time))
                    .y(d => yScale(d.value))
                    .curve(d3.curveNatural);

                // 사인파 그리기
                g.append('path')
                    .datum(sineData)
                    .attr('d', line)
                    .attr('fill', 'none')
                    .attr('stroke', '#dee2e6')
                    .attr('stroke-width', 2);

                // 감정 마커 추가
                const filteredRecords = records.filter(r => {
                    const recordTime = new Date(r.timestamp);
                    return recordTime >= startTime && recordTime < endTime;
                });

                const tooltip = d3.select('body').append('div')
                    .attr('class', 'tooltip')
                    .style('position', 'absolute')
                    .style('opacity', 0);

                filteredRecords.forEach(record => {
                    const recordTime = new Date(record.timestamp);
                    const timeOffset = recordTime.getTime() - startTime.getTime();
                    const sineValue = Math.sin((timeOffset / cycleMs) * 2 * Math.PI);

                    record.emotions.forEach(emotion => {
                        const color = emotionColors[emotion.name] || '#667eea';
                        const radius = 3 + emotion.intensity;

                        g.append('circle')
                            .attr('cx', xScale(timeOffset))
                            .attr('cy', yScale(sineValue))
                            .attr('r', radius)
                            .attr('fill', color)
                            .attr('stroke', 'white')
                            .attr('stroke-width', 2)
                            .style('cursor', 'pointer')
                            .on('mouseover', function(event) {
                                d3.select(this).transition().duration(200).attr('r', radius * 1.5);
                                tooltip.transition().duration(200).style('opacity', 1);
                                tooltip.html(`
                                    <strong>${emotion.name}</strong><br/>
                                    강도: ${emotion.intensity}<br/>
                                    시간: ${recordTime.toLocaleString('ko-KR')}<br/>
                                    장소: ${record.location.value}
                                `)
                                    .style('left', (event.pageX + 10) + 'px')
                                    .style('top', (event.pageY - 28) + 'px');
                            })
                            .on('mouseout', function() {
                                d3.select(this).transition().duration(200).attr('r', radius);
                                tooltip.transition().duration(200).style('opacity', 0);
                            });

                        // 감정 라벨
                        g.append('text')
                            .attr('x', xScale(timeOffset))
                            .attr('y', yScale(sineValue) - radius - 5)
                            .attr('text-anchor', 'middle')
                            .attr('font-size', '10px')
                            .attr('fill', '#333')
                            .text(emotion.name);
                    });
                });

                // X축
                const xAxis = d3.axisBottom(xScale)
                    .ticks(10)
                    .tickFormat(d => {
                        const t = new Date(startTime.getTime() + d);
                        switch(timeScale) {
                            case 'day':
                                return t.getHours() + '시';
                            case 'week':
                                return ['일', '월', '화', '수', '목', '금', '토'][t.getDay()];
                            case 'month':
                                return t.getDate() + '일';
                            case 'year':
                                return (t.getMonth() + 1) + '월';
                        }
                    });

                g.append('g')
                    .attr('transform', `translate(0,${innerHeight})`)
                    .call(xAxis);

                // Y축
                g.append('g')
                    .call(d3.axisLeft(yScale));

                // 제목
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', 20)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '16px')
                    .attr('font-weight', 'bold')
                    .text(`감정의 시간 흐름 (${
                        timeScale === 'day' ? '하루' :
                        timeScale === 'week' ? '일주일' :
                        timeScale === 'month' ? '한 달' : '일 년'
                    })`);

            }, [records, timeScale]);

            return (
                <div>
                    <div className="scale-buttons">
                        <button
                            className={`scale-button ${timeScale === 'day' ? 'active' : ''}`}
                            onClick={() => setTimeScale('day')}
                        >
                            하루
                        </button>
                        <button
                            className={`scale-button ${timeScale === 'week' ? 'active' : ''}`}
                            onClick={() => setTimeScale('week')}
                        >
                            일주일
                        </button>
                        <button
                            className={`scale-button ${timeScale === 'month' ? 'active' : ''}`}
                            onClick={() => setTimeScale('month')}
                        >
                            한 달
                        </button>
                        <button
                            className={`scale-button ${timeScale === 'year' ? 'active' : ''}`}
                            onClick={() => setTimeScale('year')}
                        >
                            일 년
                        </button>
                    </div>
                    <svg ref={svgRef} id="sine-wave-chart" className="visualization-container"></svg>
                </div>
            );
        }

        // 시각화 탭 컴포넌트 (하위 탭 포함)
        function VisualizationTabs({ records }) {
            const [vizType, setVizType] = useState('time');

            return (
                <div>
                    <div className="scale-buttons" style={{ marginBottom: '20px' }}>
                        <button
                            className={`scale-button ${vizType === 'time' ? 'active' : ''}`}
                            onClick={() => setVizType('time')}
                        >
                            ⏰ 시간
                        </button>
                        <button
                            className={`scale-button ${vizType === 'location' ? 'active' : ''}`}
                            onClick={() => setVizType('location')}
                        >
                            📍 장소
                        </button>
                        <button
                            className={`scale-button ${vizType === 'body' ? 'active' : ''}`}
                            onClick={() => setVizType('body')}
                        >
                            🫀 신체
                        </button>
                    </div>

                    {vizType === 'time' && <SineWaveVisualization records={records} />}
                    {vizType === 'location' && <LocationVisualization records={records} />}
                    {vizType === 'body' && <BodyHeatmap records={records} />}
                </div>
            );
        }

        // 데이터 내보내기 함수
        function exportToJSON(records) {
            const dataStr = JSON.stringify(records, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `emotion-records-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function exportToCSV(records) {
            const headers = ['시간', '감정', '강도', '장소', '신체 부위', '감각 타입', '설명'];
            const rows = records.flatMap(record => {
                if (record.emotions.length === 0) {
                    return [[
                        new Date(record.timestamp).toLocaleString('ko-KR'),
                        '', '',
                        record.location.value,
                        '', '', ''
                    ]];
                }
                return record.emotions.map(emotion => [
                    new Date(record.timestamp).toLocaleString('ko-KR'),
                    emotion.name,
                    emotion.intensity,
                    record.location.value,
                    record.bodySensations.map(s => s.area).join('; '),
                    record.bodySensations.map(s => s.sensationType).join('; '),
                    record.bodySensations.map(s => s.description).join('; ')
                ]);
            });

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            const dataBlob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `emotion-records-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // 메인 앱 컴포넌트
        function App() {
            const [activeTab, setActiveTab] = useState('record');
            const [records, setRecords] = useState([]);
            const [hiddenModesDetected, setHiddenModesDetected] = useState(new Set());

            useEffect(() => {
                const loaded = Storage.load();
                setRecords(loaded);
                setHiddenModesDetected(detectHiddenCategories(loaded));
            }, []);

            const handleSaveRecord = (record) => {
                const newRecords = [...records, record];
                setRecords(newRecords);
                Storage.save(newRecords);
                setHiddenModesDetected(detectHiddenCategories(newRecords));
                setActiveTab('list');
            };

            const handleDeleteRecord = (id) => {
                if (confirm('이 기록을 삭제하시겠습니까?')) {
                    const newRecords = records.filter(r => r.id !== id);
                    setRecords(newRecords);
                    Storage.save(newRecords);
                    setHiddenModesDetected(detectHiddenCategories(newRecords));
                }
            };

            return (
                <div className="app-container">
                    <div className="app-header">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <h1 style={{ margin: 0 }}>Emoscape v1.0</h1>
                            {records.length > 0 && (
                                <div style={{ display: 'flex', gap: '10px' }}>
                                    <button
                                        onClick={() => exportToJSON(records)}
                                        style={{
                                            padding: '10px 20px',
                                            background: 'rgba(255,255,255,0.3)',
                                            color: 'white',
                                            border: '2px solid white',
                                            borderRadius: '10px',
                                            cursor: 'pointer',
                                            fontSize: '0.9rem',
                                            fontWeight: '600',
                                            transition: 'all 0.3s'
                                        }}
                                        onMouseOver={(e) => e.target.style.background = 'rgba(255,255,255,0.5)'}
                                        onMouseOut={(e) => e.target.style.background = 'rgba(255,255,255,0.3)'}
                                    >
                                        JSON 내보내기
                                    </button>
                                    <button
                                        onClick={() => exportToCSV(records)}
                                        style={{
                                            padding: '10px 20px',
                                            background: 'rgba(255,255,255,0.3)',
                                            color: 'white',
                                            border: '2px solid white',
                                            borderRadius: '10px',
                                            cursor: 'pointer',
                                            fontSize: '0.9rem',
                                            fontWeight: '600',
                                            transition: 'all 0.3s'
                                        }}
                                        onMouseOver={(e) => e.target.style.background = 'rgba(255,255,255,0.5)'}
                                        onMouseOut={(e) => e.target.style.background = 'rgba(255,255,255,0.3)'}
                                    >
                                        CSV 내보내기
                                    </button>
                                </div>
                            )}
                        </div>
                        <p>감정을 시간, 장소, 신체와 함께 기록하고 시각화하세요</p>
                        {hiddenModesDetected.size > 0 && (
                            <div style={{
                                marginTop: '10px',
                                padding: '10px',
                                background: 'rgba(255,255,255,0.2)',
                                borderRadius: '10px',
                                fontSize: '0.9rem'
                            }}>
                                ✨ 확장 모드 활성화됨
                            </div>
                        )}
                    </div>

                    <div className="tab-navigation">
                        <button
                            className={`tab-button ${activeTab === 'record' ? 'active' : ''}`}
                            onClick={() => setActiveTab('record')}
                        >
                            📝 기록하기
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'list' ? 'active' : ''}`}
                            onClick={() => setActiveTab('list')}
                        >
                            📋 기록 목록
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'visualize' ? 'active' : ''}`}
                            onClick={() => setActiveTab('visualize')}
                        >
                            📊 시각화
                        </button>
                    </div>

                    <div className="tab-content">
                        {activeTab === 'record' && <EmotionRecordForm onSave={handleSaveRecord} />}
                        {activeTab === 'list' && <RecordsList records={records} onDelete={handleDeleteRecord} />}
                        {activeTab === 'visualize' && <VisualizationTabs records={records} />}
                    </div>
                </div>
            );
        }

        // 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
